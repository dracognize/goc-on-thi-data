iddle" dominant-baseline="middle" fill="#1e1e1e">Màu viền figure</text><text x="85.0" y="384.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">transparent</text><text x="382.0" y="384.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">True → nền trong suốt</text><text x="85.0" y="456.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">bbox_inches</text><text x="382.0" y="446.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">&quot;tight&quot; → cắt khoảng trắng thừa quanh</text><text x="382.0" y="466.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">hình</text><text x="85.0" y="538.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">pad_inches</text><text x="382.0" y="528.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Lề khi dùng bbox_inches=&quot;tight&quot; (mặc</text><text x="382.0" y="548.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">định 0.1)</text><text x="85.0" y="610.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">format</text><text x="382.0" y="610.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Định dạng khi fname không có đuôi</text><text x="85.0" y="672.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">metadata</text><text x="382.0" y="672.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Thông tin meta (tác giả, mô tả)</text></svg>