<svg xmlns="http://www.w3.org/2000/svg" viewBox="-24 -24 682 416" font-family="Excalifont, 'Segoe Print', 'Comic Sans MS', 'Comic Neue', cursive"><rect x="-24" y="-24" width="100%" height="100%" fill="#fff"/><defs><marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#495057"/></marker></defs><rect x="0" y="0" width="341" height="53.75" rx="14" fill="#495057" stroke="#495057" stroke-width="2"/><rect x="353" y="0" width="281" height="53.75" rx="14" fill="#1971c2" stroke="#1971c2" stroke-width="2"/><rect x="0" y="71.75" width="341" height="50.0" rx="14" fill="#f1f3f5" stroke="#495057" stroke-width="2"/><rect x="353" y="71.75" width="281" height="50.0" rx="14" fill="#d0ebff" stroke="#1971c2" stroke-width="2"/><rect x="0" y="133.75" width="341" height="70.0" rx="14" fill="#f1f3f5" stroke="#495057" stroke-width="2"/><rect x="353" y="133.75" width="281" height="70.0" rx="14" fill="#d0ebff" stroke="#1971c2" stroke-width="2"/><rect x="0" y="215.75" width="341" height="70.0" rx="14" fill="#f1f3f5" stroke="#495057" stroke-width="2"/><rect x="353" y="215.75" width="281" height="70.0" rx="14" fill="#d0ebff" stroke="#1971c2" stroke-width="2"/><rect x="0" y="297.75" width="341" height="70.0" rx="14" fill="#f1f3f5" stroke="#495057" stroke-width="2"/><rect x="353" y="297.75" width="281" height="70.0" rx="14" fill="#d0ebff" stroke="#1971c2" stroke-width="2"/><text x="170.5" y="26.875" font-size="19" text-anchor="middle" dominant-baseline="middle" fill="#ffffff">Khi nên dùng</text><text x="493.5" y="26.875" font-size="19" text-anchor="middle" dominant-baseline="middle" fill="#ffffff">Ưu điểm</text><text x="170.5" y="96.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">So nhiều nhóm cùng cấu trúc</text><text x="493.5" y="96.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">So sánh trực quan dễ</text><text x="170.5" y="158.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Tránh lộn xộn khi vẽ tất cả vào</text><text x="170.5" y="178.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">một hình</text><text x="493.5" y="168.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Tránh chồng chéo dữ liệu</text><text x="170.5" y="240.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Cần thấy xu hướng/khác biệt</text><text x="170.5" y="260.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">theo danh mục</text><text x="493.5" y="240.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Giữ nhất quán giữa các</text><text x="493.5" y="260.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">nhóm</text><text x="170.5" y="332.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Trực quan đa chiều mà vẫn rõ</text><text x="493.5" y="322.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Hợp dashboard, báo cáo</text><text x="493.5" y="342.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">kinh doanh</text></svg>