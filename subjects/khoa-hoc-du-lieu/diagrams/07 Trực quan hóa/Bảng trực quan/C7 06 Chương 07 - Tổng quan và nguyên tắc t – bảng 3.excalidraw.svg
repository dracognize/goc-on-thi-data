<svg xmlns="http://www.w3.org/2000/svg" viewBox="-24 -24 1042 314" font-family="Excalifont, 'Segoe Print', 'Comic Sans MS', 'Comic Neue', cursive"><rect x="-24" y="-24" width="100%" height="100%" fill="#fff"/><defs><marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#495057"/></marker></defs><rect x="0" y="0" width="170" height="53.75" rx="14" fill="#495057" stroke="#495057" stroke-width="2"/><rect x="182" y="0" width="400" height="53.75" rx="14" fill="#1971c2" stroke="#1971c2" stroke-width="2"/><rect x="594" y="0" width="400" height="53.75" rx="14" fill="#2f9e44" stroke="#2f9e44" stroke-width="2"/><rect x="0" y="71.75" width="170" height="50.0" rx="14" fill="#f1f3f5" stroke="#495057" stroke-width="2"/><rect x="182" y="71.75" width="400" height="50.0" rx="14" fill="#d0ebff" stroke="#1971c2" stroke-width="2"/><rect x="594" y="71.75" width="400" height="50.0" rx="14" fill="#d3f9d8" stroke="#2f9e44" stroke-width="2"/><rect x="0" y="133.75" width="170" height="50.0" rx="14" fill="#f1f3f5" stroke="#495057" stroke-width="2"/><rect x="182" y="133.75" width="400" height="50.0" rx="14" fill="#d0ebff" stroke="#1971c2" stroke-width="2"/><rect x="594" y="133.75" width="400" height="50.0" rx="14" fill="#d3f9d8" stroke="#2f9e44" stroke-width="2"/><rect x="0" y="195.75" width="170" height="70.0" rx="14" fill="#f1f3f5" stroke="#495057" stroke-width="2"/><rect x="182" y="195.75" width="400" height="70.0" rx="14" fill="#d0ebff" stroke="#1971c2" stroke-width="2"/><rect x="594" y="195.75" width="400" height="70.0" rx="14" fill="#d3f9d8" stroke="#2f9e44" stroke-width="2"/><text x="85.0" y="26.875" font-size="19" text-anchor="middle" dominant-baseline="middle" fill="#ffffff">—</text><text x="382.0" y="26.875" font-size="19" text-anchor="middle" dominant-baseline="middle" fill="#ffffff">Khám phá (exploration)</text><text x="794.0" y="26.875" font-size="19" text-anchor="middle" dominant-baseline="middle" fill="#ffffff">Giải thích (explanation)</text><text x="85.0" y="96.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Người xem</text><text x="382.0" y="96.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Chính người phân tích</text><text x="794.0" y="96.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Người khác (sếp, khách hàng)</text><text x="85.0" y="158.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Kiểu hình</text><text x="382.0" y="158.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Nhanh, giản lược, vẽ nhiều</text><text x="794.0" y="158.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Chọn lọc, chăm chút thiết kế</text><text x="85.0" y="230.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Mục tiêu</text><text x="382.0" y="220.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">&quot;Soi&quot; dữ liệu: xu hướng, mẫu lặp,</text><text x="382.0" y="240.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">ngoại lệ, đặt câu hỏi tiếp</text><text x="794.0" y="220.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Truyền một thông điệp rõ, nhấn kết</text><text x="794.0" y="240.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">luận chính và bối cảnh</text></svg>