/text><text x="411.0" y="96.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Biểu đồ chất lượng cao, phù hợp công</text><text x="411.0" y="116.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">bố và in ấn</text><text x="99.5" y="178.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Ai khởi xướng,</text><text x="99.5" y="198.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">năm nào</text><text x="411.0" y="188.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">John Hunter, năm 2002</text><text x="99.5" y="270.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Lấy cảm hứng từ</text><text x="411.0" y="260.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Giao diện vẽ giống MATLAB trong</text><text x="411.0" y="280.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Python</text><text x="99.5" y="352.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Hợp tác với</text><text x="411.0" y="342.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Cộng đồng IPython → nay là Jupyter</text><text x="411.0" y="362.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">notebook, vẽ tương tác dễ hơn</text><text x="99.5" y="434.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Định dạng xuất</text><text x="411.0" y="424.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Cả vector (PDF, SVG) và raster (JPG,</text><text x="411.0" y="444.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">PNG, BMP, GIF)</text></svg>