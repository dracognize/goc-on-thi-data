<svg xmlns="http://www.w3.org/2000/svg" viewBox="-24 -24 1042 374" font-family="Excalifont, 'Segoe Print', 'Comic Sans MS', 'Comic Neue', cursive"><rect x="-24" y="-24" width="100%" height="100%" fill="#fff"/><defs><marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#495057"/></marker></defs><rect x="0" y="0" width="170" height="53.75" rx="14" fill="#495057" stroke="#495057" stroke-width="2"/><rect x="182" y="0" width="400" height="53.75" rx="14" fill="#1971c2" stroke="#1971c2" stroke-width="2"/><rect x="594" y="0" width="400" height="53.75" rx="14" fill="#2f9e44" stroke="#2f9e44" stroke-width="2"/><rect x="0" y="71.75" width="170" height="90.0" rx="14" fill="#f1f3f5" stroke="#495057" stroke-width="2"/><rect x="182" y="71.75" width="400" height="90.0" rx="14" fill="#d0ebff" stroke="#1971c2" stroke-width="2"/><rect x="594" y="71.75" width="400" height="90.0" rx="14" fill="#d3f9d8" stroke="#2f9e44" stroke-width="2"/><rect x="0" y="173.75" width="170" height="70.0" rx="14" fill="#f1f3f5" stroke="#495057" stroke-width="2"/><rect x="182" y="173.75" width="400" height="70.0" rx="14" fill="#d0ebff" stroke="#1971c2" stroke-width="2"/><rect x="594" y="173.75" width="400" height="70.0" rx="14" fill="#d3f9d8" stroke="#2f9e44" stroke-width="2"/><rect x="0" y="255.75" width="170" height="70.0" rx="14" fill="#f1f3f5" stroke="#495057" stroke-width="2"/><rect x="182" y="255.75" width="400" height="70.0" rx="14" fill="#d0ebff" stroke="#1971c2" stroke-width="2"/><rect x="594" y="255.75" width="400" height="70.0" rx="14" fill="#d3f9d8" stroke="#2f9e44" stroke-width="2"/><text x="85.0" y="26.875" font-size="19" text-anchor="middle" dominant-baseline="middle" fill="#ffffff">Nguyên tắc</text><text x="382.0" y="26.875" font-size="19" text-anchor="middle" dominant-baseline="middle" fill="#ffffff">Làm gì</text><text x="794.0" y="26.875" font-size="19" text-anchor="middle" dominant-baseline="middle" fill="#ffffff">Tránh gì</text><text x="85.0" y="116.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Rõ ràng</text><text x="382.0" y="96.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Mã hóa phù hợp: vị trí/độ dài tốt hơn</text><text x="382.0" y="116.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">góc/diện tích. Dùng màu tiết kiệm để</text><text x="382.0" y="136.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">phân nhóm hoặc nhấn mạnh</text><text x="794.0" y="106.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">3D không cần thiết, hiệu ứng rườm rà,</text><text x="794.0" y="126.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">tỷ lệ trục méo</text><text x="85.0" y="208.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Trung thực</text><text x="382.0" y="208.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Ghi đơn vị và nguồn dữ liệu</text><text x="794.0" y="198.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">&quot;Bẻ&quot; trục gây hiểu lầm, cắt bớt bối</text><text x="794.0" y="218.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">cảnh cần thiết</text><text x="85.0" y="290.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Có mục tiêu</text><text x="382.0" y="280.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Mỗi biểu đồ trả lời một câu hỏi cụ</text><text x="382.0" y="300.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">thể. Tiêu đề là thông điệp</text><text x="794.0" y="280.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Tiêu đề mô tả máy móc (&quot;Biểu đồ doanh</text><text x="794.0" y="300.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">thu&quot;)</text></svg>