<svg xmlns="http://www.w3.org/2000/svg" viewBox="-24 -104 1228 983" font-family="Excalifont, 'Segoe Print', 'Comic Sans MS', 'Comic Neue', cursive"><rect x="-24" y="-104" width="100%" height="100%" fill="#fff"/><defs><marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#495057"/></marker></defs><rect x="0" y="0" width="360" height="100" rx="14" fill="#f1f3f5" stroke="#495057" stroke-width="2"/><rect x="0" y="170" width="360" height="100" rx="14" fill="#d0ebff" stroke="#1971c2" stroke-width="2"/><rect x="0" y="340" width="360" height="100" rx="14" fill="#d0ebff" stroke="#1971c2" stroke-width="2"/><rect x="460" y="330" width="320" height="115" rx="14" fill="#fff3bf" stroke="#e67700" stroke-width="2"/><polygon points="620.0,520 770,590.0 620.0,660 470,590.0" fill="#ffe8cc" stroke="#d9480f" stroke-width="2"/><rect x="880" y="530" width="300" height="100" rx="14" fill="#ffe3e3" stroke="#c92a2a" stroke-width="2"/><rect x="440" y="740" width="360" height="115" rx="14" fill="#d3f9d8" stroke="#2f9e44" stroke-width="2"/><polyline points="180.0,106.0 180.0,164.0" fill="none" stroke="#495057" stroke-width="2" marker-end="url(#ah)"/><polyline points="180.0,276.0 180.0,334.0" fill="none" stroke="#495057" stroke-width="2" marker-end="url(#ah)"/><polyline points="366.0,388.9431818181818 454.0,388.4431818181818" fill="none" stroke="#495057" stroke-width="2" marker-end="url(#ah)"/><polyline points="620.0,451.0 620.0,514.0" fill="none" stroke="#495057" stroke-width="2" marker-end="url(#ah)"/><polyline points="776.0,586.1951219512196 874.0,583.8048780487804" fill="none" stroke="#495057" stroke-width="2" marker-end="url(#ah)"/><polyline points="620.0,666.0 620.0,734.0" fill="none" stroke="#495057" stroke-width="2" marker-end="url(#ah)"/><text x="180.0" y="37.5" font-size="20" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Dữ liệu đã sắp (9 giá trị)</text><text x="180.0" y="62.5" font-size="20" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">2  4  4  5  6  7  8  9  30</text><text x="180.0" y="207.5" font-size="20" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Q1 = 4   Q2 = 6   Q3 = 8</text><text x="180.0" y="232.5" font-size="20" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">(np.percentile 25, 50, 75)</text><text x="180.0" y="377.5" font-size="20" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">IQR = Q3 − Q1 = 4</text><text x="180.0" y="402.5" font-size="20" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">hộp dài 4 đơn vị</text><text x="620.0" y="362.5" font-size="20" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Hàng rào</text><text x="620.0" y="387.5" font-size="20" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Q1 − 1.5·IQR = −2</text><text x="620.0" y="412.5" font-size="20" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Q3 + 1.5·IQR = 14</text><text x="620.0" y="577.5" font-size="20" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Giá trị nằm</text><text x="620.0" y="602.5" font-size="20" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">ngoài [−2, 14]?</text><text x="1030.0" y="567.5" font-size="20" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Có: 30</text><text x="1030.0" y="592.5" font-size="20" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">→ vẽ chấm rời (ngoại lai)</text><text x="620.0" y="772.5" font-size="20" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Không: râu tới quan sát thật</text><text x="620.0" y="797.5" font-size="20" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">trên = 9, dưới = 2</text><text x="620.0" y="822.5" font-size="20" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">(KHÔNG phải 14)</text><text x="180.0" y="118.6" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#495057">tìm tứ phân vị</text><text x="410.0" y="372.29318181818184" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#495057">×1.5</text><text x="825.0" y="568.6" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#495057">có</text><text x="620.0" y="683.6" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#495057">không</text><text x="0" y="-64.4" font-size="26" text-anchor="start" dominant-baseline="middle" fill="#1e1e1e">Boxplot: râu dừng ở đâu, điểm nào là ngoại lai?</text></svg>