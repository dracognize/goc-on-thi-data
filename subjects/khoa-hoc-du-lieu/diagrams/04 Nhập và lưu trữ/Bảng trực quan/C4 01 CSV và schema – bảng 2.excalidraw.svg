<svg xmlns="http://www.w3.org/2000/svg" viewBox="-24 -24 1093 436" font-family="Excalifont, 'Segoe Print', 'Comic Sans MS', 'Comic Neue', cursive"><rect x="-24" y="-24" width="100%" height="100%" fill="#fff"/><defs><marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#495057"/></marker></defs><rect x="0" y="0" width="266" height="53.75" rx="14" fill="#495057" stroke="#495057" stroke-width="2"/><rect x="278" y="0" width="400" height="53.75" rx="14" fill="#1971c2" stroke="#1971c2" stroke-width="2"/><rect x="690" y="0" width="355" height="53.75" rx="14" fill="#2f9e44" stroke="#2f9e44" stroke-width="2"/><rect x="0" y="71.75" width="266" height="70.0" rx="14" fill="#f1f3f5" stroke="#495057" stroke-width="2"/><rect x="278" y="71.75" width="400" height="70.0" rx="14" fill="#d0ebff" stroke="#1971c2" stroke-width="2"/><rect x="690" y="71.75" width="355" height="70.0" rx="14" fill="#d3f9d8" stroke="#2f9e44" stroke-width="2"/><rect x="0" y="153.75" width="266" height="70.0" rx="14" fill="#f1f3f5" stroke="#495057" stroke-width="2"/><rect x="278" y="153.75" width="400" height="70.0" rx="14" fill="#d0ebff" stroke="#1971c2" stroke-width="2"/><rect x="690" y="153.75" width="355" height="70.0" rx="14" fill="#d3f9d8" stroke="#2f9e44" stroke-width="2"/><rect x="0" y="235.75" width="266" height="70.0" rx="14" fill="#f1f3f5" stroke="#495057" stroke-width="2"/><rect x="278" y="235.75" width="400" height="70.0" rx="14" fill="#d0ebff" stroke="#1971c2" stroke-width="2"/><rect x="690" y="235.75" width="355" height="70.0" rx="14" fill="#d3f9d8" stroke="#2f9e44" stroke-width="2"/><rect x="0" y="317.75" width="266" height="70.0" rx="14" fill="#f1f3f5" stroke="#495057" stroke-width="2"/><rect x="278" y="317.75" width="400" height="70.0" rx="14" fill="#d0ebff" stroke="#1971c2" stroke-width="2"/><rect x="690" y="317.75" width="355" height="70.0" rx="14" fill="#d3f9d8" stroke="#2f9e44" stroke-width="2"/><text x="133.0" y="26.875" font-size="19" text-anchor="middle" dominant-baseline="middle" fill="#ffffff">Lợi ích</text><text x="478.0" y="26.875" font-size="19" text-anchor="middle" dominant-baseline="middle" fill="#ffffff">Giải thích</text><text x="867.5" y="26.875" font-size="19" text-anchor="middle" dominant-baseline="middle" fill="#ffffff">Ví dụ</text><text x="133.0" y="96.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Xác định vị trí, truy</text><text x="133.0" y="116.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">cập nhanh</text><text x="478.0" y="96.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Index là &quot;nhãn&quot; của hàng, lấy hàng</text><text x="478.0" y="116.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">không cần duyệt cả bảng</text><text x="867.5" y="96.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Index là ngày →</text><text x="867.5" y="116.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">df.loc[&quot;2024-08-31&quot;]</text><text x="133.0" y="188.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Sắp xếp và lọc</text><text x="478.0" y="178.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Sắp theo thời gian, ID, tên; cắt lát</text><text x="478.0" y="198.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">theo khoảng</text><text x="867.5" y="178.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Từ dòng 10 đến 20, từ ngày A đến</text><text x="867.5" y="198.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">ngày B</text><text x="133.0" y="270.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Kết hợp dữ liệu</text><text x="478.0" y="260.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Khi join/merge, index đóng vai trò</text><text x="478.0" y="280.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">khóa</text><text x="867.5" y="260.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Bảng sinh viên và bảng điểm cùng</text><text x="867.5" y="280.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">student_id</text><text x="133.0" y="342.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Dữ liệu có ý nghĩa, dễ</text><text x="133.0" y="362.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">đọc</text><text x="478.0" y="342.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Thay số thứ tự 0, 1, 2… bằng mã khách</text><text x="478.0" y="362.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">hàng, tên sản phẩm, ngày</text><text x="867.5" y="352.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">index_col=&quot;MSSV&quot;</text></svg>