dle" fill="#ffffff">Tham số</text><text x="267.0" y="26.875" font-size="19" text-anchor="middle" dominant-baseline="middle" fill="#ffffff">Mặc định</text><text x="564.0" y="26.875" font-size="19" text-anchor="middle" dominant-baseline="middle" fill="#ffffff">Ý nghĩa</text><text x="85.0" y="96.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">obj</text><text x="267.0" y="96.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">bắt buộc</text><text x="564.0" y="96.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Đối tượng Python cần chuyển</text><text x="85.0" y="178.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">skipkeys</text><text x="267.0" y="178.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">False</text><text x="564.0" y="158.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">True: bỏ qua key không phải</text><text x="564.0" y="178.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">str/int/float/bool/None thay vì báo</text><text x="564.0" y="198.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">lỗi</text><text x="85.0" y="280.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">ensure_ascii</text><text x="267.0" y="280.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">True</text><text x="564.0" y="260.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">True: escape ký tự non-ASCII (tiếng</text><text x="564.0" y="280.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Việt → \uXXXX). False: giữ nguyên</text><text x="564.0" y="300.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Unicode</text><text x="85.0" y="362.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">check_circular</text><text x="267.0" y="362.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">True</text><text x="564.0" y="362.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Kiểm tra vòng tham chiếu</text><text x="85.0" y="434.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">allow_nan</text><text x="267.0" y="434.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">True</text><text x="564.0" y="424.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Cho phép NaN, Infinity. False → báo</text><text x="564.0" y="444.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">lỗi</text><text x="85.0" y="506.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">cls</text><text x="267.0" y="506.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">None</text><text x="564.0" y="506.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Encoder tùy chỉnh</text><text x="85.0" y="568.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">indent</text><text x="267.0" y="568.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">None</text><text x="564.0" y="568.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Thụt lề, in đẹp (pretty-print)</text><text x="85.0" y="640.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">separators</text><text x="267.0" y="640.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">(&#x27;, &#x27;, &#x27;: &#x27;)</text><text x="564.0" y="630.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Đổi ký tự phân cách, (&#x27;,&#x27;, &#x27;:&#x27;) cho</text><text x="564.0" y="650.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">JSON gọn</text><text x="85.0" y="722.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">default</text><text x="267.0" y="722.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">None</text><text x="564.0" y="712.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Hàm serialize đối tượng không được hỗ</text><text x="564.0" y="732.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">trợ</text><text x="85.0" y="794.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">sort_keys</text><text x="267.0" y="794.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">False</text><text x="564.0" y="794.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">True: sắp key theo thứ tự từ điển</text></svg>