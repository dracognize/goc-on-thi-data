" height="50.0" rx="14" fill="#d0ebff" stroke="#1971c2" stroke-width="2"/><rect x="0" y="585.75" width="170" height="70.0" rx="14" fill="#f1f3f5" stroke="#495057" stroke-width="2"/><rect x="182" y="585.75" width="400" height="70.0" rx="14" fill="#d0ebff" stroke="#1971c2" stroke-width="2"/><text x="85.0" y="26.875" font-size="19" text-anchor="middle" dominant-baseline="middle" fill="#ffffff">Tham số</text><text x="382.0" y="26.875" font-size="19" text-anchor="middle" dominant-baseline="middle" fill="#ffffff">Ý nghĩa</text><text x="85.0" y="106.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">path_or_buf</text><text x="382.0" y="96.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Đường dẫn tệp JSON, URL hoặc chuỗi</text><text x="382.0" y="116.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">JSON</text><text x="85.0" y="188.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">orient</text><text x="382.0" y="178.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Cách tổ chức JSON: &#x27;records&#x27;,</text><text x="382.0" y="198.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">&#x27;split&#x27;, &#x27;index&#x27;, &#x27;columns&#x27;, &#x27;values&#x27;</text><text x="85.0" y="270.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">typ</text><text x="382.0" y="260.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Kiểu trả về: &#x27;frame&#x27; (DataFrame) hoặc</text><text x="382.0" y="280.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">&#x27;series&#x27;</text><text x="85.0" y="342.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">dtype</text><text x="382.0" y="342.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Tự ép kiểu (mặc định True)</text><text x="85.0" y="404.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">convert_dates</text><text x="382.0" y="404.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Tự nhận và chuyển cột ngày tháng</text><text x="85.0" y="476.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">lines</text><text x="382.0" y="466.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">True khi mỗi dòng là một object (JSON</text><text x="382.0" y="486.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Lines)</text><text x="85.0" y="548.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">compression</text><text x="382.0" y="548.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Đọc tệp nén &#x27;zip&#x27;, &#x27;gzip&#x27;, &#x27;bz2&#x27;…</text><text x="85.0" y="620.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">encoding</text><text x="382.0" y="610.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">&quot;utf-8&quot; hoặc &quot;utf-8-sig&quot; cho tiếng</text><text x="382.0" y="630.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Việt</text></svg>