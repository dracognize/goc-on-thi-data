e="19" text-anchor="middle" dominant-baseline="middle" fill="#ffffff">Tiêu chí</text><text x="341.0" y="26.875" font-size="19" text-anchor="middle" dominant-baseline="middle" fill="#ffffff">Tệp CSV</text><text x="712.0" y="26.875" font-size="19" text-anchor="middle" dominant-baseline="middle" fill="#ffffff">Tệp Excel</text><text x="85.0" y="106.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Định dạng</text><text x="341.0" y="106.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Văn bản thuần túy (text)</text><text x="712.0" y="96.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Nhị phân (.xls) hoặc XML nén ZIP</text><text x="712.0" y="116.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">(.xlsx, bên trong có nhiều tệp XML)</text><text x="85.0" y="188.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Mở bằng</text><text x="341.0" y="178.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Notepad, Excel, Google</text><text x="341.0" y="198.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Sheets, Pandas…</text><text x="712.0" y="188.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Excel, Google Sheets, LibreOffice…</text><text x="85.0" y="270.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Cấu trúc</text><text x="341.0" y="270.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Một bảng dữ liệu đơn giản</text><text x="712.0" y="260.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Nhiều sheet, mỗi sheet là một bảng</text><text x="712.0" y="280.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">riêng</text><text x="85.0" y="352.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Phân cách</text><text x="341.0" y="342.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Dấu phẩy , hoặc ký tự tùy</text><text x="341.0" y="362.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">chọn (;, \t)</text><text x="712.0" y="342.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Không có ký tự phân cách, cấu trúc</text><text x="712.0" y="362.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">tệp tự quản lý</text></svg>