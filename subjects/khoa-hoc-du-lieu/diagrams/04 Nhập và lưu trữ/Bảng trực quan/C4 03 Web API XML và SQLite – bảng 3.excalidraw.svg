<svg xmlns="http://www.w3.org/2000/svg" viewBox="-24 -24 734 828" font-family="Excalifont, 'Segoe Print', 'Comic Sans MS', 'Comic Neue', cursive"><rect x="-24" y="-24" width="100%" height="100%" fill="#fff"/><defs><marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#495057"/></marker></defs><rect x="0" y="0" width="274" height="53.75" rx="14" fill="#495057" stroke="#495057" stroke-width="2"/><rect x="286" y="0" width="400" height="53.75" rx="14" fill="#1971c2" stroke="#1971c2" stroke-width="2"/><rect x="0" y="71.75" width="274" height="70.0" rx="14" fill="#f1f3f5" stroke="#495057" stroke-width="2"/><rect x="286" y="71.75" width="400" height="70.0" rx="14" fill="#d0ebff" stroke="#1971c2" stroke-width="2"/><rect x="0" y="153.75" width="274" height="50.0" rx="14" fill="#f1f3f5" stroke="#495057" stroke-width="2"/><rect x="286" y="153.75" width="400" height="50.0" rx="14" fill="#d0ebff" stroke="#1971c2" stroke-width="2"/><rect x="0" y="215.75" width="274" height="50.0" rx="14" fill="#f1f3f5" stroke="#495057" stroke-width="2"/><rect x="286" y="215.75" width="400" height="50.0" rx="14" fill="#d0ebff" stroke="#1971c2" stroke-width="2"/><rect x="0" y="277.75" width="274" height="70.0" rx="14" fill="#f1f3f5" stroke="#495057" stroke-width="2"/><rect x="286" y="277.75" width="400" height="70.0" rx="14" fill="#d0ebff" stroke="#1971c2" stroke-width="2"/><rect x="0" y="359.75" width="274" height="70.0" rx="14" fill="#f1f3f5" stroke="#495057" stroke-width="2"/><rect x="286" y="359.75" width="400" height="70.0" rx="14" fill="#d0ebff" stroke="#1971c2" stroke-width="2"/><rect x="0" y="441.75" width="274" height="70.0" rx="14" fill="#f1f3f5" stroke="#495057" stroke-width="2"/><rect x="286" y="441.75" width="400" height="70.0" rx="14" fill="#d0ebff" stroke="#1971c2" stroke-width="2"/><rect x="0" y="523.75" width="274" height="50.0" rx="14" fill="#f1f3f5" stroke="#495057" stroke-width="2"/><rect x="286" y="523.75" width="400" height="50.0" rx="14" fill="#d0ebff" stroke="#1971c2" stroke-width="2"/><rect x="0" y="585.75" width="274" height="50.0" rx="14" fill="#f1f3f5" stroke="#495057" stroke-width="2"/><rect x="286" y="585.75" width="400" height="50.0" rx="14" fill="#d0ebff" stroke="#1971c2" stroke-width="2"/><rect x="0" y="647.75" width="274" height="70.0" rx="14" fill="#f1f3f5" stroke="#495057" stroke-width="2"/><rect x="286" y="647.75" width="400" height="70.0" rx="14" fill="#d0ebff" stroke="#1971c2" stroke-width="2"/><rect x="0" y="729.75" width="274" height="50.0" rx="14" fill="#f1f3f5" stroke="#495057" stroke-width="2"/><rect x="286" y="729.75" width="400" height="50.0" rx="14" fill="#d0ebff" stroke="#1971c2" stroke-width="2"/><text x="137.0" y="26.875" font-size="19" text-anchor="middle" dominant-baseline="middle" fill="#ffffff">Lệnh</text><text x="486.0" y="26.875" font-size="19" text-anchor="middle" dominant-baseline="middle" fill="#ffffff">Vai trò</text><text x="137.0" y="96.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">sqlite3.connect(&quot;mydata.</text><text x="137.0" y="116.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">sqlite&quot;)</text><text x="486.0" y="96.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Tạo hoặc kết nối tệp CSDL; chưa có</text><text x="486.0" y="116.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">thì tạo mới</text><text x="137.0" y="178.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">CREATE TABLE</text><text x="486.0" y="178.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Định nghĩa bảng 4 cột và kiểu</text><text x="137.0" y="240.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">con.execute(query)</text><text x="486.0" y="240.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Thực thi một câu SQL</text><text x="137.0" y="312.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">con.commit()</text><text x="486.0" y="302.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Lưu thay đổi (sau</text><text x="486.0" y="322.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">CREATE/INSERT/UPDATE/DELETE)</text><text x="137.0" y="394.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">OperationalError</text><text x="486.0" y="384.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Bắt lỗi khi bảng đã tồn tại → chương</text><text x="486.0" y="404.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">trình không dừng</text><text x="137.0" y="466.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">executemany(stmt,</text><text x="137.0" y="486.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">data_sql)</text><text x="486.0" y="466.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Chèn nhiều hàng, mỗi ? nhận một giá</text><text x="486.0" y="486.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">trị của tuple</text><text x="137.0" y="548.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">IntegrityError</text><text x="486.0" y="548.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Trùng khóa chính, vi phạm ràng buộc</text><text x="137.0" y="610.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">cursor.fetchall()</text><text x="486.0" y="610.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Lấy hết kết quả: list các tuple</text><text x="137.0" y="682.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">cursor.description</text><text x="486.0" y="672.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Thông tin cột; phần tử [0] của mỗi</text><text x="486.0" y="692.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">mục là tên cột</text><text x="137.0" y="754.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">con.close()</text><text x="486.0" y="754.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Đóng kết nối</text></svg>