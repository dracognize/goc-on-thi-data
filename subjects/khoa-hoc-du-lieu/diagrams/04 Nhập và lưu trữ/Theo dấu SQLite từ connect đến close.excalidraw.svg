<svg xmlns="http://www.w3.org/2000/svg" viewBox="-24 -344 1808 978" font-family="Excalifont, 'Segoe Print', 'Comic Sans MS', 'Comic Neue', cursive"><rect x="-24" y="-344" width="100%" height="100%" fill="#fff"/><defs><marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#495057"/></marker></defs><rect x="0" y="0" width="320" height="100" rx="14" fill="#d0ebff" stroke="#1971c2" stroke-width="2"/><rect x="360" y="0" width="320" height="100" rx="14" fill="#d0ebff" stroke="#1971c2" stroke-width="2"/><rect x="720" y="0" width="320" height="100" rx="14" fill="#d3f9d8" stroke="#2f9e44" stroke-width="2"/><rect x="1080" y="0" width="320" height="100" rx="14" fill="#d0ebff" stroke="#1971c2" stroke-width="2"/><rect x="1440" y="0" width="320" height="100" rx="14" fill="#d3f9d8" stroke="#2f9e44" stroke-width="2"/><rect x="1440" y="300" width="320" height="100" rx="14" fill="#d0ebff" stroke="#1971c2" stroke-width="2"/><rect x="1080" y="300" width="320" height="100" rx="14" fill="#e5dbff" stroke="#6741d9" stroke-width="2"/><rect x="720" y="300" width="320" height="100" rx="14" fill="#e5dbff" stroke="#6741d9" stroke-width="2"/><rect x="360" y="300" width="320" height="100" rx="14" fill="#d3f9d8" stroke="#2f9e44" stroke-width="2"/><rect x="0" y="300" width="320" height="100" rx="14" fill="#f1f3f5" stroke="#495057" stroke-width="2"/><rect x="360" y="-220" width="320" height="90" rx="14" fill="#ffe3e3" stroke="#c92a2a" stroke-width="2"/><rect x="1080" y="-220" width="320" height="90" rx="14" fill="#ffe3e3" stroke="#c92a2a" stroke-width="2"/><rect x="0" y="520" width="520" height="90" rx="14" fill="#fff3bf" stroke="#e67700" stroke-width="2"/><polyline points="326.0,50.0 354.0,50.0" fill="none" stroke="#495057" stroke-width="2" marker-end="url(#ah)"/><polyline points="1434.0,350.0 1406.0,350.0" fill="none" stroke="#495057" stroke-width="2" marker-end="url(#ah)"/><polyline points="686.0,50.0 714.0,50.0" fill="none" stroke="#495057" stroke-width="2" marker-end="url(#ah)"/><polyline points="1074.0,350.0 1046.0,350.0" fill="none" stroke="#495057" stroke-width="2" marker-end="url(#ah)"/><polyline points="1046.0,50.0 1074.0,50.0" fill="none" stroke="#495057" stroke-width="2" marker-end="url(#ah)"/><polyline points="714.0,350.0 686.0,350.0" fill="none" stroke="#495057" stroke-width="2" marker-end="url(#ah)"/><polyline points="1406.0,50.0 1434.0,50.0" fill="none" stroke="#495057" stroke-width="2" marker-end="url(#ah)"/><polyline points="354.0,350.0 326.0,350.0" fill="none" stroke="#495057" stroke-width="2" marker-end="url(#ah)"/><polyline points="1600.0,106.0 1600.0,294.0" fill="none" stroke="#495057" stroke-width="2" marker-end="url(#ah)"/><polyline points="520.0,-6.0 520.0,-124.0" fill="none" stroke="#495057" stroke-width="2" stroke-dasharray="8 6" marker-end="url(#ah)"/><polyline points="1240.0,-6.0 1240.0,-124.0" fill="none" stroke="#495057" stroke-width="2" stroke-dasharray="8 6" marker-end="url(#ah)"/><text x="160.0" y="40.0" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">con = sqlite3.connect(f)</text><text x="160.0" y="60.0" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">mở/tạo tệp CSDL</text><text x="520.0" y="40.0" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">con.execute(CREATE TABLE)</text><text x="520.0" y="60.0" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">bảng test: a,b,c,d</text><text x="880.0" y="40.0" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">con.commit()</text><text x="880.0" y="60.0" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">lưu cấu trúc</text><text x="1240.0" y="40.0" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">con.executemany(INSERT ?,?,?,?)</text><text x="1240.0" y="60.0" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">3 tuple → 3 hàng</text><text x="1600.0" y="40.0" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">con.commit()</text><text x="1600.0" y="60.0" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">lưu dữ liệu</text><text x="1600.0" y="350.0" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">cursor = con.execute(SELECT *)</text><text x="1240.0" y="340.0" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">rows = cursor.fetchall()</text><text x="1240.0" y="360.0" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">list tuple, gọi lại → []</text><text x="880.0" y="340.0" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">cursor.description</text><text x="880.0" y="360.0" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">x[0] = tên cột a,b,c,d</text><text x="520.0" y="340.0" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">pd.DataFrame(rows, columns=...)</text><text x="520.0" y="360.0" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">3 hàng × 4 cột</text><text x="160.0" y="340.0" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">con.close()</text><text x="160.0" y="360.0" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">giải phóng tài nguyên</text><text x="520.0" y="-185.0" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">OperationalError</text><text x="520.0" y="-165.0" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">bảng đã tồn tại</text><text x="1240.0" y="-185.0" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">IntegrityError</text><text x="1240.0" y="-165.0" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">trùng khóa / ràng buộc</text><text x="260.0" y="555.0" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Quên commit → thay đổi không vào tệp</text><text x="260.0" y="575.0" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Sau close → ProgrammingError</text><text x="1600.0" y="183.6" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#495057">truy vấn</text><text x="520.0" y="-81.4" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#495057">chạy lần 2</text><text x="1240.0" y="-81.4" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#495057">vi phạm</text><text x="0" y="-304.4" font-size="26" text-anchor="start" dominant-baseline="middle" fill="#1e1e1e">Theo dấu trạng thái: từ connect đến close</text></svg>