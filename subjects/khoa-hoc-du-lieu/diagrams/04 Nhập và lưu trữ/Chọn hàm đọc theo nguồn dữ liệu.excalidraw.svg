ze="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">→ sqlite3 / SQLAlchemy</text><text x="1130.0" y="675.0" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">pd.read_sql</text><text x="0" y="-74.4" font-size="26" text-anchor="start" dominant-baseline="middle" fill="#1e1e1e">Chọn hàm đọc theo nguồn dữ liệu (tr. 119)</text><text x="0" y="-29.200000000000003" font-size="18" text-anchor="start" dominant-baseline="middle" fill="#1971c2">Tệp văn bản / bảng tính</text><text x="940" y="-29.200000000000003" font-size="18" text-anchor="start" dominant-baseline="middle" fill="#2f9e44">Dữ liệu có cấu trúc / mạng / CSDL</text></svg>