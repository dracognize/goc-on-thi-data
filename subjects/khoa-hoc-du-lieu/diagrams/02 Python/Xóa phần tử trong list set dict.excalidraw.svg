e" dominant-baseline="middle" fill="#1e1e1e">list</text><text x="475.0" y="50.0" font-size="20" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">set</text><text x="805.0" y="50.0" font-size="20" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">dict</text><text x="146.5" y="187.5" font-size="20" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">remove(x): theo GIÁ TRỊ</text><text x="146.5" y="212.5" font-size="20" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">thiếu → ValueError</text><text x="163.0" y="337.5" font-size="20" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">pop(i): theo CHỈ SỐ</text><text x="163.0" y="362.5" font-size="20" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">mặc định cuối, trả phần tử</text><text x="145.0" y="487.5" font-size="20" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">del a[i] / del a</text><text x="145.0" y="512.5" font-size="20" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">clear() → []</text><text x="475.0" y="187.5" font-size="20" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">remove(x)</text><text x="475.0" y="212.5" font-size="20" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">thiếu → KeyError</text><text x="475.0" y="337.5" font-size="20" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">discard(x)</text><text x="475.0" y="362.5" font-size="20" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">thiếu → KHÔNG lỗi</text><text x="475.0" y="487.5" font-size="20" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">pop(): ngẫu nhiên</text><text x="475.0" y="512.5" font-size="20" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">clear() → set()</text><text x="805.0" y="187.5" font-size="20" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">pop(key): trả value</text><text x="805.0" y="212.5" font-size="20" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">thiếu → KeyError</text><text x="805.0" y="337.5" font-size="20" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">popitem():</text><text x="805.0" y="362.5" font-size="20" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">item chèn sau cùng</text><text x="805.0" y="487.5" font-size="20" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">del d[key] / del d</text><text x="805.0" y="512.5" font-size="20" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">clear() → {}</text><text x="0" y="-73.2" font-size="28" text-anchor="start" dominant-baseline="middle" fill="#1e1e1e">Xóa phần tử: lỗi hay không, trả về gì?</text></svg>