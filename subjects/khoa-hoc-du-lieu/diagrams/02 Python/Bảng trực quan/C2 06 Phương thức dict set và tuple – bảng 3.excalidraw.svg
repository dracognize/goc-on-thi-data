 height="50.0" rx="14" fill="#f1f3f5" stroke="#495057" stroke-width="2"/><rect x="182" y="379.75" width="281" height="50.0" rx="14" fill="#d0ebff" stroke="#1971c2" stroke-width="2"/><rect x="475" y="379.75" width="400" height="50.0" rx="14" fill="#d3f9d8" stroke="#2f9e44" stroke-width="2"/><text x="85.0" y="26.875" font-size="19" text-anchor="middle" dominant-baseline="middle" fill="#ffffff">Cách</text><text x="322.5" y="26.875" font-size="19" text-anchor="middle" dominant-baseline="middle" fill="#ffffff">Làm gì</text><text x="675.0" y="26.875" font-size="19" text-anchor="middle" dominant-baseline="middle" fill="#ffffff">Ví dụ → dictb sau đó</text><text x="85.0" y="106.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">pop(key)</text><text x="322.5" y="96.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Xóa item có key cụ thể,</text><text x="322.5" y="116.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">trả value</text><text x="675.0" y="96.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">pop(&quot;model&quot;) → {&#x27;brand&#x27;: &#x27;Ford&#x27;,</text><text x="675.0" y="116.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">&#x27;year&#x27;: 1964}</text><text x="85.0" y="188.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">popitem()</text><text x="322.5" y="178.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Xóa item chèn vào cuối</text><text x="322.5" y="198.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">cùng</text><text x="675.0" y="178.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">→ {&#x27;brand&#x27;: &#x27;Ford&#x27;, &#x27;model&#x27;:</text><text x="675.0" y="198.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">&#x27;Mustang&#x27;}</text><text x="85.0" y="260.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">clear()</text><text x="322.5" y="260.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Làm rỗng</text><text x="675.0" y="260.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">→ {}</text><text x="85.0" y="332.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">del d[key]</text><text x="322.5" y="332.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Xóa item theo key</text><text x="675.0" y="322.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">del dictb[&quot;model&quot;] → {&#x27;brand&#x27;:</text><text x="675.0" y="342.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">&#x27;Ford&#x27;, &#x27;year&#x27;: 1964}</text><text x="85.0" y="404.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">del d</text><text x="322.5" y="404.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Xóa toàn bộ biến dict</text><text x="675.0" y="404.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">print(dictb) → NameError</text></svg>