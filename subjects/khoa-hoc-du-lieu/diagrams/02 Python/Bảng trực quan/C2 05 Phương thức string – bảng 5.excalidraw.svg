" height="70.0" rx="14" fill="#d0ebff" stroke="#1971c2" stroke-width="2"/><rect x="0" y="585.75" width="170" height="70.0" rx="14" fill="#f1f3f5" stroke="#495057" stroke-width="2"/><rect x="182" y="585.75" width="333" height="70.0" rx="14" fill="#d0ebff" stroke="#1971c2" stroke-width="2"/><rect x="0" y="667.75" width="170" height="70.0" rx="14" fill="#f1f3f5" stroke="#495057" stroke-width="2"/><rect x="182" y="667.75" width="333" height="70.0" rx="14" fill="#d0ebff" stroke="#1971c2" stroke-width="2"/><text x="85.0" y="26.875" font-size="19" text-anchor="middle" dominant-baseline="middle" fill="#ffffff">Phương thức</text><text x="348.5" y="26.875" font-size="19" text-anchor="middle" dominant-baseline="middle" fill="#ffffff">True khi</text><text x="85.0" y="106.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">isalnum()</text><text x="348.5" y="96.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Có ≥ 1 ký tự, tất cả là chữ</text><text x="348.5" y="116.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">hoặc số</text><text x="85.0" y="188.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">isalpha()</text><text x="348.5" y="178.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Có ≥ 1 ký tự, tất cả là chữ</text><text x="348.5" y="198.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">cái</text><text x="85.0" y="260.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">isdigit()</text><text x="348.5" y="260.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Chỉ chứa chữ số</text><text x="85.0" y="322.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">islower()</text><text x="348.5" y="322.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Mọi chữ cái đều thường</text><text x="85.0" y="384.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">isupper()</text><text x="348.5" y="384.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Mọi chữ cái đều hoa</text><text x="85.0" y="456.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">isnumeric()</text><text x="348.5" y="446.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Chuỗi Unicode chỉ chứa ký tự</text><text x="348.5" y="466.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">số</text><text x="85.0" y="538.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">isspace()</text><text x="348.5" y="528.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Chỉ chứa khoảng trắng</text><text x="348.5" y="548.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">(whitespace)</text><text x="85.0" y="620.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">istitle()</text><text x="348.5" y="610.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Dạng tiêu đề: chữ đầu mỗi từ</text><text x="348.5" y="630.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">viết hoa</text><text x="85.0" y="702.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">isprintable()</text><text x="348.5" y="692.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Mọi ký tự in được (\n, \r</text><text x="348.5" y="712.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">không in được)</text></svg>