" height="70.0" rx="14" fill="#d0ebff" stroke="#1971c2" stroke-width="2"/><text x="125.5" y="26.875" font-size="19" text-anchor="middle" dominant-baseline="middle" fill="#ffffff">Phương thức</text><text x="463.0" y="26.875" font-size="19" text-anchor="middle" dominant-baseline="middle" fill="#ffffff">Làm gì</text><text x="125.5" y="96.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">clear()</text><text x="463.0" y="96.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Xóa mọi phần tử</text><text x="125.5" y="158.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">copy()</text><text x="463.0" y="158.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Trả bản sao</text><text x="125.5" y="220.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">dict.fromkeys(seq[,</text><text x="125.5" y="240.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">value])</text><text x="463.0" y="220.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Dict mới: key lấy từ seq, mọi key</text><text x="463.0" y="240.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">chung value (thiếu → None)</text><text x="125.5" y="312.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">get(key, default=None)</text><text x="463.0" y="302.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Value của key; thiếu key → None hoặc</text><text x="463.0" y="322.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">default. Không thêm key</text><text x="125.5" y="384.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">items(), keys(),</text><text x="125.5" y="404.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">values()</text><text x="463.0" y="394.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Các cặp / các key / các value</text><text x="125.5" y="466.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">setdefault(key,</text><text x="125.5" y="486.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">default=None)</text><text x="463.0" y="466.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Như get, nhưng nếu thiếu key thì gán</text><text x="463.0" y="486.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">dict[key] = default</text><text x="125.5" y="558.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">update(dict2)</text><text x="463.0" y="548.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Thêm/ghi đè các phần tử của dict2 vào</text><text x="463.0" y="568.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">dict</text></svg>