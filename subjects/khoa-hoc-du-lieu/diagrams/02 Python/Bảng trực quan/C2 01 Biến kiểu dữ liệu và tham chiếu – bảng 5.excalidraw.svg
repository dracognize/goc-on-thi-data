<svg xmlns="http://www.w3.org/2000/svg" viewBox="-24 -24 938 560" font-family="Excalifont, 'Segoe Print', 'Comic Sans MS', 'Comic Neue', cursive"><rect x="-24" y="-24" width="100%" height="100%" fill="#fff"/><defs><marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#495057"/></marker></defs><rect x="0" y="0" width="192" height="53.75" rx="14" fill="#495057" stroke="#495057" stroke-width="2"/><rect x="204" y="0" width="400" height="53.75" rx="14" fill="#1971c2" stroke="#1971c2" stroke-width="2"/><rect x="616" y="0" width="274" height="53.75" rx="14" fill="#2f9e44" stroke="#2f9e44" stroke-width="2"/><rect x="0" y="71.75" width="192" height="70.0" rx="14" fill="#f1f3f5" stroke="#495057" stroke-width="2"/><rect x="204" y="71.75" width="400" height="70.0" rx="14" fill="#d0ebff" stroke="#1971c2" stroke-width="2"/><rect x="616" y="71.75" width="274" height="70.0" rx="14" fill="#d3f9d8" stroke="#2f9e44" stroke-width="2"/><rect x="0" y="153.75" width="192" height="70.0" rx="14" fill="#f1f3f5" stroke="#495057" stroke-width="2"/><rect x="204" y="153.75" width="400" height="70.0" rx="14" fill="#d0ebff" stroke="#1971c2" stroke-width="2"/><rect x="616" y="153.75" width="274" height="70.0" rx="14" fill="#d3f9d8" stroke="#2f9e44" stroke-width="2"/><rect x="0" y="235.75" width="192" height="50.0" rx="14" fill="#f1f3f5" stroke="#495057" stroke-width="2"/><rect x="204" y="235.75" width="400" height="50.0" rx="14" fill="#d0ebff" stroke="#1971c2" stroke-width="2"/><rect x="616" y="235.75" width="274" height="50.0" rx="14" fill="#d3f9d8" stroke="#2f9e44" stroke-width="2"/><rect x="0" y="297.75" width="192" height="70.0" rx="14" fill="#f1f3f5" stroke="#495057" stroke-width="2"/><rect x="204" y="297.75" width="400" height="70.0" rx="14" fill="#d0ebff" stroke="#1971c2" stroke-width="2"/><rect x="616" y="297.75" width="274" height="70.0" rx="14" fill="#d3f9d8" stroke="#2f9e44" stroke-width="2"/><rect x="0" y="379.75" width="192" height="50.0" rx="14" fill="#f1f3f5" stroke="#495057" stroke-width="2"/><rect x="204" y="379.75" width="400" height="50.0" rx="14" fill="#d0ebff" stroke="#1971c2" stroke-width="2"/><rect x="616" y="379.75" width="274" height="50.0" rx="14" fill="#d3f9d8" stroke="#2f9e44" stroke-width="2"/><rect x="0" y="441.75" width="192" height="70.0" rx="14" fill="#f1f3f5" stroke="#495057" stroke-width="2"/><rect x="204" y="441.75" width="400" height="70.0" rx="14" fill="#d0ebff" stroke="#1971c2" stroke-width="2"/><rect x="616" y="441.75" width="274" height="70.0" rx="14" fill="#d3f9d8" stroke="#2f9e44" stroke-width="2"/><text x="96.0" y="26.875" font-size="19" text-anchor="middle" dominant-baseline="middle" fill="#ffffff">Hàm</text><text x="404.0" y="26.875" font-size="19" text-anchor="middle" dominant-baseline="middle" fill="#ffffff">Ý nghĩa</text><text x="753.0" y="26.875" font-size="19" text-anchor="middle" dominant-baseline="middle" fill="#ffffff">Ví dụ → kết quả</text><text x="96.0" y="106.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">int(x[, base])</text><text x="404.0" y="96.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Đổi thành số nguyên; base là cơ số</text><text x="404.0" y="116.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">nếu x là chuỗi</text><text x="753.0" y="96.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">int(&quot;101&quot;, 2) → 5;</text><text x="753.0" y="116.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">int(3.9) → 3</text><text x="96.0" y="188.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">long(x[, base])</text><text x="404.0" y="188.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Số nguyên dài (chỉ có ở Python 2)</text><text x="753.0" y="178.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Python 3 dùng int cho</text><text x="753.0" y="198.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">mọi độ lớn</text><text x="96.0" y="260.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">float(x)</text><text x="404.0" y="260.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Đổi thành số thực</text><text x="753.0" y="260.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">float(&quot;3.5&quot;) → 3.5</text><text x="96.0" y="322.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">complex(real[,</text><text x="96.0" y="342.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">imag])</text><text x="404.0" y="332.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Tạo số phức</text><text x="753.0" y="332.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">complex(2, 3) → (2+3j)</text><text x="96.0" y="404.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">str(x)</text><text x="404.0" y="404.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Chuỗi đại diện, dễ đọc</text><text x="753.0" y="404.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">str(12) → &#x27;12&#x27;</text><text x="96.0" y="476.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">repr(x)</text><text x="404.0" y="466.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Chuỗi biểu thức (dạng viết lại được</text><text x="404.0" y="486.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">trong code)</text><text x="753.0" y="476.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">repr(&quot;a\n&quot;) → &quot;&#x27;a\\n&#x27;&quot;</text></svg>