<svg xmlns="http://www.w3.org/2000/svg" viewBox="-24 -24 1280 720" font-family="Excalifont, 'Segoe Print', 'Comic Sans MS', 'Comic Neue', cursive"><rect x="-24" y="-24" width="100%" height="100%" fill="#fff"/><defs><marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#495057"/></marker></defs><rect x="0" y="0" width="162" height="56" rx="14" fill="#cbd5e1" stroke="#334155" stroke-width="2"/><rect x="162" y="0" width="320" height="56" rx="14" fill="#cbd5e1" stroke="#334155" stroke-width="2"/><rect x="482" y="0" width="140" height="56" rx="14" fill="#cbd5e1" stroke="#334155" stroke-width="2"/><rect x="622" y="0" width="610" height="56" rx="14" fill="#cbd5e1" stroke="#334155" stroke-width="2"/><rect x="0" y="56" width="162" height="56" rx="14" fill="#dbeafe" stroke="#334155" stroke-width="2"/><rect x="162" y="56" width="320" height="56" rx="14" fill="#f3e8ff" stroke="#334155" stroke-width="2"/><rect x="482" y="56" width="140" height="56" rx="14" fill="#dcfce7" stroke="#334155" stroke-width="2"/><rect x="622" y="56" width="610" height="56" rx="14" fill="#f8fafc" stroke="#334155" stroke-width="2"/><rect x="0" y="112" width="162" height="56" rx="14" fill="#dbeafe" stroke="#334155" stroke-width="2"/><rect x="162" y="112" width="320" height="56" rx="14" fill="#f3e8ff" stroke="#334155" stroke-width="2"/><rect x="482" y="112" width="140" height="56" rx="14" fill="#dcfce7" stroke="#334155" stroke-width="2"/><rect x="622" y="112" width="610" height="56" rx="14" fill="#f8fafc" stroke="#334155" stroke-width="2"/><rect x="0" y="168" width="162" height="56" rx="14" fill="#dbeafe" stroke="#334155" stroke-width="2"/><rect x="162" y="168" width="320" height="56" rx="14" fill="#f3e8ff" stroke="#334155" stroke-width="2"/><rect x="482" y="168" width="140" height="56" rx="14" fill="#dcfce7" stroke="#334155" stroke-width="2"/><rect x="622" y="168" width="610" height="56" rx="14" fill="#f8fafc" stroke="#334155" stroke-width="2"/><rect x="0" y="224" width="162" height="56" rx="14" fill="#dbeafe" stroke="#334155" stroke-width="2"/><rect x="162" y="224" width="320" height="56" rx="14" fill="#f3e8ff" stroke="#334155" stroke-width="2"/><rect x="482" y="224" width="140" height="56" rx="14" fill="#dcfce7" stroke="#334155" stroke-width="2"/><rect x="622" y="224" width="610" height="56" rx="14" fill="#f8fafc" stroke="#334155" stroke-width="2"/><rect x="0" y="280" width="162" height="56" rx="14" fill="#dbeafe" stroke="#334155" stroke-width="2"/><rect x="162" y="280" width="320" height="56" rx="14" fill="#f3e8ff" stroke="#334155" stroke-width="2"/><rect x="482" y="280" width="140" height="56" rx="14" fill="#dcfce7" stroke="#334155" stroke-width="2"/><rect x="622" y="280" width="610" height="56" rx="14" fill="#f8fafc" stroke="#334155" stroke-width="2"/><rect x="0" y="336" width="162" height="56" rx="14" fill="#dbeafe" stroke="#334155" stroke-width="2"/><rect x="162" y="336" width="320" height="56" rx="14" fill="#f3e8ff" stroke="#334155" stroke-width="2"/><rect x="482" y="336" width="140" height="56" rx="14" fill="#dcfce7" stroke="#334155" stroke-width="2"/><rect x="622" y="336" width="610" height="56" rx="14" fill="#f8fafc" stroke="#334155" stroke-width="2"/><rect x="0" y="392" width="162" height="56" rx="14" fill="#dbeafe" stroke="#334155" stroke-width="2"/><rect x="162" y="392" width="320" height="56" rx="14" fill="#f3e8ff" stroke="#334155" stroke-width="2"/><rect x="482" y="392" width="140" height="56" rx="14" fill="#dcfce7" stroke="#334155" stroke-width="2"/><rect x="622" y="392" width="610" height="56" rx="14" fill="#f8fafc" stroke="#334155" stroke-width="2"/><rect x="0" y="448" width="162" height="56" rx="14" fill="#dbeafe" stroke="#334155" stroke-width="2"/><rect x="162" y="448" width="320" height="56" rx="14" fill="#f3e8ff" stroke="#334155" stroke-width="2"/><rect x="482" y="448" width="140" height="56" rx="14" fill="#dcfce7" stroke="#334155" stroke-width="2"/><rect x="622" y="448" width="610" height="56" rx="14" fill="#f8fafc" stroke="#334155" stroke-width="2"/><rect x="0" y="504" width="162" height="56" rx="14" fill="#dbeafe" stroke="#334155" stroke-width="2"/><rect x="162" y="504" width="320" height="56" rx="14" fill="#f3e8ff" stroke="#334155" stroke-width="2"/><rect x="482" y="504" width="140" height="56" rx="14" fill="#dcfce7" stroke="#334155" stroke-width="2"/><rect x="622" y="504" width="610" height="56" rx="14" fill="#f8fafc" stroke="#334155" stroke-width="2"/><rect x="0" y="560" width="162" height="56" rx="14" fill="#dbeafe" stroke="#334155" stroke-width="2"/><rect x="162" y="560" width="320" height="56" rx="14" fill="#f3e8ff" stroke="#334155" stroke-width="2"/><rect x="482" y="560" width="140" height="56" rx="14" fill="#dcfce7" stroke="#334155" stroke-width="2"/><rect x="622" y="560" width="610" height="56" rx="14" fill="#f8fafc" stroke="#334155" stroke-width="2"/><rect x="0" y="616" width="162" height="56" rx="14" fill="#dbeafe" stroke="#334155" stroke-width="2"/><rect x="162" y="616" width="320" height="56" rx="14" fill="#f3e8ff" stroke="#334155" stroke-width="2"/><rect x="482" y="616" width="140" height="56" rx="14" fill="#dcfce7" stroke="#334155" stroke-width="2"/><rect x="622" y="616" width="610" height="56" rx="14" fill="#f8fafc" stroke="#334155" stroke-width="2"/><text x="81.0" y="28.0" font-size="17" text-anchor="middle" dominant-baseline="middle" fill="#334155">Phương thức</text><text x="322.0" y="28.0" font-size="17" text-anchor="middle" dominant-baseline="middle" fill="#334155">Đối số</text><text x="552.0" y="28.0" font-size="17" text-anchor="middle" dominant-baseline="middle" fill="#334155">Trả về</text><text x="927.0" y="28.0" font-size="17" text-anchor="middle" dominant-baseline="middle" fill="#334155">Tác động và bẫy thường gặp</text><text x="81.0" y="84.0" font-size="17" text-anchor="middle" dominant-baseline="middle" fill="#334155">append</text><text x="322.0" y="84.0" font-size="17" text-anchor="middle" dominant-baseline="middle" fill="#334155">x: T</text><text x="552.0" y="84.0" font-size="17" text-anchor="middle" dominant-baseline="middle" fill="#334155">None</text><text x="927.0" y="84.0" font-size="17" text-anchor="middle" dominant-baseline="middle" fill="#334155">Thêm nguyên x, kể cả khi x là một list.</text><text x="81.0" y="140.0" font-size="17" text-anchor="middle" dominant-baseline="middle" fill="#334155">extend</text><text x="322.0" y="140.0" font-size="17" text-anchor="middle" dominant-baseline="middle" fill="#334155">xs: Iterable[T]</text><text x="552.0" y="140.0" font-size="17" text-anchor="middle" dominant-baseline="middle" fill="#334155">None</text><text x="927.0" y="140.0" font-size="17" text-anchor="middle" dominant-baseline="middle" fill="#334155">Thêm từng phần tử. Chuỗi &quot;ab&quot; cho &#x27;a&#x27;, &#x27;b&#x27;.</text><text x="81.0" y="196.0" font-size="17" text-anchor="middle" dominant-baseline="middle" fill="#334155">insert</text><text x="322.0" y="196.0" font-size="17" text-anchor="middle" dominant-baseline="middle" fill="#334155">i: int, x: T</text><text x="552.0" y="196.0" font-size="17" text-anchor="middle" dominant-baseline="middle" fill="#334155">None</text><text x="927.0" y="196.0" font-size="17" text-anchor="middle" dominant-baseline="middle" fill="#334155">Chèn trước i. Chỉ số quá lớn sẽ chèn ở cuối.</text><text x="81.0" y="252.0" font-size="17" text-anchor="middle" dominant-baseline="middle" fill="#334155">remove</text><text x="322.0" y="252.0" font-size="17" text-anchor="middle" dominant-baseline="middle" fill="#334155">x: object</text><text x="552.0" y="252.0" font-size="17" text-anchor="middle" dominant-baseline="middle" fill="#334155">None</text><text x="927.0" y="252.0" font-size="17" text-anchor="middle" dominant-baseline="middle" fill="#334155">Xóa giá trị bằng x đầu tiên. Thiếu x → ValueError.</text><text x="81.0" y="308.0" font-size="17" text-anchor="middle" dominant-baseline="middle" fill="#334155">pop</text><text x="322.0" y="308.0" font-size="17" text-anchor="middle" dominant-baseline="middle" fill="#334155">i: int = -1</text><text x="552.0" y="308.0" font-size="17" text-anchor="middle" dominant-baseline="middle" fill="#334155">T</text><text x="927.0" y="308.0" font-size="17" text-anchor="middle" dominant-baseline="middle" fill="#334155">Lấy và xóa tại i. List rỗng hoặc sai chỉ số → IndexError.</text><text x="81.0" y="364.0" font-size="17" text-anchor="middle" dominant-baseline="middle" fill="#334155">clear</text><text x="322.0" y="364.0" font-size="17" text-anchor="middle" dominant-baseline="middle" fill="#334155">—</text><text x="552.0" y="364.0" font-size="17" text-anchor="middle" dominant-baseline="middle" fill="#334155">None</text><text x="927.0" y="364.0" font-size="17" text-anchor="middle" dominant-baseline="middle" fill="#334155">Xóa tại chỗ. Mọi tên cùng trỏ vào list đều thấy [].</text><text x="81.0" y="420.0" font-size="17" text-anchor="middle" dominant-baseline="middle" fill="#334155">index</text><text x="322.0" y="420.0" font-size="17" text-anchor="middle" dominant-baseline="middle" fill="#334155">x, start?, stop?</text><text x="552.0" y="420.0" font-size="17" text-anchor="middle" dominant-baseline="middle" fill="#334155">int</text><text x="927.0" y="420.0" font-size="17" text-anchor="middle" dominant-baseline="middle" fill="#334155">Tìm trong [start, stop). Thiếu x → ValueError.</text><text x="81.0" y="476.0" font-size="17" text-anchor="middle" dominant-baseline="middle" fill="#334155">count</text><text x="322.0" y="476.0" font-size="17" text-anchor="middle" dominant-baseline="middle" fill="#334155">x: object</text><text x="552.0" y="476.0" font-size="17" text-anchor="middle" dominant-baseline="middle" fill="#334155">int</text><text x="927.0" y="476.0" font-size="17" text-anchor="middle" dominant-baseline="middle" fill="#334155">Đếm phần tử bằng x. Thiếu x → 0.</text><text x="81.0" y="532.0" font-size="17" text-anchor="middle" dominant-baseline="middle" fill="#334155">sort</text><text x="322.0" y="532.0" font-size="17" text-anchor="middle" dominant-baseline="middle" fill="#334155">*, key=None, reverse=False</text><text x="552.0" y="532.0" font-size="17" text-anchor="middle" dominant-baseline="middle" fill="#334155">None</text><text x="927.0" y="532.0" font-size="17" text-anchor="middle" dominant-baseline="middle" fill="#334155">Sắp ổn định tại chỗ. Khóa không so sánh được → TypeError.</text><text x="81.0" y="588.0" font-size="17" text-anchor="middle" dominant-baseline="middle" fill="#334155">reverse</text><text x="322.0" y="588.0" font-size="17" text-anchor="middle" dominant-baseline="middle" fill="#334155">—</text><text x="552.0" y="588.0" font-size="17" text-anchor="middle" dominant-baseline="middle" fill="#334155">None</text><text x="927.0" y="588.0" font-size="17" text-anchor="middle" dominant-baseline="middle" fill="#334155">Đảo tại chỗ. reversed(a) trả iterator duyệt ngược.</text><text x="81.0" y="644.0" font-size="17" text-anchor="middle" dominant-baseline="middle" fill="#334155">copy</text><text x="322.0" y="644.0" font-size="17" text-anchor="middle" dominant-baseline="middle" fill="#334155">—</text><text x="552.0" y="644.0" font-size="17" text-anchor="middle" dominant-baseline="middle" fill="#334155">list[T]</text><text x="927.0" y="644.0" font-size="17" text-anchor="middle" dominant-baseline="middle" fill="#334155">Tạo list ngoài mới. Các phần tử vẫn được dùng chung.</text></svg>