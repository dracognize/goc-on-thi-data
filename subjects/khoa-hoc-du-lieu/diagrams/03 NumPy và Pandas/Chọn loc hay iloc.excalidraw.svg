<svg xmlns="http://www.w3.org/2000/svg" viewBox="-24 -114 1108 948" font-family="Excalifont, 'Segoe Print', 'Comic Sans MS', 'Comic Neue', cursive"><rect x="-24" y="-114" width="100%" height="100%" fill="#fff"/><defs><marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#495057"/></marker></defs><rect x="380" y="0" width="260" height="80" rx="14" fill="#d0ebff" stroke="#1971c2" stroke-width="2"/><rect x="0" y="160" width="290" height="120" rx="14" fill="#c3fae8" stroke="#0c8599" stroke-width="2"/><polygon points="510.0,150 650,220.0 510.0,290 370,220.0" fill="#fff3bf" stroke="#e67700" stroke-width="2"/><rect x="730" y="160" width="330" height="120" rx="14" fill="#e5dbff" stroke="#6741d9" stroke-width="2"/><rect x="180" y="380" width="300" height="100" rx="14" fill="#d3f9d8" stroke="#2f9e44" stroke-width="2"/><rect x="560" y="380" width="300" height="100" rx="14" fill="#ffe8cc" stroke="#d9480f" stroke-width="2"/><rect x="180" y="560" width="300" height="90" rx="14" fill="#d3f9d8" stroke="#2f9e44" stroke-width="2"/><rect x="560" y="560" width="300" height="90" rx="14" fill="#ffe8cc" stroke="#d9480f" stroke-width="2"/><rect x="300" y="720" width="440" height="90" rx="14" fill="#ffe3e3" stroke="#c92a2a" stroke-width="2"/><polyline points="416.72222222222223,86.0 278.8333333333333,154.0" fill="none" stroke="#495057" stroke-width="2" marker-end="url(#ah)"/><polyline points="510.0,86.0 510.0,144.0" fill="none" stroke="#495057" stroke-width="2" marker-end="url(#ah)"/><polyline points="608.3888888888889,86.0 753.8333333333334,154.0" fill="none" stroke="#495057" stroke-width="2" marker-end="url(#ah)"/><polyline points="444.8571428571429,296.0 378.0,374.0" fill="none" stroke="#495057" stroke-width="2" marker-end="url(#ah)"/><polyline points="582.3809523809524,296.0 656.6666666666666,374.0" fill="none" stroke="#495057" stroke-width="2" marker-end="url(#ah)"/><polyline points="330.0,486.0 330.0,554.0" fill="none" stroke="#495057" stroke-width="2" stroke-dasharray="8 6" marker-end="url(#ah)"/><polyline points="710.0,486.0 710.0,554.0" fill="none" stroke="#495057" stroke-width="2" stroke-dasharray="8 6" marker-end="url(#ah)"/><text x="510.0" y="40.0" font-size="20" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Muốn lấy gì?</text><text x="145.0" y="195.0" font-size="20" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Chỉ cột</text><text x="145.0" y="220.0" font-size="20" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">df[&#x27;c&#x27;] → Series</text><text x="145.0" y="245.0" font-size="20" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">df[[&#x27;c&#x27;]] → DataFrame</text><text x="510.0" y="207.5" font-size="20" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Biết theo</text><text x="510.0" y="232.5" font-size="20" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">nhãn hay vị trí?</text><text x="895.0" y="207.5" font-size="20" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Lọc theo điều kiện</text><text x="895.0" y="232.5" font-size="20" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">df.loc[df[&#x27;Điểm&#x27;] &gt; 8, &#x27;Tên&#x27;]</text><text x="330.0" y="417.5" font-size="20" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">df.loc[hàng, cột]</text><text x="330.0" y="442.5" font-size="20" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">lát cắt CÓ lấy mốc cuối</text><text x="710.0" y="417.5" font-size="20" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">df.iloc[i, j]</text><text x="710.0" y="442.5" font-size="20" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">lát cắt KHÔNG lấy mốc cuối</text><text x="330.0" y="592.5" font-size="20" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Đúng 1 ô, nhanh:</text><text x="330.0" y="617.5" font-size="20" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">df.at[nhãn, &#x27;cột&#x27;]</text><text x="710.0" y="592.5" font-size="20" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Đúng 1 ô, nhanh:</text><text x="710.0" y="617.5" font-size="20" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">df.iat[i, j]</text><text x="520.0" y="752.5" font-size="20" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Sau df.index = [&#x27;sv1&#x27;,...]</text><text x="520.0" y="777.5" font-size="20" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">loc[1] → KeyError, iloc[1] vẫn chạy</text><text x="347.77777777777777" y="103.6" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#495057">cột</text><text x="510.0" y="98.6" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#495057">hàng / ô</text><text x="681.1111111111111" y="103.6" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#495057">điều kiện</text><text x="411.42857142857144" y="318.6" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#495057">nhãn</text><text x="619.5238095238095" y="318.6" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#495057">vị trí</text><text x="0" y="-73.2" font-size="28" text-anchor="start" dominant-baseline="middle" fill="#1e1e1e">Chọn dữ liệu trong DataFrame: dùng gì?</text></svg>