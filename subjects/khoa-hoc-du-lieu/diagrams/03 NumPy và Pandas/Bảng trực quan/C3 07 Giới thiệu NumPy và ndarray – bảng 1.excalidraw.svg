<svg xmlns="http://www.w3.org/2000/svg" viewBox="-24 -24 667 480" font-family="Excalifont, 'Segoe Print', 'Comic Sans MS', 'Comic Neue', cursive"><rect x="-24" y="-24" width="100%" height="100%" fill="#fff"/><defs><marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#495057"/></marker></defs><rect x="0" y="0" width="207" height="77.5" rx="14" fill="#495057" stroke="#495057" stroke-width="2"/><rect x="219" y="0" width="400" height="77.5" rx="14" fill="#1971c2" stroke="#1971c2" stroke-width="2"/><rect x="0" y="95.5" width="207" height="90.0" rx="14" fill="#f1f3f5" stroke="#495057" stroke-width="2"/><rect x="219" y="95.5" width="400" height="90.0" rx="14" fill="#d0ebff" stroke="#1971c2" stroke-width="2"/><rect x="0" y="197.5" width="207" height="70.0" rx="14" fill="#f1f3f5" stroke="#495057" stroke-width="2"/><rect x="219" y="197.5" width="400" height="70.0" rx="14" fill="#d0ebff" stroke="#1971c2" stroke-width="2"/><rect x="0" y="279.5" width="207" height="70.0" rx="14" fill="#f1f3f5" stroke="#495057" stroke-width="2"/><rect x="219" y="279.5" width="400" height="70.0" rx="14" fill="#d0ebff" stroke="#1971c2" stroke-width="2"/><rect x="0" y="361.5" width="207" height="70.0" rx="14" fill="#f1f3f5" stroke="#495057" stroke-width="2"/><rect x="219" y="361.5" width="400" height="70.0" rx="14" fill="#d0ebff" stroke="#1971c2" stroke-width="2"/><text x="103.5" y="26.875" font-size="19" text-anchor="middle" dominant-baseline="middle" fill="#ffffff">Tính năng chính</text><text x="103.5" y="50.625" font-size="19" text-anchor="middle" dominant-baseline="middle" fill="#ffffff">(tr. 6)</text><text x="419.0" y="38.75" font-size="19" text-anchor="middle" dominant-baseline="middle" fill="#ffffff">Ý nghĩa dễ hiểu</text><text x="103.5" y="140.5" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">ndarray</text><text x="419.0" y="120.5" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Mảng N chiều hiệu quả, hỗ trợ vector</text><text x="419.0" y="140.5" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">hóa (vectorization, tính cả mảng một</text><text x="419.0" y="160.5" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">lần) và lan truyền (broadcasting)</text><text x="103.5" y="222.5" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Hàm chuẩn trên cả</text><text x="103.5" y="242.5" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">mảng</text><text x="419.0" y="222.5" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Tính trên toàn mảng hoặc từng phần</text><text x="419.0" y="242.5" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">tử, không cần viết vòng lặp</text><text x="103.5" y="304.5" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Đọc/ghi dữ liệu</text><text x="103.5" y="324.5" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">mảng</text><text x="419.0" y="304.5" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Có cả tệp ánh xạ bộ nhớ</text><text x="419.0" y="324.5" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">(memory-mapped files)</text><text x="103.5" y="396.5" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Công cụ toán</text><text x="419.0" y="386.5" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Đại số tuyến tính, biến đổi Fourier,</text><text x="419.0" y="406.5" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">sinh số ngẫu nhiên</text></svg>