font-size="19" text-anchor="middle" dominant-baseline="middle" fill="#ffffff">Mô tả</text><text x="151.5" y="96.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">add, subtract, multiply,</text><text x="151.5" y="116.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">divide</text><text x="444.5" y="106.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Số học cơ bản</text><text x="151.5" y="188.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">power</text><text x="444.5" y="178.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Lũy thừa: np.power(2,</text><text x="444.5" y="198.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">3) → 8</text><text x="151.5" y="270.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">maximum, minimum</text><text x="444.5" y="260.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Lớn/nhỏ nhất theo từng</text><text x="444.5" y="280.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">phần tử</text><text x="151.5" y="352.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">mod</text><text x="444.5" y="342.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Phần dư: np.mod(7, 3) →</text><text x="444.5" y="362.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">1</text><text x="151.5" y="434.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">greater, less, equal…</text><text x="444.5" y="424.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">So sánh, trả mảng</text><text x="444.5" y="444.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">boolean</text><text x="151.5" y="506.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">logical_and, logical_or,</text><text x="151.5" y="526.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">logical_xor</text><text x="444.5" y="516.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Phép logic từng phần tử</text></svg>