<svg xmlns="http://www.w3.org/2000/svg" viewBox="-24 -24 630 558" font-family="Excalifont, 'Segoe Print', 'Comic Sans MS', 'Comic Neue', cursive"><rect x="-24" y="-24" width="100%" height="100%" fill="#fff"/><defs><marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#495057"/></marker></defs><rect x="0" y="0" width="170" height="53.75" rx="14" fill="#495057" stroke="#495057" stroke-width="2"/><rect x="182" y="0" width="400" height="53.75" rx="14" fill="#1971c2" stroke="#1971c2" stroke-width="2"/><rect x="0" y="71.75" width="170" height="70.0" rx="14" fill="#f1f3f5" stroke="#495057" stroke-width="2"/><rect x="182" y="71.75" width="400" height="70.0" rx="14" fill="#d0ebff" stroke="#1971c2" stroke-width="2"/><rect x="0" y="153.75" width="170" height="90.0" rx="14" fill="#f1f3f5" stroke="#495057" stroke-width="2"/><rect x="182" y="153.75" width="400" height="90.0" rx="14" fill="#d0ebff" stroke="#1971c2" stroke-width="2"/><rect x="0" y="255.75" width="170" height="90.0" rx="14" fill="#f1f3f5" stroke="#495057" stroke-width="2"/><rect x="182" y="255.75" width="400" height="90.0" rx="14" fill="#d0ebff" stroke="#1971c2" stroke-width="2"/><rect x="0" y="357.75" width="170" height="50.0" rx="14" fill="#f1f3f5" stroke="#495057" stroke-width="2"/><rect x="182" y="357.75" width="400" height="50.0" rx="14" fill="#d0ebff" stroke="#1971c2" stroke-width="2"/><rect x="0" y="419.75" width="170" height="90.0" rx="14" fill="#f1f3f5" stroke="#495057" stroke-width="2"/><rect x="182" y="419.75" width="400" height="90.0" rx="14" fill="#d0ebff" stroke="#1971c2" stroke-width="2"/><text x="85.0" y="26.875" font-size="19" text-anchor="middle" dominant-baseline="middle" fill="#ffffff">Tham số</text><text x="382.0" y="26.875" font-size="19" text-anchor="middle" dominant-baseline="middle" fill="#ffffff">Ý nghĩa</text><text x="85.0" y="106.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">shape</text><text x="382.0" y="96.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Một số nguyên (mảng 1D) hoặc tuple</text><text x="382.0" y="116.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">(nhiều chiều): 3, (2, 3), (1, 2, 3)</text><text x="85.0" y="198.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">dtype</text><text x="382.0" y="178.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Kiểu phần tử. empty/zeros/ones mặc</text><text x="382.0" y="198.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">định float. full suy ra từ</text><text x="382.0" y="218.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">fill_value. asarray giữ kiểu đầu vào</text><text x="85.0" y="300.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">order</text><text x="382.0" y="280.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Thứ tự lưu trong bộ nhớ: &#x27;C&#x27; theo</text><text x="382.0" y="300.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">hàng (row-major, mặc định), &#x27;F&#x27; theo</text><text x="382.0" y="320.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">cột (column-major)</text><text x="85.0" y="382.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">fill_value</text><text x="382.0" y="382.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Giá trị điền vào mọi ô của full</text><text x="85.0" y="464.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">a</text><text x="382.0" y="444.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Đầu vào của asarray: list, tuple,</text><text x="382.0" y="464.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">list lồng nhau, đối tượng</text><text x="382.0" y="484.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">&quot;array-like&quot;</text></svg>