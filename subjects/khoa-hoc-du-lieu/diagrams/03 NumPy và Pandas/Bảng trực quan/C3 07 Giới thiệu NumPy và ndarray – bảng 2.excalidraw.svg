<svg xmlns="http://www.w3.org/2000/svg" viewBox="-24 -24 689 460" font-family="Excalifont, 'Segoe Print', 'Comic Sans MS', 'Comic Neue', cursive"><rect x="-24" y="-24" width="100%" height="100%" fill="#fff"/><defs><marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#495057"/></marker></defs><rect x="0" y="0" width="229" height="77.5" rx="14" fill="#495057" stroke="#495057" stroke-width="2"/><rect x="241" y="0" width="400" height="77.5" rx="14" fill="#1971c2" stroke="#1971c2" stroke-width="2"/><rect x="0" y="95.5" width="229" height="70.0" rx="14" fill="#f1f3f5" stroke="#495057" stroke-width="2"/><rect x="241" y="95.5" width="400" height="70.0" rx="14" fill="#d0ebff" stroke="#1971c2" stroke-width="2"/><rect x="0" y="177.5" width="229" height="70.0" rx="14" fill="#f1f3f5" stroke="#495057" stroke-width="2"/><rect x="241" y="177.5" width="400" height="70.0" rx="14" fill="#d0ebff" stroke="#1971c2" stroke-width="2"/><rect x="0" y="259.5" width="229" height="70.0" rx="14" fill="#f1f3f5" stroke="#495057" stroke-width="2"/><rect x="241" y="259.5" width="400" height="70.0" rx="14" fill="#d0ebff" stroke="#1971c2" stroke-width="2"/><rect x="0" y="341.5" width="229" height="70.0" rx="14" fill="#f1f3f5" stroke="#495057" stroke-width="2"/><rect x="241" y="341.5" width="400" height="70.0" rx="14" fill="#d0ebff" stroke="#1971c2" stroke-width="2"/><text x="114.5" y="26.875" font-size="19" text-anchor="middle" dominant-baseline="middle" fill="#ffffff">Ứng dụng điển</text><text x="114.5" y="50.625" font-size="19" text-anchor="middle" dominant-baseline="middle" fill="#ffffff">hình (tr. 7)</text><text x="441.0" y="38.75" font-size="19" text-anchor="middle" dominant-baseline="middle" fill="#ffffff">Ví dụ</text><text x="114.5" y="130.5" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Chuẩn bị dữ liệu</text><text x="441.0" y="120.5" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Làm sạch, chuẩn hóa, định hình lại,</text><text x="441.0" y="140.5" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">sắp xếp, lọc mảng</text><text x="114.5" y="202.5" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Phân tích, mô hình</text><text x="114.5" y="222.5" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">hóa</text><text x="441.0" y="202.5" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Phép toán, thống kê, hàm tổng hợp</text><text x="441.0" y="222.5" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">trên cả tập hoặc tập con</text><text x="114.5" y="294.5" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Mô phỏng</text><text x="441.0" y="284.5" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Tạo dữ liệu ngẫu nhiên theo phân phối</text><text x="441.0" y="304.5" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">đã biết</text><text x="114.5" y="376.5" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Thuật toán số khác</text><text x="441.0" y="366.5" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Xử lý tín hiệu, lọc, tính toán hiệu</text><text x="441.0" y="386.5" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">năng cao</text></svg>