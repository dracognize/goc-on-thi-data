ont-size="19" text-anchor="middle" dominant-baseline="middle" fill="#ffffff">Tương đương</text><text x="85.0" y="96.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">np.add(x, y)</text><text x="281.5" y="96.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">x + y</text><text x="85.0" y="158.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">np.subtract(x,</text><text x="85.0" y="178.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">y)</text><text x="281.5" y="168.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">x - y</text><text x="85.0" y="240.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">np.multiply(x,</text><text x="85.0" y="260.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">y)</text><text x="281.5" y="250.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">x * y</text><text x="85.0" y="322.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">np.divide(x,</text><text x="85.0" y="342.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">y)</text><text x="281.5" y="332.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">x / y</text><text x="85.0" y="414.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">np.sqrt(x)</text><text x="281.5" y="404.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">căn bậc 2 từng</text><text x="281.5" y="424.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">phần tử</text><text x="85.0" y="496.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">np.dot(x, y)</text><text x="281.5" y="486.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">phương thức</text><text x="281.5" y="506.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">x.dot(y)</text></svg>