<svg xmlns="http://www.w3.org/2000/svg" viewBox="-24 -114 1128 1038" font-family="Excalifont, 'Segoe Print', 'Comic Sans MS', 'Comic Neue', cursive"><rect x="-24" y="-114" width="100%" height="100%" fill="#fff"/><defs><marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#495057"/></marker></defs><rect x="0" y="0" width="280" height="90" rx="14" fill="#d0ebff" stroke="#1971c2" stroke-width="2"/><rect x="0" y="170" width="280" height="90" rx="14" fill="#d0ebff" stroke="#1971c2" stroke-width="2"/><polygon points="140.0,340 280,410.0 140.0,480 0,410.0" fill="#fff3bf" stroke="#e67700" stroke-width="2"/><rect x="420" y="350" width="260" height="120" rx="14" fill="#ffe3e3" stroke="#c92a2a" stroke-width="2"/><polygon points="140.0,560 280,630.0 140.0,700 0,630.0" fill="#fff3bf" stroke="#e67700" stroke-width="2"/><rect x="0" y="780" width="280" height="120" rx="14" fill="#d3f9d8" stroke="#2f9e44" stroke-width="2"/><rect x="820" y="0" width="260" height="110" rx="14" fill="#d3f9d8" stroke="#2f9e44" stroke-width="2"/><rect x="820" y="170" width="260" height="110" rx="14" fill="#d3f9d8" stroke="#2f9e44" stroke-width="2"/><rect x="820" y="350" width="260" height="110" rx="14" fill="#ffe3e3" stroke="#c92a2a" stroke-width="2"/><rect x="820" y="560" width="260" height="110" rx="14" fill="#c3fae8" stroke="#0c8599" stroke-width="2"/><polyline points="140.028,96 140.028,164" fill="none" stroke="#495057" stroke-width="2" marker-end="url(#ah)"/><polyline points="140.10073861120637,266 140.92728710446255,334.17788039092216" fill="none" stroke="#495057" stroke-width="2" marker-end="url(#ah)"/><polyline points="285.64733767897417,410.9577646292681 414.0,410.05423651164034" fill="none" stroke="#495057" stroke-width="2" marker-end="url(#ah)"/><polyline points="140.99999999999997,485.8225 141.00000000000006,554.1775" fill="none" stroke="#495057" stroke-width="2" marker-end="url(#ah)"/><polyline points="140.92728710446255,705.822119609078 140.10073861120637,773.9999999999999" fill="none" stroke="#495057" stroke-width="2" marker-end="url(#ah)"/><polyline points="950.026,466 950.026,554" fill="none" stroke="#495057" stroke-width="2" stroke-dasharray="8 6" marker-end="url(#ah)"/><text x="140.0" y="32.5" font-size="20" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Viết 2 shape</text><text x="140.0" y="57.5" font-size="20" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">căn lề phải</text><text x="140.0" y="202.5" font-size="20" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Xét cặp chiều</text><text x="140.0" y="227.5" font-size="20" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">từ phải sang trái</text><text x="140.0" y="397.5" font-size="20" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Bằng nhau</text><text x="140.0" y="422.5" font-size="20" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">hoặc có số 1?</text><text x="550.0" y="385.0" font-size="20" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">ValueError</text><text x="550.0" y="410.0" font-size="20" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">operands could not</text><text x="550.0" y="435.0" font-size="20" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">be broadcast</text><text x="140.0" y="617.5" font-size="20" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Còn cặp</text><text x="140.0" y="642.5" font-size="20" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">chiều nữa?</text><text x="140.0" y="815.0" font-size="20" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Broadcast được</text><text x="140.0" y="840.0" font-size="20" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">shape = số lớn hơn</text><text x="140.0" y="865.0" font-size="20" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">ở từng cặp</text><text x="950.0" y="30.0" font-size="20" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">(2,3) + (3,)</text><text x="950.0" y="55.0" font-size="20" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">3=3, thiếu→1</text><text x="950.0" y="80.0" font-size="20" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">→ (2,3)</text><text x="950.0" y="200.0" font-size="20" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">(4,1) + (3,)</text><text x="950.0" y="225.0" font-size="20" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">1 và 3, 4 và 1</text><text x="950.0" y="250.0" font-size="20" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">→ (4,3)</text><text x="950.0" y="380.0" font-size="20" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">(2,3) + (2,)</text><text x="950.0" y="405.0" font-size="20" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">3 ≠ 2, không có 1</text><text x="950.0" y="430.0" font-size="20" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">→ lỗi</text><text x="950.0" y="590.0" font-size="20" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Sửa: b.reshape(2,1)</text><text x="950.0" y="615.0" font-size="20" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">(2,3) + (2,1)</text><text x="950.0" y="640.0" font-size="20" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">→ (2,3)</text><text x="350.0" y="393.6" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#495057">không</text><text x="140.0" y="503.6" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#495057">có</text><text x="140.0" y="723.6" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#495057">hết</text><text x="140.0" y="393.6" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#495057">còn</text><text x="0" y="-73.2" font-size="28" text-anchor="start" dominant-baseline="middle" fill="#1e1e1e">Hai mảng có broadcast được không?</text></svg>