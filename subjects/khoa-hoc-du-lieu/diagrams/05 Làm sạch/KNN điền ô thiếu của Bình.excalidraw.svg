ints="726,149.90909090909176 854,131.00674565703528" fill="none" stroke="#495057" stroke-width="2" marker-end="url(#ah)"/><text x="150.0" y="287.5" font-size="20" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Bình: Tuổi = ?</text><text x="150.0" y="312.5" font-size="20" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Lương 18M · KN 5 · PB 2</text><text x="590.0" y="32.5" font-size="20" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Chi · d ≈ 3,2</text><text x="590.0" y="57.5" font-size="20" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Tuổi 30</text><text x="590.0" y="157.5" font-size="20" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Hoa · d ≈ 3,2</text><text x="590.0" y="182.5" font-size="20" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Tuổi 32</text><text x="590.0" y="282.5" font-size="20" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Phong · d ≈ 7,2</text><text x="590.0" y="307.5" font-size="20" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Tuổi 35</text><text x="590.0" y="407.5" font-size="20" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">An · d ≈ 3,46 triệu</text><text x="590.0" y="432.5" font-size="20" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Tuổi 25</text><text x="590.0" y="532.5" font-size="20" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Dũng · d ≈ 4,6 triệu</text><text x="590.0" y="557.5" font-size="20" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Tuổi 28</text><text x="1030.0" y="92.5" font-size="20" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">k = 2 gần nhất: Chi, Hoa</text><text x="1030.0" y="117.5" font-size="20" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Tuổi = (30 + 32)/2 = 31</text><text x="0" y="-74.4" font-size="26" text-anchor="start" dominant-baseline="middle" fill="#1e1e1e">KNNImputer(n_neighbors=2) c