<svg xmlns="http://www.w3.org/2000/svg" viewBox="-24 -114 1168 1123" font-family="Excalifont, 'Segoe Print', 'Comic Sans MS', 'Comic Neue', cursive"><rect x="-24" y="-114" width="100%" height="100%" fill="#fff"/><defs><marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#495057"/></marker></defs><polygon points="125.0,420 250,495.0 125.0,570 0,495.0" fill="#e5dbff" stroke="#6741d9" stroke-width="2"/><rect x="340" y="120" width="260" height="90" rx="14" fill="#d0ebff" stroke="#1971c2" stroke-width="2"/><rect x="720" y="5" width="400" height="90" rx="14" fill="#d3f9d8" stroke="#2f9e44" stroke-width="2"/><rect x="720" y="120" width="400" height="90" rx="14" fill="#d3f9d8" stroke="#2f9e44" stroke-width="2"/><rect x="720" y="235" width="400" height="90" rx="14" fill="#fff3bf" stroke="#e67700" stroke-width="2"/><rect x="340" y="450" width="260" height="90" rx="14" fill="#c3fae8" stroke="#0c8599" stroke-width="2"/><rect x="720" y="335" width="400" height="90" rx="14" fill="#d3f9d8" stroke="#2f9e44" stroke-width="2"/><rect x="720" y="450" width="400" height="90" rx="14" fill="#d3f9d8" stroke="#2f9e44" stroke-width="2"/><rect x="720" y="565" width="400" height="90" rx="14" fill="#fff3bf" stroke="#e67700" stroke-width="2"/><rect x="340" y="780" width="260" height="90" rx="14" fill="#ffe8cc" stroke="#d9480f" stroke-width="2"/><rect x="720" y="665" width="400" height="90" rx="14" fill="#d3f9d8" stroke="#2f9e44" stroke-width="2"/><rect x="720" y="780" width="400" height="90" rx="14" fill="#d3f9d8" stroke="#2f9e44" stroke-width="2"/><rect x="720" y="895" width="400" height="90" rx="14" fill="#fff3bf" stroke="#e67700" stroke-width="2"/><polyline points="177.68863720011367,444.6403162806464 416.7180419901456,216.0" fill="none" stroke="#495057" stroke-width="2" marker-end="url(#ah)"/><polyline points="604.2593497853724,130.67975991816633 729.2536228214711,98.73506559042987" fill="none" stroke="#495057" stroke-width="2" marker-end="url(#ah)"/><polyline points="606,165.00900000000001 714,165.00900000000001" fill="none" stroke="#495057" stroke-width="2" marker-end="url(#ah)"/><polyline points="604.2619071553303,199.31263819158468 729.2693541328393,231.25864983575158" fill="none" stroke="#495057" stroke-width="2" marker-end="url(#ah)"/><polyline points="255.6846226797441,495.93439200467026 334.0,495.07483623982733" fill="none" stroke="#495057" stroke-width="2" marker-end="url(#ah)"/><polyline points="604.2593497853704,460.6797599181606 729.2536228214651,428.7350655904275" fill="none" stroke="#495057" stroke-width="2" marker-end="url(#ah)"/><polyline points="606,495.009 714,495.009" fill="none" stroke="#495057" stroke-width="2" marker-end="url(#ah)"/><polyline points="604.2619071553303,529.3126381915847 729.269354132839,561.2586498357516" fill="none" stroke="#495057" stroke-width="2" marker-end="url(#ah)"/><polyline points="178.17220464589496,545.8503849696593 416.69728490518014,774.0" fill="none" stroke="#495057" stroke-width="2" marker-end="url(#ah)"/><polyline points="604.2593497853716,790.679759918164 729.2536228214683,758.7350655904288" fill="none" stroke="#495057" stroke-width="2" marker-end="url(#ah)"/><polyline points="606,825.0089999999999 714,825.0089999999999" fill="none" stroke="#495057" stroke-width="2" marker-end="url(#ah)"/><polyline points="604.2619071553303,859.3126381915846 729.269354132839,891.2586498357516" fill="none" stroke="#495057" stroke-width="2" marker-end="url(#ah)"/><text x="125.0" y="482.5" font-size="20" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Cột bị thiếu</text><text x="125.0" y="507.5" font-size="20" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">thuộc loại nào?</text><text x="470.0" y="165.0" font-size="20" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Dữ liệu số</text><text x="920.0" y="50.0" font-size="20" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">&lt; 5% thiếu → Mean / Median</text><text x="920.0" y="152.5" font-size="20" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">5–20% + có tương quan</text><text x="920.0" y="177.5" font-size="20" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">→ KNN hoặc Random Forest</text><text x="920.0" y="267.5" font-size="20" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">&gt; 20% → bỏ cột</text><text x="920.0" y="292.5" font-size="20" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">hoặc thu thập thêm</text><text x="470.0" y="495.0" font-size="20" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Dữ liệu phân loại</text><text x="920.0" y="380.0" font-size="20" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">&lt; 10% thiếu → Mode</text><text x="920.0" y="482.5" font-size="20" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">&gt; 10% + có quan hệ</text><text x="920.0" y="507.5" font-size="20" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">→ RF Classification</text><text x="920.0" y="597.5" font-size="20" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Nhiều giá trị (high cardinality)</text><text x="920.0" y="622.5" font-size="20" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">→ tạo nhãn &#x27;Unknown&#x27;</text><text x="470.0" y="825.0" font-size="20" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Chuỗi thời gian</text><text x="920.0" y="697.5" font-size="20" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Ổn định (giá cổ phiếu)</text><text x="920.0" y="722.5" font-size="20" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">→ Forward fill</text><text x="920.0" y="812.5" font-size="20" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Có xu hướng (trend)</text><text x="920.0" y="837.5" font-size="20" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">→ Backward fill</text><text x="920.0" y="927.5" font-size="20" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Trơn (smooth)</text><text x="920.0" y="952.5" font-size="20" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">→ Interpolation</text><text x="0" y="-73.2" font-size="28" text-anchor="start" dominant-baseline="middle" fill="#1e1e1e">Chọn cách xử lý dữ liệu thiếu (Lec5 tr. 17, 68)</text></svg>