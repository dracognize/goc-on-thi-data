size="20" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Bình  NaN  18M   Mkt</text><text x="165.0" y="317.5" font-size="20" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Chi   30   NaN   NaN</text><text x="165.0" y="342.5" font-size="20" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Dũng  28   22M   IT</text><text x="165.0" y="367.5" font-size="20" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Eva   NaN  16M   Mkt</text><text x="795.0" y="35.0" font-size="20" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">dropna()</text><text x="795.0" y="60.0" font-size="20" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">→ An, Dũng · 2 hàng</text><text x="795.0" y="160.0" font-size="20" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">dropna(how=&#x27;all&#x27;)</text><text x="795.0" y="185.0" font-size="20" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">→ đủ 5 hàng (không hàng nào toàn NaN)</text><text x="795.0" y="285.0" font-size="20" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">dropna(axis=1)</text><text x="795.0" y="310.0" font-size="20" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">→ chỉ còn cột Tên</text><text x="795.0" y="410.0" font-size="20" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">dropna(subset=[&#x27;Tuổi&#x27;,&#x27;Phòng ban&#x27;])</text><text x="795.0" y="435.0" font-size="20" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">→ An, Dũng</text><text x="795.0" y="535.0" font-size="20" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">dropna(thresh=3)</text><text x="795.0" y="560.0" font-size="20" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">→ bỏ Chi (chỉ 2 ô có dữ liệu)</text><text x="0" y="-64.4" font-size="26" text-anchor="start" dominant-baseline="middle" fill="#1e1e1e">Cùng một bảng, năm cách gọi dropna cho kết quả nào?</text></svg>