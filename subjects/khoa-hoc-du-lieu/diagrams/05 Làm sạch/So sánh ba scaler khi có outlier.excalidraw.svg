<svg xmlns="http://www.w3.org/2000/svg" viewBox="-24 -104 1168 693" font-family="Excalifont, 'Segoe Print', 'Comic Sans MS', 'Comic Neue', cursive"><rect x="-24" y="-104" width="100%" height="100%" fill="#fff"/><defs><marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#495057"/></marker></defs><rect x="300" y="0" width="520" height="100" rx="14" fill="#f1f3f5" stroke="#495057" stroke-width="2"/><rect x="0" y="190" width="330" height="100" rx="14" fill="#d0ebff" stroke="#1971c2" stroke-width="2"/><rect x="395" y="190" width="330" height="100" rx="14" fill="#e5dbff" stroke="#6741d9" stroke-width="2"/><rect x="790" y="190" width="330" height="100" rx="14" fill="#c3fae8" stroke="#0c8599" stroke-width="2"/><rect x="0" y="380" width="330" height="120" rx="14" fill="#ffe3e3" stroke="#c92a2a" stroke-width="2"/><rect x="395" y="380" width="330" height="120" rx="14" fill="#fff3bf" stroke="#e67700" stroke-width="2"/><rect x="790" y="380" width="330" height="120" rx="14" fill="#d3f9d8" stroke="#2f9e44" stroke-width="2"/><polyline points="443.6461378421053,106 281.48044310526313,184" fill="none" stroke="#495057" stroke-width="2" marker-end="url(#ah)"/><polyline points="560.0507333333334,106 560.0342666666667,184" fill="none" stroke="#495057" stroke-width="2" marker-end="url(#ah)"/><polyline points="676.4392213087418,105.99999999999999 838.5789473684287,184.0" fill="none" stroke="#495057" stroke-width="2" marker-end="url(#ah)"/><polyline points="165.033,296 165.033,374" fill="none" stroke="#495057" stroke-width="2" marker-end="url(#ah)"/><polyline points="560.033,296 560.033,374" fill="none" stroke="#495057" stroke-width="2" marker-end="url(#ah)"/><polyline points="955.033,296 955.0329999999999,374" fill="none" stroke="#495057" stroke-width="2" marker-end="url(#ah)"/><text x="560.0" y="37.5" font-size="20" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Lương (triệu): 15, 25, 30, 18, 22, 200</text><text x="560.0" y="62.5" font-size="20" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">median 23,5 · IQR 9,75 · mean 51,7</text><text x="165.0" y="227.5" font-size="20" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">MinMaxScaler</text><text x="165.0" y="252.5" font-size="20" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">(x − min)/(max − min)</text><text x="560.0" y="227.5" font-size="20" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">StandardScaler</text><text x="560.0" y="252.5" font-size="20" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">(x − mean)/std</text><text x="955.0" y="227.5" font-size="20" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">RobustScaler</text><text x="955.0" y="252.5" font-size="20" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">(x − median)/IQR</text><text x="165.0" y="415.0" font-size="20" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Lương thường: 0 → 0,08</text><text x="165.0" y="440.0" font-size="20" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">200M → 1</text><text x="165.0" y="465.0" font-size="20" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">BỊ NÉN SÁT 0</text><text x="560.0" y="415.0" font-size="20" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Lương thường: −0,55 → −0,33</text><text x="560.0" y="440.0" font-size="20" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">200M → 2,23</text><text x="560.0" y="465.0" font-size="20" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">DỒN CỤM, lệch</text><text x="955.0" y="415.0" font-size="20" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Lương thường: −0,87 → 0,67</text><text x="955.0" y="440.0" font-size="20" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">200M → 18,1</text><text x="955.0" y="465.0" font-size="20" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">TRẢI ĐỀU quanh 0</text><text x="0" y="-64.4" font-size="26" text-anchor="start" dominant-baseline="middle" fill="#1e1e1e">Outlier 200 triệu làm hỏng scaler nào? (Lec5 tr. 98–101)</text><text x="0" y="552.0" font-size="20" text-anchor="start" dominant-baseline="middle" fill="#1e1e1e">Robust không xóa outlier: 200M vẫn ở xa (18,1), nhưng điểm thường không bị nén.</text></svg>