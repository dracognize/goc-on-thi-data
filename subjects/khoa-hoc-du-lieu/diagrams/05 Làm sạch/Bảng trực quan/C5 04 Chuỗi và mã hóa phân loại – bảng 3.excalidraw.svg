 height="70.0" rx="14" fill="#f1f3f5" stroke="#495057" stroke-width="2"/><rect x="182" y="359.75" width="236" height="70.0" rx="14" fill="#d0ebff" stroke="#1971c2" stroke-width="2"/><rect x="430" y="359.75" width="251" height="70.0" rx="14" fill="#d3f9d8" stroke="#2f9e44" stroke-width="2"/><rect x="0" y="441.75" width="170" height="50.0" rx="14" fill="#f1f3f5" stroke="#495057" stroke-width="2"/><rect x="182" y="441.75" width="236" height="50.0" rx="14" fill="#d0ebff" stroke="#1971c2" stroke-width="2"/><rect x="430" y="441.75" width="251" height="50.0" rx="14" fill="#d3f9d8" stroke="#2f9e44" stroke-width="2"/><rect x="0" y="503.75" width="170" height="50.0" rx="14" fill="#f1f3f5" stroke="#495057" stroke-width="2"/><rect x="182" y="503.75" width="236" height="50.0" rx="14" fill="#d0ebff" stroke="#1971c2" stroke-width="2"/><rect x="430" y="503.75" width="251" height="50.0" rx="14" fill="#d3f9d8" stroke="#2f9e44" stroke-width="2"/><rect x="0" y="565.75" width="170" height="50.0" rx="14" fill="#f1f3f5" stroke="#495057" stroke-width="2"/><rect x="182" y="565.75" width="236" height="50.0" rx="14" fill="#d0ebff" stroke="#1971c2" stroke-width="2"/><rect x="430" y="565.75" width="251" height="50.0" rx="14" fill="#d3f9d8" stroke="#2f9e44" stroke-width="2"/><rect x="0" y="627.75" width="170" height="50.0" rx="14" fill="#f1f3f5" stroke="#495057" stroke-width="2"/><rect x="182" y="627.75" width="236" height="50.0" rx="14" fill="#d0ebff" stroke="#1971c2" stroke-width="2"/><rect x="430" y="627.75" width="251" height="50.0" rx="14" fill="#d3f9d8" stroke="#2f9e44" stroke-width="2"/><text x="85.0" y="26.875" font-size="19" text-anchor="middle" dominant-baseline="middle" fill="#ffffff">Pattern</text><text x="300.0" y="26.875" font-size="19" text-anchor="middle" dominant-baseline="middle" fill="#ffffff">Mô tả</text><text x="555.5" y="26.875" font-size="19" text-anchor="middle" dominant-baseline="middle" fill="#ffffff">Ví dụ</text><text x="85.0" y="106.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">\d</text><text x="300.0" y="106.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Chữ số 0–9</text><text x="555.5" y="96.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">&quot;abc123&quot; → tìm thấy</text><text x="555.5" y="116.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">&quot;123&quot;</text><text x="85.0" y="188.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">\w</text><text x="300.0" y="178.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Ký tự từ (a-z, A-Z,</text><text x="300.0" y="198.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">0-9, _)</text><text x="555.5" y="178.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">&quot;hello_123&quot; → tìm thấy</text><text x="555.5" y="198.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">tất cả</text><text x="85.0" y="260.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">\s</text><text x="300.0" y="260.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Khoảng trắng</text><text x="555.5" y="260.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">&quot;a b c&quot; → 2 dấu cách</text><text x="85.0" y="322.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">+</text><text x="300.0" y="322.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">1 hoặc nhiều lần</text><text x="555.5" y="322.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">\d+ → &quot;123&quot;</text><text x="85.0" y="394.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">—</text><text x="300.0" y="394.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">0 hoặc nhiều lần</text><text x="555.5" y="384.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">\d → có thể không có</text><text x="555.5" y="404.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">số</text><text x="85.0" y="466.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">?</text><text x="300.0" y="466.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">0 hoặc 1 lần</text><text x="555.5" y="466.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">\d? → tối đa 1 số</text><text x="85.0" y="528.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">[]</text><text x="300.0" y="528.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Nhóm ký tự</text><text x="555.5" y="528.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">[0-9] tương đương \d</text><text x="85.0" y="590.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">^</text><text x="300.0" y="590.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Bắt đầu chuỗi</text><text x="555.5" y="590.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">^Hello</text><text x="85.0" y="652.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">$</text><text x="300.0" y="652.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Kết thúc chuỗi</text><text x="555.5" y="652.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">world$</text></svg>