x="14" fill="#ffe8cc" stroke="#d9480f" stroke-width="2"/><text x="85.0" y="38.75" font-size="19" text-anchor="middle" dominant-baseline="middle" fill="#ffffff">Dạng</text><text x="382.0" y="38.75" font-size="19" text-anchor="middle" dominant-baseline="middle" fill="#ffffff">Tên đầy đủ</text><text x="716.0" y="26.875" font-size="19" text-anchor="middle" dominant-baseline="middle" fill="#ffffff">Xác suất thiếu phụ</text><text x="716.0" y="50.625" font-size="19" text-anchor="middle" dominant-baseline="middle" fill="#ffffff">thuộc vào</text><text x="1050.0" y="38.75" font-size="19" text-anchor="middle" dominant-baseline="middle" fill="#ffffff">Ví dụ trong slide</text><text x="85.0" y="140.5" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">MCAR</text><text x="382.0" y="130.5" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Missing Completely At Random, thiếu</text><text x="382.0" y="150.5" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">hoàn toàn ngẫu nhiên</text><text x="716.0" y="140.5" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Không phụ thuộc gì</text><text x="1050.0" y="120.5" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Lỗi hệ thống làm mất ngẫu nhiên vài</text><text x="1050.0" y="140.5" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">dòng, không liên quan đặc tính khách</text><text x="1050.0" y="160.5" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">hàng</text><text x="85.0" y="242.5" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">MAR</text><text x="382.0" y="242.5" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Missing At Random, thiếu ngẫu nhiên</text><text x="716.0" y="242.5" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Biến khác đã quan sát</text><text x="1050.0" y="222.5" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Khách trẻ tuổi hay bỏ trống thu nhập.</text><text x="1050.0" y="242.5" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Thiếu phụ thuộc &quot;tuổi&quot;, không phụ</text><text x="1050.0" y="262.5" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">thuộc trực tiếp &quot;thu nhập&quot;</text><text x="85.0" y="334.5" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">MNAR</text><text x="382.0" y="324.5" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Missing Not At Random, thiếu không</text><text x="382.0" y="344.5" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">ngẫu nhiên</text><text x="716.0" y="334.5" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Chính biến bị thiếu</text><text x="1050.0" y="324.5" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Người thu nhập rất cao hoặc rất thấp</text><text x="1050.0" y="344.5" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">không khai thu nhập</text></svg>