2" marker-end="url(#ah)"/><text x="130.0" y="57.5" font-size="20" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Nhãn có thứ tự</text><text x="130.0" y="82.5" font-size="20" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">ý nghĩa?</text><text x="620.0" y="50.0" font-size="20" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Ordinal → Label / mã thứ tự</text><text x="620.0" y="75.0" font-size="20" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">S&lt;M&lt;L&lt;XL → 0,1,2,3</text><text x="620.0" y="100.0" font-size="20" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">(khai thứ tự tường minh)</text><text x="130.0" y="290.0" font-size="20" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Mô hình cây</text><text x="130.0" y="315.0" font-size="20" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">hoặc là biến</text><text x="130.0" y="340.0" font-size="20" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">mục tiêu?</text><text x="620.0" y="297.5" font-size="20" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Label Encoding được</text><text x="620.0" y="322.5" font-size="20" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">(cây ít bị ảnh hưởng thứ tự)</text><text x="130.0" y="547.5" font-size="20" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Ít category</text><text x="130.0" y="572.5" font-size="20" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">(&lt; 10–15)?</text><text x="620.0" y="530.0" font-size="20" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">One-Hot Encoding</text><text x="620.0" y="555.0" font-size="20" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">get_dummies / OneHotEncoder</text><text x="620.0" y="580.0" font-size="20" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">hồi quy tuyến tính: drop=&#x27;first&#x27;</text><text x="210.0" y="767.5"