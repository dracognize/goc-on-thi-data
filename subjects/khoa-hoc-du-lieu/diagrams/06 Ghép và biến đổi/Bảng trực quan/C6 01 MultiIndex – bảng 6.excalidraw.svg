" height="70.0" rx="14" fill="#d0ebff" stroke="#1971c2" stroke-width="2"/><rect x="0" y="585.75" width="170" height="70.0" rx="14" fill="#f1f3f5" stroke="#495057" stroke-width="2"/><rect x="182" y="585.75" width="400" height="70.0" rx="14" fill="#d0ebff" stroke="#1971c2" stroke-width="2"/><text x="85.0" y="26.875" font-size="19" text-anchor="middle" dominant-baseline="middle" fill="#ffffff">Tham số</text><text x="382.0" y="26.875" font-size="19" text-anchor="middle" dominant-baseline="middle" fill="#ffffff">Ý nghĩa</text><text x="85.0" y="96.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">axis</text><text x="382.0" y="96.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">0: sắp index hàng, 1: sắp index cột</text><text x="85.0" y="158.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">level</text><text x="382.0" y="158.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Cấp dùng để sắp (số hoặc tên)</text><text x="85.0" y="230.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">ascending</text><text x="382.0" y="220.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">True tăng dần (mặc định), False giảm</text><text x="382.0" y="240.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">dần</text><text x="85.0" y="302.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">inplace</text><text x="382.0" y="302.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">True: sửa trực tiếp</text><text x="85.0" y="374.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">kind</text><text x="382.0" y="364.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Thuật toán: &#x27;quicksort&#x27;, &#x27;mergesort&#x27;,</text><text x="382.0" y="384.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">&#x27;heapsort&#x27;, &#x27;stable&#x27;</text><text x="85.0" y="456.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">na_position</text><text x="382.0" y="446.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Vị trí NaN: &#x27;last&#x27; (mặc định) hoặc</text><text x="382.0" y="466.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">&#x27;first&#x27;</text><text x="85.0" y="538.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">sort_remaining</text><text x="382.0" y="528.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Có sắp tiếp các cấp còn lại không</text><text x="382.0" y="548.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">(mặc định True)</text><text x="85.0" y="620.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">key</text><text x="382.0" y="610.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Hàm biến đổi nhãn trước khi sắp</text><text x="382.0" y="630.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">(giống key của sorted())</text></svg>