" height="70.0" rx="14" fill="#d0ebff" stroke="#1971c2" stroke-width="2"/><rect x="0" y="625.75" width="170" height="70.0" rx="14" fill="#f1f3f5" stroke="#495057" stroke-width="2"/><rect x="182" y="625.75" width="400" height="70.0" rx="14" fill="#d0ebff" stroke="#1971c2" stroke-width="2"/><rect x="0" y="707.75" width="170" height="70.0" rx="14" fill="#f1f3f5" stroke="#495057" stroke-width="2"/><rect x="182" y="707.75" width="400" height="70.0" rx="14" fill="#d0ebff" stroke="#1971c2" stroke-width="2"/><rect x="0" y="789.75" width="170" height="50.0" rx="14" fill="#f1f3f5" stroke="#495057" stroke-width="2"/><rect x="182" y="789.75" width="400" height="50.0" rx="14" fill="#d0ebff" stroke="#1971c2" stroke-width="2"/><text x="85.0" y="26.875" font-size="19" text-anchor="middle" dominant-baseline="middle" fill="#ffffff">Đối số</text><text x="382.0" y="26.875" font-size="19" text-anchor="middle" dominant-baseline="middle" fill="#ffffff">Mô tả</text><text x="85.0" y="106.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">objs</text><text x="382.0" y="96.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">List hoặc dict các DataFrame/Series.</text><text x="382.0" y="116.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Đối số bắt buộc duy nhất</text><text x="85.0" y="188.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">axis</text><text x="382.0" y="178.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">0/&#x27;index&#x27;: nối theo hàng (mặc định).</text><text x="382.0" y="198.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">1/&#x27;columns&#x27;: nối theo cột</text><text x="85.0" y="270.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">join</text><text x="382.0" y="260.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">&#x27;outer&#x27; (mặc định, hợp nhãn trục còn</text><text x="382.0" y="280.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">lại) hoặc &#x27;inner&#x27; (giao)</text><text x="85.0" y="352.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">ignore_index</text><text x="382.0" y="342.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">True: bỏ nhãn cũ trên trục nối, tạo</text><text x="382.0" y="362.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">range(tổng độ dài) mới</text><text x="85.0" y="434.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">keys</text><text x="382.0" y="424.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Gắn nhãn cho từng đối tượng → tạo</text><text x="382.0" y="444.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">MultiIndex dọc trục nối</text><text x="85.0" y="506.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">levels</text><text x="382.0" y="506.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Dùng khi keys có nhiều tầng</text><text x="85.0" y="578.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">names</text><text x="382.0" y="568.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Tên cho các cấp MultiIndex tạo bởi</text><text x="382.0" y="588.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">keys/levels</text><text x="85.0" y="650.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">verify_integri</text><text x="85.0" y="670.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">ty</text><text x="382.0" y="650.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">True: nhãn trục mới trùng → báo lỗi</text><text x="382.0" y="670.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">(chậm nhưng an toàn)</text><text x="85.0" y="742.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">sort</text><text x="382.0" y="732.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Sắp nhãn trục không nối khi</text><text x="382.0" y="752.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">join=&#x27;outer&#x27;</text><text x="85.0" y="814.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">copy</text><text x="382.0" y="814.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Sao chép dữ liệu (mặc định True)</text></svg>