<svg xmlns="http://www.w3.org/2000/svg" viewBox="-24 -24 674 784" font-family="Excalifont, 'Segoe Print', 'Comic Sans MS', 'Comic Neue', cursive"><rect x="-24" y="-24" width="100%" height="100%" fill="#fff"/><defs><marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#495057"/></marker></defs><rect x="0" y="0" width="214" height="53.75" rx="14" fill="#495057" stroke="#495057" stroke-width="2"/><rect x="226" y="0" width="400" height="53.75" rx="14" fill="#1971c2" stroke="#1971c2" stroke-width="2"/><rect x="0" y="71.75" width="214" height="50.0" rx="14" fill="#f1f3f5" stroke="#495057" stroke-width="2"/><rect x="226" y="71.75" width="400" height="50.0" rx="14" fill="#d0ebff" stroke="#1971c2" stroke-width="2"/><rect x="0" y="133.75" width="214" height="70.0" rx="14" fill="#f1f3f5" stroke="#495057" stroke-width="2"/><rect x="226" y="133.75" width="400" height="70.0" rx="14" fill="#d0ebff" stroke="#1971c2" stroke-width="2"/><rect x="0" y="215.75" width="214" height="70.0" rx="14" fill="#f1f3f5" stroke="#495057" stroke-width="2"/><rect x="226" y="215.75" width="400" height="70.0" rx="14" fill="#d0ebff" stroke="#1971c2" stroke-width="2"/><rect x="0" y="297.75" width="214" height="70.0" rx="14" fill="#f1f3f5" stroke="#495057" stroke-width="2"/><rect x="226" y="297.75" width="400" height="70.0" rx="14" fill="#d0ebff" stroke="#1971c2" stroke-width="2"/><rect x="0" y="379.75" width="214" height="90.0" rx="14" fill="#f1f3f5" stroke="#495057" stroke-width="2"/><rect x="226" y="379.75" width="400" height="90.0" rx="14" fill="#d0ebff" stroke="#1971c2" stroke-width="2"/><rect x="0" y="481.75" width="214" height="70.0" rx="14" fill="#f1f3f5" stroke="#495057" stroke-width="2"/><rect x="226" y="481.75" width="400" height="70.0" rx="14" fill="#d0ebff" stroke="#1971c2" stroke-width="2"/><rect x="0" y="563.75" width="214" height="90.0" rx="14" fill="#f1f3f5" stroke="#495057" stroke-width="2"/><rect x="226" y="563.75" width="400" height="90.0" rx="14" fill="#d0ebff" stroke="#1971c2" stroke-width="2"/><rect x="0" y="665.75" width="214" height="70.0" rx="14" fill="#f1f3f5" stroke="#495057" stroke-width="2"/><rect x="226" y="665.75" width="400" height="70.0" rx="14" fill="#d0ebff" stroke="#1971c2" stroke-width="2"/><text x="107.0" y="26.875" font-size="19" text-anchor="middle" dominant-baseline="middle" fill="#ffffff">Tham số</text><text x="426.0" y="26.875" font-size="19" text-anchor="middle" dominant-baseline="middle" fill="#ffffff">Ý nghĩa</text><text x="107.0" y="96.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">on</text><text x="426.0" y="96.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Tên cột khóa chung tên ở hai bảng</text><text x="107.0" y="168.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">left_on / right_on</text><text x="426.0" y="158.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Cột khóa ở bảng trái / phải khi tên</text><text x="426.0" y="178.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">khác nhau. Một tên hoặc list tên</text><text x="107.0" y="240.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">left_index /</text><text x="107.0" y="260.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">right_index</text><text x="426.0" y="240.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Dùng index hàng của bảng trái / phải</text><text x="426.0" y="260.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">làm khóa (MultiIndex → nhiều khóa)</text><text x="107.0" y="332.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">sort</text><text x="426.0" y="322.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Sắp kết quả theo khóa (thứ tự từ</text><text x="426.0" y="342.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">điển). Mặc định False</text><text x="107.0" y="424.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">suffixes</text><text x="426.0" y="404.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Hậu tố cho cột trùng tên không phải</text><text x="426.0" y="424.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">khóa. Ví dụ cột data ở hai bảng →</text><text x="426.0" y="444.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">data_x, data_y</text><text x="107.0" y="516.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">copy</text><text x="426.0" y="506.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">False: tránh sao chép trong một số</text><text x="426.0" y="526.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">trường hợp. Mặc định luôn sao chép</text><text x="107.0" y="608.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">validate</text><text x="426.0" y="588.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Kiểm tra loại quan hệ: &#x27;1:1&#x27;, &#x27;1:m&#x27;,</text><text x="426.0" y="608.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">&#x27;m:1&#x27;, &#x27;m:m&#x27; (hoặc &#x27;one_to_one&#x27;, …).</text><text x="426.0" y="628.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Sai → MergeError</text><text x="107.0" y="700.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">indicator</text><text x="426.0" y="690.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Thêm cột _merge với giá trị</text><text x="426.0" y="710.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">&#x27;left_only&#x27;, &#x27;right_only&#x27;, &#x27;both&#x27;</text></svg>