757.15,394.0" fill="none" stroke="#495057" stroke-width="2" marker-end="url(#ah)"/><text x="560.0" y="32.5" font-size="20" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Điểm test</text><text x="560.0" y="57.5" font-size="20" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">x = 7 năm</text><text x="125.0" y="235.0" font-size="20" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Linear Regression</text><text x="125.0" y="260.0" font-size="20" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">ŷ = 10.19 + 4.82·7</text><text x="125.0" y="285.0" font-size="20" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">= 43.95</text><text x="415.0" y="235.0" font-size="20" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">KNN, K = 3</text><text x="415.0" y="260.0" font-size="20" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">hàng xóm 6; 5.5; 5</text><text x="415.0" y="285.0" font-size="20" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">(40+36+35)/3 = 37</text><text x="705.0" y="235.0" font-size="20" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Decision Tree</text><text x="705.0" y="260.0" font-size="20" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">7 ≥ 4.5 → lá phải</text><text x="705.0" y="285.0" font-size="20" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">trung bình lá = 37</text><text x="995.0" y="235.0" font-size="20" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Random Forest</text><text x="995.0" y="260.0" font-size="20" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">3 cây, lấy trung bình</text><text x="995.0" y="285.0" font-size="20" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">slide: 37</text><text x="125.0" y="435.0" font-size="20" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">RMSE 2.3951</text><text x="125.0" y="460.0" font-size="20" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">TỐT NHẤT</text><text x="125.0" y="485.0" font-size="20" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">ngoại suy được xu hướng</text><text x="640.0" y="435.0" font-size="20" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">RMSE 12.0208 (cả ba)</text><text x="640.0" y="460.0" font-size="20" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">chỉ trả trung bình các giá trị đã thấy</text><text x="640.0" y="485.0" font-size="20" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">→ không vượt quá 40</text><text x="0" y="-74.4" font-size="26" text-anchor="start" dominant-baseline="middle" fill="#1e1e1e">Bốn mô hình hồi quy đoán lương cho x = 7 thế nào? (thật: 45)</text></svg>