 height="70.0" rx="14" fill="#ffe8cc" stroke="#d9480f" stroke-width="2"/><text x="111.0" y="26.875" font-size="19" text-anchor="middle" dominant-baseline="middle" fill="#ffffff">Chỉ số</text><text x="404.5" y="26.875" font-size="19" text-anchor="middle" dominant-baseline="middle" fill="#ffffff">Công thức</text><text x="787.0" y="26.875" font-size="19" text-anchor="middle" dominant-baseline="middle" fill="#ffffff">Câu hỏi nó trả lời</text><text x="1121.0" y="26.875" font-size="19" text-anchor="middle" dominant-baseline="middle" fill="#ffffff">Giúp giảm</text><text x="111.0" y="96.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Độ chuẩn</text><text x="111.0" y="116.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">(Precision)</text><text x="404.5" y="106.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">TP / (TP+FP)</text><text x="787.0" y="96.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Trong các lần dự đoán &quot;Bệnh&quot;, bao</text><text x="787.0" y="116.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">nhiêu đúng?</text><text x="1121.0" y="106.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Báo động giả (FP)</text><text x="111.0" y="178.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Độ phủ (Recall / độ</text><text x="111.0" y="198.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">nhạy)</text><text x="404.5" y="188.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">TP / (TP+FN)</text><text x="787.0" y="178.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Trong những người thực sự &quot;Bệnh&quot;,</text><text x="787.0" y="198.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">phát hiện được bao nhiêu?</text