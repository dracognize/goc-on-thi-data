roke="#1971c2" stroke-width="2"/><rect x="616" y="625.75" width="400" height="50.0" rx="14" fill="#d3f9d8" stroke="#2f9e44" stroke-width="2"/><rect x="1028" y="625.75" width="400" height="50.0" rx="14" fill="#ffe8cc" stroke="#d9480f" stroke-width="2"/><text x="96.0" y="26.875" font-size="19" text-anchor="middle" dominant-baseline="middle" fill="#ffffff">Bước</text><text x="404.0" y="26.875" font-size="19" text-anchor="middle" dominant-baseline="middle" fill="#ffffff">API</text><text x="816.0" y="26.875" font-size="19" text-anchor="middle" dominant-baseline="middle" fill="#ffffff">Nhận gì</text><text x="1228.0" y="26.875" font-size="19" text-anchor="middle" dominant-baseline="middle" fill="#ffffff">Kết quả hoặc tác động</text><text x="96.0" y="106.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Chia mẫu</text><text x="404.0" y="96.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">train_test_split(X, y,</text><text x="404.0" y="116.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">test_size=0.25, random_state=42)</text><text x="816.0" y="106.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">X và y có cùng số hàng</text><text x="1228.0" y="96.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">4 kết quả theo thứ tự X train, X</text><text x="1228.0" y="116.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">test, y train, y test</text><text x="96.0" y="178.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Học biến đổi</text><text x="404.0" y="178.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">scaler.fit(X_train)</text><text x="816.0" y="178.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Đặc trưng train</text><text x="1228.0" y="178.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Lưu thống kê vào đối tượng scaler</text><text x="96.0" y="250.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Áp dụng biến đổi</text><text x="404.0" y="250.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">scaler.transform(X_test)</text><text x="816.0" y="250.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Đặc trưng test cùng cột và thứ tự</text><text x="1228.0" y="240.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Dữ liệu test đã đổi với thống kê</text><text x="1228.0" y="260.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">train</text><text x="96.0" y="332.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Học dự đoán</text><text x="404.0" y="332.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">model.fit(X_train, y_train)</text><text x="816.0" y="322.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Một hàng đặc trưng và một đích tương</text><text x="816.0" y="342.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">ứng trên mỗi mẫu</text><text x="1228.0" y="332.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Cập nhật trạng thái mô hình</text><text x="96.0" y="404.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Dự đoán nhãn</text><text x="96.0" y="424.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">hoặc số</text><text x="404.0" y="414.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">model.predict(X_test)</text><text x="816.0" y="414.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Bảng đặc trưng test</text><text x="1228.0" y="414.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Một dự đoán cho mỗi hàng</text><text x="96.0" y="496.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Đọc xác suất lớp</text><text x="404.0" y="496.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">model.predict_proba(X_test)</text><text x="816.0" y="496.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Mô hình phân loại có hỗ trợ</text><text x="1228.0" y="486.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Mỗi hàng chứa xác suất theo thứ tự</text><text x="1228.0" y="506.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">model.classes_</text><text x="96.0" y="568.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Đếm đúng/sai</text><text x="96.0" y="588.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">theo lớp</text><text x="404.0" y="568.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">confusion_matrix(y_test, pred,</text><text x="404.0" y="588.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">labels=[0,1])</text><text x="816.0" y="578.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Nhãn thật và dự đoán</text><text x="1228.0" y="568.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Hàng thật, cột dự đoán theo thứ tự đã</text><text x="1228.0" y="588.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">chọn</text><text x="96.0" y="650.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Tính MAE</text><text x="404.0" y="650.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">mean_absolute_error(y_test, pred)</text><text x="816.0" y="650.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Hai dãy số ghép theo mẫu</text><text x="1228.0" y="650.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Một số theo đơn vị của đích</text></svg>