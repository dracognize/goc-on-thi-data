 height="70.0" rx="14" fill="#ffe8cc" stroke="#d9480f" stroke-width="2"/><text x="85.0" y="26.875" font-size="19" text-anchor="middle" dominant-baseline="middle" fill="#ffffff">Bài toán</text><text x="289.0" y="26.875" font-size="19" text-anchor="middle" dominant-baseline="middle" fill="#ffffff">Chỉ số</text><text x="563.5" y="26.875" font-size="19" text-anchor="middle" dominant-baseline="middle" fill="#ffffff">Công thức</text><text x="931.0" y="26.875" font-size="19" text-anchor="middle" dominant-baseline="middle" fill="#ffffff">Ý nghĩa</text><text x="85.0" y="106.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Hồi quy</text><text x="289.0" y="96.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">MSE (Mean Squared</text><text x="289.0" y="116.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Error)</text><text x="563.5" y="96.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">MSE=frac1nΣᵢ₌₁ⁿ(y_thực</text><text x="563.5" y="116.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">tế-y_dự đoán)²</text><text x="931.0" y="96.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">&quot;Phạt&quot; rất nặng sai lệch lớn (do bình</text><text x="931.0" y="116.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">phương)</text><text x="85.0" y="188.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Hồi quy</text><text x="289.0" y="188.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">RMSE (Root MSE)</text><text x="563.5" y="188.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">RMSE=√(MSE)</text><text x="931.0" y="178.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Đưa sai số về cùng đơn vị với biến</text><text x="931.0" y="198.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">mục tiêu → dễ diễn giải</text><text x="85.0" y="270.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Phân loại</text><text x="289.0" y="260.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Accuracy (độ chính</text><text x="289.0" y="280.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">xác)</text><text x="563.5" y="260.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">(Số dự đoán đúng) / (Tổng số</text><text x="563.5" y="280.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">dự đoán)</text><text x="931.0" y="270.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Tỷ lệ dự đoán đúng</text></svg>