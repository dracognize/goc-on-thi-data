<svg xmlns="http://www.w3.org/2000/svg" viewBox="-24 -24 1123 454" font-family="Excalifont, 'Segoe Print', 'Comic Sans MS', 'Comic Neue', cursive"><rect x="-24" y="-24" width="100%" height="100%" fill="#fff"/><defs><marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#495057"/></marker></defs><rect x="0" y="0" width="348" height="53.75" rx="14" fill="#495057" stroke="#495057" stroke-width="2"/><rect x="360" y="0" width="400" height="53.75" rx="14" fill="#1971c2" stroke="#1971c2" stroke-width="2"/><rect x="772" y="0" width="303" height="53.75" rx="14" fill="#2f9e44" stroke="#2f9e44" stroke-width="2"/><rect x="0" y="71.75" width="348" height="90.0" rx="14" fill="#f1f3f5" stroke="#495057" stroke-width="2"/><rect x="360" y="71.75" width="400" height="90.0" rx="14" fill="#d0ebff" stroke="#1971c2" stroke-width="2"/><rect x="772" y="71.75" width="303" height="90.0" rx="14" fill="#d3f9d8" stroke="#2f9e44" stroke-width="2"/><rect x="0" y="173.75" width="348" height="130.0" rx="14" fill="#f1f3f5" stroke="#495057" stroke-width="2"/><rect x="360" y="173.75" width="400" height="130.0" rx="14" fill="#d0ebff" stroke="#1971c2" stroke-width="2"/><rect x="772" y="173.75" width="303" height="130.0" rx="14" fill="#d3f9d8" stroke="#2f9e44" stroke-width="2"/><rect x="0" y="315.75" width="348" height="90.0" rx="14" fill="#f1f3f5" stroke="#495057" stroke-width="2"/><rect x="360" y="315.75" width="400" height="90.0" rx="14" fill="#d0ebff" stroke="#1971c2" stroke-width="2"/><rect x="772" y="315.75" width="303" height="90.0" rx="14" fill="#d3f9d8" stroke="#2f9e44" stroke-width="2"/><text x="174.0" y="26.875" font-size="19" text-anchor="middle" dominant-baseline="middle" fill="#ffffff">Mô hình</text><text x="560.0" y="26.875" font-size="19" text-anchor="middle" dominant-baseline="middle" fill="#ffffff">Khi nào dừng</text><text x="923.5" y="26.875" font-size="19" text-anchor="middle" dominant-baseline="middle" fill="#ffffff">Tham số liên quan</text><text x="174.0" y="106.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Linear / Logistic Regression (mô</text><text x="174.0" y="126.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">hình lặp)</text><text x="560.0" y="96.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Sau số vòng lặp định sẵn, hoặc khi</text><text x="560.0" y="116.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">mức cải thiện (thay đổi hàm mất mát)</text><text x="560.0" y="136.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">giữa các vòng rất nhỏ, không đáng kể</text><text x="923.5" y="106.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">max_iter (và dung sai tol –</text><text x="923.5" y="126.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Mở rộng)</text><text x="174.0" y="238.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Decision Tree</text><text x="560.0" y="198.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Một nút không thể chia nhỏ hơn, khi:</text><text x="560.0" y="218.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">(1) mọi điểm trong nút cùng một lớp</text><text x="560.0" y="238.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">(nút thuần); (2) đạt độ sâu tối đa;</text><text x="560.0" y="258.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">(3) số mẫu trong nút quá nhỏ để chia</text><text x="560.0" y="278.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">tiếp</text><text x="923.5" y="228.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">max_depth,</text><text x="923.5" y="248.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">min_samples_split</text><text x="174.0" y="360.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">KNN</text><text x="560.0" y="340.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Không có điều kiện dừng: là &quot;mô hình</text><text x="560.0" y="360.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">học lười&quot;, chỉ lưu trữ toàn bộ dữ</text><text x="560.0" y="380.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">liệu</text><text x="923.5" y="350.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">(n_neighbors chỉ dùng lúc</text><text x="923.5" y="370.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">dự đoán)</text></svg>