<svg xmlns="http://www.w3.org/2000/svg" viewBox="-24 -24 771 580" font-family="Excalifont, 'Segoe Print', 'Comic Sans MS', 'Comic Neue', cursive"><rect x="-24" y="-24" width="100%" height="100%" fill="#fff"/><defs><marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#495057"/></marker></defs><rect x="0" y="0" width="311" height="53.75" rx="14" fill="#495057" stroke="#495057" stroke-width="2"/><rect x="323" y="0" width="400" height="53.75" rx="14" fill="#1971c2" stroke="#1971c2" stroke-width="2"/><rect x="0" y="71.75" width="311" height="50.0" rx="14" fill="#f1f3f5" stroke="#495057" stroke-width="2"/><rect x="323" y="71.75" width="400" height="50.0" rx="14" fill="#d0ebff" stroke="#1971c2" stroke-width="2"/><rect x="0" y="133.75" width="311" height="90.0" rx="14" fill="#f1f3f5" stroke="#495057" stroke-width="2"/><rect x="323" y="133.75" width="400" height="90.0" rx="14" fill="#d0ebff" stroke="#1971c2" stroke-width="2"/><rect x="0" y="235.75" width="311" height="70.0" rx="14" fill="#f1f3f5" stroke="#495057" stroke-width="2"/><rect x="323" y="235.75" width="400" height="70.0" rx="14" fill="#d0ebff" stroke="#1971c2" stroke-width="2"/><rect x="0" y="317.75" width="311" height="70.0" rx="14" fill="#f1f3f5" stroke="#495057" stroke-width="2"/><rect x="323" y="317.75" width="400" height="70.0" rx="14" fill="#d0ebff" stroke="#1971c2" stroke-width="2"/><rect x="0" y="399.75" width="311" height="50.0" rx="14" fill="#f1f3f5" stroke="#495057" stroke-width="2"/><rect x="323" y="399.75" width="400" height="50.0" rx="14" fill="#d0ebff" stroke="#1971c2" stroke-width="2"/><rect x="0" y="461.75" width="311" height="70.0" rx="14" fill="#f1f3f5" stroke="#495057" stroke-width="2"/><rect x="323" y="461.75" width="400" height="70.0" rx="14" fill="#d0ebff" stroke="#1971c2" stroke-width="2"/><text x="155.5" y="26.875" font-size="19" text-anchor="middle" dominant-baseline="middle" fill="#ffffff">Bước</text><text x="523.0" y="26.875" font-size="19" text-anchor="middle" dominant-baseline="middle" fill="#ffffff">Việc chính</text><text x="155.5" y="96.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Thu thập dữ liệu</text><text x="523.0" y="96.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Tìm, gom dữ liệu thô từ nhiều nguồn</text><text x="155.5" y="168.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Tiền xử lý &amp; Phân tích khám</text><text x="155.5" y="188.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">phá (EDA)</text><text x="523.0" y="158.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Giai đoạn quan trọng nhất: xử lý giá</text><text x="523.0" y="178.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">trị thiếu, ngoại lai (outliers),</text><text x="523.0" y="198.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">chuẩn hóa, khám phá dữ liệu</text><text x="155.5" y="260.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Lựa chọn &amp; Huấn luyện mô</text><text x="155.5" y="280.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">hình</text><text x="523.0" y="260.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Chọn vài mô hình tiềm năng, huấn</text><text x="523.0" y="280.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">luyện trên train</text><text x="155.5" y="352.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Đánh giá mô hình</text><text x="523.0" y="342.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Dùng test đo hiệu suất, chọn mô hình</text><text x="523.0" y="362.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">tốt nhất</text><text x="155.5" y="424.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Tinh chỉnh tham số</text><text x="523.0" y="424.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Tối ưu tham số của mô hình tốt nhất</text><text x="155.5" y="496.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Triển khai</text><text x="523.0" y="486.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Đưa vào môi trường thật để dự đoán dữ</text><text x="523.0" y="506.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">liệu mới</text></svg>