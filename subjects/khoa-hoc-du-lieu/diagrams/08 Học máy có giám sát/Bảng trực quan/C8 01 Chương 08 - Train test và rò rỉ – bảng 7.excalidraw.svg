" height="70.0" rx="14" fill="#f1f3f5" stroke="#495057" stroke-width="2"/><rect x="182" y="359.75" width="385" height="70.0" rx="14" fill="#d0ebff" stroke="#1971c2" stroke-width="2"/><rect x="579" y="359.75" width="400" height="70.0" rx="14" fill="#d3f9d8" stroke="#2f9e44" stroke-width="2"/><text x="85.0" y="26.875" font-size="19" text-anchor="middle" dominant-baseline="middle" fill="#ffffff">—</text><text x="374.5" y="26.875" font-size="19" text-anchor="middle" dominant-baseline="middle" fill="#ffffff">Dưới khớp (Underfitting)</text><text x="779.0" y="26.875" font-size="19" text-anchor="middle" dominant-baseline="middle" fill="#ffffff">Quá khớp (Overfitting)</text><text x="85.0" y="106.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Hiện tượng</text><text x="374.5" y="96.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Mô hình quá đơn giản, không nắm quy</text><text x="374.5" y="116.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">luật cơ bản</text><text x="779.0" y="96.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Mô hình quá phức tạp, học thuộc cả</text><text x="779.0" y="116.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">nhiễu (noise)</text><text x="85.0" y="178.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Train</text><text x="374.5" y="178.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Kém</text><text x="779.0" y="178.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Cực tốt</text><text x="85.0" y="240.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Test</text><text x="374.5" y="240.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Kém</text><text x="779.0" y="240.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Rất kém</text><text x="85.0" y="312.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Ví dụ slide</text><text x="374.5" y="302.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Dùng đường thẳng mô tả quan hệ</text><text x="374.5" y="322.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">parabol</text><text x="779.0" y="302.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Đường cong uốn lượn đi qua chính xác</text><text x="779.0" y="322.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">mọi điểm train</text><text x="85.0" y="394.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Khắc phục</text><text x="374.5" y="384.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Mô hình phức tạp hơn, thêm đặc</text><text x="374.5" y="404.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">trưng</text><text x="779.0" y="394.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Thêm dữ liệu, giảm độ phức tạp</text></svg>