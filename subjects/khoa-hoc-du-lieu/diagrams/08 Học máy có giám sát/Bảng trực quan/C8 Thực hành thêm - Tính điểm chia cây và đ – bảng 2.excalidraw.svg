 height="70.0" rx="14" fill="#ffe8cc" stroke="#d9480f" stroke-width="2"/><rect x="0" y="317.75" width="177" height="90.0" rx="14" fill="#f1f3f5" stroke="#495057" stroke-width="2"/><rect x="189" y="317.75" width="318" height="90.0" rx="14" fill="#d0ebff" stroke="#1971c2" stroke-width="2"/><rect x="519" y="317.75" width="400" height="90.0" rx="14" fill="#d3f9d8" stroke="#2f9e44" stroke-width="2"/><rect x="931" y="317.75" width="400" height="90.0" rx="14" fill="#ffe8cc" stroke="#d9480f" stroke-width="2"/><rect x="0" y="419.75" width="177" height="90.0" rx="14" fill="#f1f3f5" stroke="#495057" stroke-width="2"/><rect x="189" y="419.75" width="318" height="90.0" rx="14" fill="#d0ebff" stroke="#1971c2" stroke-width="2"/><rect x="519" y="419.75" width="400" height="90.0" rx="14" fill="#d3f9d8" stroke="#2f9e44" stroke-width="2"/><rect x="931" y="419.75" width="400" height="90.0" rx="14" fill="#ffe8cc" stroke="#d9480f" stroke-width="2"/><text x="88.5" y="26.875" font-size="19" text-anchor="middle" dominant-baseline="middle" fill="#ffffff">Họ</text><text x="348.0" y="26.875" font-size="19" text-anchor="middle" dominant-baseline="middle" fill="#ffffff">Việc làm lúc fit</text><text x="719.0" y="26.875" font-size="19" text-anchor="middle" dominant-baseline="middle" fill="#ffffff">Dừng hoặc kiểm soát phức tạp</text><text x="1131.0" y="26.875" font-size="19" text-anchor="middle" dominant-baseline="middle" fill="#ffffff">Thang đo</text><text x="88.5" y="106.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">KNN</text><text x="348.0" y="96.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Lưu mẫu và thiết lập cách tìm</text><text x="348.0" y="116.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">hàng xóm</text><text x="719.0" y="106.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Chọn số hàng xóm khi dự đoán</text><text x="1131.0" y="96.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Khoảng cách dễ bị đặc trưng có thang</text><text x="1131.0" y="116.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">lớn lấn át</text><text x="88.5" y="188.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Cây</text><text x="348.0" y="178.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Chọn điều kiện chia tại từng</text><text x="348.0" y="198.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">nút</text><text x="719.0" y="178.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">max_depth, min_samples_leaf, hoặc</text><text x="719.0" y="198.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">không còn cách chia hợp lệ</text><text x="1131.0" y="178.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Biến đổi đơn điệu giữ thứ tự thường</text><text x="1131.0" y="198.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">ít ảnh hưởng tới cách chia</text><text x="88.5" y="270.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Rừng</text><text x="348.0" y="270.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Huấn luyện nhiều cây</text><text x="719.0" y="260.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">n_estimators là số cây, đặt giới hạn</text><text x="719.0" y="280.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">từng cây riêng</text><text x="1131.0" y="260.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Thường ít nhạy với thang đo tương tự</text><text x="1131.0" y="280.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">cây</text><text x="88.5" y="352.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Logistic</text><text x="88.5" y="372.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Regression</text><text x="348.0" y="362.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Tối ưu hệ số</text><text x="719.0" y="352.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Hội tụ theo dung sai hoặc đạt</text><text x="719.0" y="372.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">max_iter</text><text x="1131.0" y="342.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Thang tương đồng có thể hỗ trợ ổn</text><text x="1131.0" y="362.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">định việc tối ưu và áp dụng điều</text><text x="1131.0" y="382.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">chuẩn</text><text x="88.5" y="454.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Linear</text><text x="88.5" y="474.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Regression</text><text x="348.0" y="454.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Tìm hệ số giảm sai số bình</text><text x="348.0" y="474.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">phương</text><text x="719.0" y="444.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Cách dừng tùy thuật toán. Bộ giải</text><text x="719.0" y="464.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">bình phương tối thiểu có thể giải</text><text x="719.0" y="484.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">trực tiếp</text><text x="1131.0" y="454.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Thang đo ảnh hưởng hệ số, diễn giải</text><text x="1131.0" y="474.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">và độ ổn định số</text></svg>