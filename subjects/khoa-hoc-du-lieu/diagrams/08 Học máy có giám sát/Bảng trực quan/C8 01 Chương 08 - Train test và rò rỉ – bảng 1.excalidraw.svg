<svg xmlns="http://www.w3.org/2000/svg" viewBox="-24 -24 1416 354" font-family="Excalifont, 'Segoe Print', 'Comic Sans MS', 'Comic Neue', cursive"><rect x="-24" y="-24" width="100%" height="100%" fill="#fff"/><defs><marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#495057"/></marker></defs><rect x="0" y="0" width="318" height="53.75" rx="14" fill="#495057" stroke="#495057" stroke-width="2"/><rect x="330" y="0" width="214" height="53.75" rx="14" fill="#1971c2" stroke="#1971c2" stroke-width="2"/><rect x="556" y="0" width="400" height="53.75" rx="14" fill="#2f9e44" stroke="#2f9e44" stroke-width="2"/><rect x="968" y="0" width="400" height="53.75" rx="14" fill="#d9480f" stroke="#d9480f" stroke-width="2"/><rect x="0" y="71.75" width="318" height="70.0" rx="14" fill="#f1f3f5" stroke="#495057" stroke-width="2"/><rect x="330" y="71.75" width="214" height="70.0" rx="14" fill="#d0ebff" stroke="#1971c2" stroke-width="2"/><rect x="556" y="71.75" width="400" height="70.0" rx="14" fill="#d3f9d8" stroke="#2f9e44" stroke-width="2"/><rect x="968" y="71.75" width="400" height="70.0" rx="14" fill="#ffe8cc" stroke="#d9480f" stroke-width="2"/><rect x="0" y="153.75" width="318" height="70.0" rx="14" fill="#f1f3f5" stroke="#495057" stroke-width="2"/><rect x="330" y="153.75" width="214" height="70.0" rx="14" fill="#d0ebff" stroke="#1971c2" stroke-width="2"/><rect x="556" y="153.75" width="400" height="70.0" rx="14" fill="#d3f9d8" stroke="#2f9e44" stroke-width="2"/><rect x="968" y="153.75" width="400" height="70.0" rx="14" fill="#ffe8cc" stroke="#d9480f" stroke-width="2"/><rect x="0" y="235.75" width="318" height="70.0" rx="14" fill="#f1f3f5" stroke="#495057" stroke-width="2"/><rect x="330" y="235.75" width="214" height="70.0" rx="14" fill="#d0ebff" stroke="#1971c2" stroke-width="2"/><rect x="556" y="235.75" width="400" height="70.0" rx="14" fill="#d3f9d8" stroke="#2f9e44" stroke-width="2"/><rect x="968" y="235.75" width="400" height="70.0" rx="14" fill="#ffe8cc" stroke="#d9480f" stroke-width="2"/><text x="159.0" y="26.875" font-size="19" text-anchor="middle" dominant-baseline="middle" fill="#ffffff">Loại</text><text x="437.0" y="26.875" font-size="19" text-anchor="middle" dominant-baseline="middle" fill="#ffffff">Dữ liệu</text><text x="756.0" y="26.875" font-size="19" text-anchor="middle" dominant-baseline="middle" fill="#ffffff">Mô hình làm gì</text><text x="1168.0" y="26.875" font-size="19" text-anchor="middle" dominant-baseline="middle" fill="#ffffff">Ví dụ slide</text><text x="159.0" y="96.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Có giám sát (Supervised</text><text x="159.0" y="116.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Learning)</text><text x="437.0" y="106.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Đã gán nhãn</text><text x="756.0" y="96.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Học ánh xạ từ đặc trưng (features)</text><text x="756.0" y="116.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">sang nhãn (labels)</text><text x="1168.0" y="96.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Giá nhà (diện tích, số phòng → giá);</text><text x="1168.0" y="116.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">spam/không spam</text><text x="159.0" y="178.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Không giám sát (Unsupervised</text><text x="159.0" y="198.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Learning)</text><text x="437.0" y="188.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Không nhãn</text><text x="756.0" y="178.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Tự tìm cấu trúc, quy luật, cụm</text><text x="756.0" y="198.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">(cluster)</text><text x="1168.0" y="178.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Phân cụm khách hàng theo hành vi mua;</text><text x="1168.0" y="198.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">giảm chiều dữ liệu</text><text x="159.0" y="260.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Củng cố (Reinforcement</text><text x="159.0" y="280.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Learning)</text><text x="437.0" y="260.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Tương tác với môi</text><text x="437.0" y="280.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">trường</text><text x="756.0" y="260.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Thử và sai, nhận phần thưởng/hình</text><text x="756.0" y="280.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">phạt cho mỗi hành động</text><text x="1168.0" y="270.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Bot chơi game, xe tự lái</text></svg>