<svg xmlns="http://www.w3.org/2000/svg" viewBox="-24 -124 1308 598" font-family="Excalifont, 'Segoe Print', 'Comic Sans MS', 'Comic Neue', cursive"><rect x="-24" y="-124" width="100%" height="100%" fill="#fff"/><defs><marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#495057"/></marker></defs><rect x="200" y="0" width="280" height="120" rx="14" fill="#d3f9d8" stroke="#2f9e44" stroke-width="2"/><rect x="510" y="0" width="280" height="120" rx="14" fill="#ffe3e3" stroke="#c92a2a" stroke-width="2"/><rect x="200" y="160" width="280" height="120" rx="14" fill="#ffe8cc" stroke="#d9480f" stroke-width="2"/><rect x="510" y="160" width="280" height="120" rx="14" fill="#d3f9d8" stroke="#2f9e44" stroke-width="2"/><rect x="880" y="0" width="380" height="120" rx="14" fill="#d0ebff" stroke="#1971c2" stroke-width="2"/><rect x="200" y="340" width="380" height="110" rx="14" fill="#e5dbff" stroke="#6741d9" stroke-width="2"/><rect x="880" y="340" width="380" height="110" rx="14" fill="#c3fae8" stroke="#0c8599" stroke-width="2"/><rect x="880" y="170" width="380" height="120" rx="14" fill="#f1f3f5" stroke="#495057" stroke-width="2"/><polyline points="796.0,60.0 874.0,60.0" fill="none" stroke="#495057" stroke-width="2" marker-end="url(#ah)"/><polyline points="358.85714285714283,286.0 372.57142857142856,334.0" fill="none" stroke="#495057" stroke-width="2" marker-end="url(#ah)"/><polyline points="586.0,395.0 874.0,395.0" fill="none" stroke="#495057" stroke-width="2" stroke-dasharray="8 6" marker-end="url(#ah)"/><polyline points="1070.0,126.0 1070.0,164.0" fill="none" stroke="#495057" stroke-width="2" stroke-dasharray="8 6" marker-end="url(#ah)"/><polyline points="1070.0,296.0 1070.0,334.0" fill="none" stroke="#495057" stroke-width="2" stroke-dasharray="8 6" marker-end="url(#ah)"/><text x="340.0" y="47.5" font-size="20" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">TP</text><text x="340.0" y="72.5" font-size="20" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">đoán Bệnh, đúng</text><text x="650.0" y="47.5" font-size="20" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">FN · lỗi loại II</text><text x="650.0" y="72.5" font-size="20" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">bỏ sót, nguy hiểm</text><text x="340.0" y="207.5" font-size="20" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">FP · lỗi loại I</text><text x="340.0" y="232.5" font-size="20" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">báo động giả</text><text x="650.0" y="207.5" font-size="20" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">TN</text><text x="650.0" y="232.5" font-size="20" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">đoán Bình thường, đúng</text><text x="1070.0" y="47.5" font-size="20" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Recall = TP / (TP + FN)</text><text x="1070.0" y="72.5" font-size="20" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">= đi theo HÀNG thực tế dương</text><text x="390.0" y="382.5" font-size="20" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Precision = TP / (TP + FP)</text><text x="390.0" y="407.5" font-size="20" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">= đi theo CỘT dự đoán dương</text><text x="1070.0" y="382.5" font-size="20" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">F1 = 2·P·R / (P + R)</text><text x="1070.0" y="407.5" font-size="20" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">cân bằng P và R</text><text x="1070.0" y="205.0" font-size="20" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Accuracy = (TP + TN) / tổng</text><text x="1070.0" y="230.0" font-size="20" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">dễ đánh lừa khi lớp lệch</text><text x="1070.0" y="255.0" font-size="20" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">(bệnh hiếm 1%: 99% vẫn vô dụng)</text><text x="835.0" y="43.6" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#495057">giảm bỏ sót</text><text x="365.71428571428567" y="293.6" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#495057">giảm báo giả</text><text x="0" y="-85.6" font-size="24" text-anchor="start" dominant-baseline="middle" fill="#1e1e1e">Ô nào vào công thức nào? (bố cục slide: hàng = thực tế, cột = dự đoán, dương trước)</text><text x="250" y="-28.0" font-size="20" text-anchor="start" dominant-baseline="middle" fill="#1e1e1e">Dự đoán: Dương</text><text x="560" y="-28.0" font-size="20" text-anchor="start" dominant-baseline="middle" fill="#1e1e1e">Dự đoán: Âm</text><text x="20" y="32.0" font-size="20" text-anchor="start" dominant-baseline="middle" fill="#1e1e1e">Thực tế</text><text x="20" y="57.0" font-size="20" text-anchor="start" dominant-baseline="middle" fill="#1e1e1e">Dương</text><text x="20" y="192.0" font-size="20" text-anchor="start" dominant-baseline="middle" fill="#1e1e1e">Thực tế</text><text x="20" y="217.0" font-size="20" text-anchor="start" dominant-baseline="middle" fill="#1e1e1e">Âm</text></svg>