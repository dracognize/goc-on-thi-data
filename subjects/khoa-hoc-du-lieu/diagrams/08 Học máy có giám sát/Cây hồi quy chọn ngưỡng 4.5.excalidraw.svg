<svg xmlns="http://www.w3.org/2000/svg" viewBox="-24 -114 988 968" font-family="Excalifont, 'Segoe Print', 'Comic Sans MS', 'Comic Neue', cursive"><rect x="-24" y="-114" width="100%" height="100%" fill="#fff"/><defs><marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#495057"/></marker></defs><rect x="300" y="0" width="340" height="110" rx="14" fill="#f1f3f5" stroke="#495057" stroke-width="2"/><rect x="260" y="170" width="420" height="140" rx="14" fill="#fff3bf" stroke="#e67700" stroke-width="2"/><polygon points="470.0,370 620,425.0 470.0,480 320,425.0" fill="#e5dbff" stroke="#6741d9" stroke-width="2"/><rect x="0" y="540" width="380" height="120" rx="14" fill="#d0ebff" stroke="#1971c2" stroke-width="2"/><rect x="560" y="540" width="380" height="120" rx="14" fill="#d3f9d8" stroke="#2f9e44" stroke-width="2"/><rect x="560" y="720" width="380" height="110" rx="14" fill="#ffe3e3" stroke="#c92a2a" stroke-width="2"/><rect x="0" y="720" width="420" height="90" rx="14" fill="#ffe8cc" stroke="#d9480f" stroke-width="2"/><polyline points="470.0,116.0 470.0,164.0" fill="none" stroke="#495057" stroke-width="2" marker-end="url(#ah)"/><polyline points="470.0,316.0 470.0,364.0" fill="none" stroke="#495057" stroke-width="2" marker-end="url(#ah)"/><polyline points="372.4,486.0 295.6,534.0" fill="none" stroke="#495057" stroke-width="2" marker-end="url(#ah)"/><polyline points="567.6,486.0 644.4,534.0" fill="none" stroke="#495057" stroke-width="2" marker-end="url(#ah)"/><polyline points="750.0,666.0 750.0,714.0" fill="none" stroke="#495057" stroke-width="2" marker-end="url(#ah)"/><polyline points="198.0,666.0 203.8181818181818,714.0" fill="none" stroke="#495057" stroke-width="2" stroke-dasharray="8 6" marker-end="url(#ah)"/><text x="470.0" y="30.0" font-size="20" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Nút gốc: 8 điểm train</text><text x="470.0" y="55.0" font-size="20" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">trung bình 27.375</text><text x="470.0" y="80.0" font-size="20" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">MSE ban đầu ≈ 71.23</text><text x="470.0" y="202.5" font-size="20" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Thử mọi ngưỡng (điểm giữa)</text><text x="470.0" y="227.5" font-size="20" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">1.25 → 48.36 · 2.0 → 25.73</text><text x="470.0" y="252.5" font-size="20" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">3.5 → 16.60 · 4.5 → 15.40 ✔</text><text x="470.0" y="277.5" font-size="20" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">5.25 → 32.35 · 5.75 → 41.68</text><text x="470.0" y="425.0" font-size="20" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Kinh nghiệm &lt; 4.5 ?</text><text x="190.0" y="575.0" font-size="20" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Lá trái: x = 1; 1.5; 2.5; 3; 4</text><text x="190.0" y="600.0" font-size="20" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">lương 15, 18, 22, 25, 28</text><text x="190.0" y="625.0" font-size="20" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">ŷ = 21.6 · MSE 21.84</text><text x="750.0" y="575.0" font-size="20" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Lá phải: x = 5; 5.5; 6</text><text x="750.0" y="600.0" font-size="20" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">lương 35, 36, 40</text><text x="750.0" y="625.0" font-size="20" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">ŷ = 37 · MSE 4.67</text><text x="750.0" y="750.0" font-size="20" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Test x = 7 và x = 8 ≥ 4.5</text><text x="750.0" y="775.0" font-size="20" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">→ ŷ = 37 (thật 45, 52)</text><text x="750.0" y="800.0" font-size="20" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">RMSE ≈ 12.02</text><text x="210.0" y="752.5" font-size="20" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">MSE sau chia = 5/8·21.84 + 3/8·4.67</text><text x="210.0" y="777.5" font-size="20" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">= 13.65 + 1.75 = 15.40</text><text x="470.0" y="123.6" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#495057">giảm MSE</text><text x="470.0" y="323.6" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#495057">chọn nhỏ nhất</text><text x="334.0" y="493.6" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#495057">Có</text><text x="606.0" y="493.6" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#495057">Không</text><text x="750.0" y="673.6" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#495057">dự đoán</text><text x="0" y="-74.4" font-size="26" text-anchor="start" dominant-baseline="middle" fill="#1e1e1e">Cây hồi quy chọn ngưỡng nào, và đoán gì cho x = 7?</text></svg>