<svg xmlns="http://www.w3.org/2000/svg" viewBox="-24 -114 1228 728" font-family="Excalifont, 'Segoe Print', 'Comic Sans MS', 'Comic Neue', cursive"><rect x="-24" y="-114" width="100%" height="100%" fill="#fff"/><defs><marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#495057"/></marker></defs><polygon points="580.0,0 740,75.0 580.0,150 420,75.0" fill="#e5dbff" stroke="#6741d9" stroke-width="2"/><rect x="0" y="240" width="340" height="120" rx="14" fill="#d0ebff" stroke="#1971c2" stroke-width="2"/><rect x="380" y="240" width="360" height="140" rx="14" fill="#d3f9d8" stroke="#2f9e44" stroke-width="2"/><rect x="800" y="240" width="380" height="120" rx="14" fill="#ffe8cc" stroke="#d9480f" stroke-width="2"/><rect x="800" y="440" width="380" height="150" rx="14" fill="#fff3bf" stroke="#e67700" stroke-width="2"/><rect x="0" y="440" width="340" height="120" rx="14" fill="#ffe3e3" stroke="#c92a2a" stroke-width="2"/><polyline points="432.4,156.0 290.26666666666665,234.0" fill="none" stroke="#495057" stroke-width="2" marker-end="url(#ah)"/><polyline points="573.1063829787234,156.0 566.468085106383,234.0" fill="none" stroke="#495057" stroke-width="2" marker-end="url(#ah)"/><polyline points="727.6,156.0 869.7333333333333,234.0" fill="none" stroke="#495057" stroke-width="2" marker-end="url(#ah)"/><polyline points="990.0,366.0 990.0,434.0" fill="none" stroke="#495057" stroke-width="2" marker-end="url(#ah)"/><polyline points="170.0,366.0 170.0,434.0" fill="none" stroke="#495057" stroke-width="2" stroke-dasharray="8 6" marker-end="url(#ah)"/><text x="580.0" y="50.0" font-size="20" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Mô hình dùng</text><text x="580.0" y="75.0" font-size="20" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">khoảng cách hoặc</text><text x="580.0" y="100.0" font-size="20" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">hạ gradient?</text><text x="170.0" y="275.0" font-size="20" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">KNN</text><text x="170.0" y="300.0" font-size="20" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">CẦN chuẩn hóa (khoảng cách)</text><text x="170.0" y="325.0" font-size="20" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Dừng: KHÔNG có (học lười)</text><text x="560.0" y="272.5" font-size="20" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Linear / Logistic</text><text x="560.0" y="297.5" font-size="20" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">CẦN chuẩn hóa (gradient descent)</text><text x="560.0" y="322.5" font-size="20" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Dừng: max_iter hoặc</text><text x="560.0" y="347.5" font-size="20" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">cải thiện rất nhỏ</text><text x="990.0" y="275.0" font-size="20" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Decision Tree / Random Forest</text><text x="990.0" y="300.0" font-size="20" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">KHÔNG cần chuẩn hóa</text><text x="990.0" y="325.0" font-size="20" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">(xét từng đặc trưng độc lập)</text><text x="990.0" y="477.5" font-size="20" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Cây dừng chia khi:</text><text x="990.0" y="502.5" font-size="20" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">1. nút thuần (một lớp)</text><text x="990.0" y="527.5" font-size="20" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">2. đạt max_depth</text><text x="990.0" y="552.5" font-size="20" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">3. ít hơn min_samples_split</text><text x="170.0" y="475.0" font-size="20" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Lương 15–50 triệu lấn át</text><text x="170.0" y="500.0" font-size="20" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">kinh nghiệm 1–10 năm</text><text x="170.0" y="525.0" font-size="20" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">→ scale trước khi tính khoảng cách</text><text x="361.33333333333326" y="178.6" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#495057">khoảng cách</text><text x="569.7872340425532" y="178.6" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#495057">gradient</text><text x="798.6666666666667" y="178.6" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#495057">không, dựa quy tắc</text><text x="0" y="-74.4" font-size="26" text-anchor="start" dominant-baseline="middle" fill="#1e1e1e">Mô hình này có cần chuẩn hóa không, và dừng học khi nào?</text></svg>