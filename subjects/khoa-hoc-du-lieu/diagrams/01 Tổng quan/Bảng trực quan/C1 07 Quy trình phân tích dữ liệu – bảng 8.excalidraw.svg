eight="90.0" rx="14" fill="#f1f3f5" stroke="#495057" stroke-width="2"/><rect x="308" y="235.75" width="199" height="90.0" rx="14" fill="#d0ebff" stroke="#1971c2" stroke-width="2"/><rect x="519" y="235.75" width="303" height="90.0" rx="14" fill="#d3f9d8" stroke="#2f9e44" stroke-width="2"/><rect x="834" y="235.75" width="400" height="90.0" rx="14" fill="#ffe8cc" stroke="#d9480f" stroke-width="2"/><rect x="1246" y="235.75" width="400" height="90.0" rx="14" fill="#e5dbff" stroke="#6741d9" stroke-width="2"/><rect x="0" y="337.75" width="296" height="70.0" rx="14" fill="#f1f3f5" stroke="#495057" stroke-width="2"/><rect x="308" y="337.75" width="199" height="70.0" rx="14" fill="#d0ebff" stroke="#1971c2" stroke-width="2"/><rect x="519" y="337.75" width="303" height="70.0" rx="14" fill="#d3f9d8" stroke="#2f9e44" stroke-width="2"/><rect x="834" y="337.75" width="400" height="70.0" rx="14" fill="#ffe8cc" stroke="#d9480f" stroke-width="2"/><rect x="1246" y="337.75" width="400" height="70.0" rx="14" fill="#e5dbff" stroke="#6741d9" stroke-width="2"/><text x="148.0" y="26.875" font-size="19" text-anchor="middle" dominant-baseline="middle" fill="#ffffff">Cấp độ</text><text x="407.5" y="26.875" font-size="19" text-anchor="middle" dominant-baseline="middle" fill="#ffffff">Câu hỏi</text><text x="670.5" y="26.875" font-size="19" text-anchor="middle" dominant-baseline="middle" fill="#ffffff">Mục tiêu</text><text x="1034.0" y="26.875" font-size="19" text-anchor="middle" dominant-baseline="middle" fill="#ffffff">Kỹ thuật</text><text x="1446.0" y="26.875" font-size="19" text-anchor="middle" dominant-baseline="middle" fill="#ffffff">Ví dụ slide</text><text x="148.0" y="106.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Mô tả (Descriptive)</text><text x="407.5" y="96.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Điều gì đã xảy</text><text x="407.5" y="116.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">ra?</text><text x="670.5" y="106.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Tổng hợp thông tin lịch sử</text><text x="1034.0" y="96.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Thống kê mô tả, trực quan hóa, phân</text><text x="1034.0" y="116.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">cụm</text><text x="1446.0" y="96.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Doanh thu TB theo tháng, dashboard</text><text x="1446.0" y="116.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">KPI, tỉ lệ theo nhóm khách</text><text x="148.0" y="188.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Chẩn đoán (Diagnostic)</text><text x="407.5" y="188.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Tại sao?</text><text x="670.5" y="178.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Tìm nguyên nhân, cơ chế</text><text x="670.5" y="198.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">sinh dữ liệu</text><text x="1034.0" y="178.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Kiểm định giả thuyết, tương quan, hồi</text><text x="1034.0" y="198.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">quy</text><text x="1446.0" y="178.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">ANOVA so doanh thu các chi nhánh;</text><text x="1446.0" y="198.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">quan hệ chi phí sự kiện – doanh thu</text><text x="148.0" y="280.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Dự báo (Predictive)</text><text x="407.5" y="270.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Điều gì có thể</text><text x="407.5" y="290.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">xảy ra?</text><text x="670.5" y="270.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Dự đoán tương lai từ lịch</text><text x="670.5" y="290.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">sử</text><text x="1034.0" y="270.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Hồi quy, cây quyết định, random</text><text x="1034.0" y="290.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">forest, boosting, neural networks</text><text x="1446.0" y="260.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Doanh thu, nhu cầu, rủi ro tín dụng;</text><text x="1446.0" y="280.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">doanh thu với ngân sách quảng cáo cố</text><text x="1446.0" y="300.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">định</text><text x="148.0" y="362.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Định hướng hành động</text><text x="148.0" y="382.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">(Prescriptive)</text><text x="407.5" y="362.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Chúng ta nên làm</text><text x="407.5" y="382.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">gì?</text><text x="670.5" y="362.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Tối ưu hành động, đề xuất</text><text x="670.5" y="382.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">quyết định</text><text x="1034.0" y="362.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Tối ưu hóa, mô hình kịch bản, mô</text><text x="1034.0" y="382.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">phỏng rủi ro</text><text x="1446.0" y="362.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Phân bổ ngân sách marketing tối đa</text><text x="1446.0" y="382.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">lợi nhuận; tối ưu lộ trình giao hàng</text></svg>