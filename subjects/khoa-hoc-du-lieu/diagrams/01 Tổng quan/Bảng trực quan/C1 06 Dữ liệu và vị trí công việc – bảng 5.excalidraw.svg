ize="19" text-anchor="middle" dominant-baseline="middle" fill="#ffffff">Vị trí</text><text x="523.0" y="26.875" font-size="19" text-anchor="middle" dominant-baseline="middle" fill="#ffffff">Câu khẩu hiệu trên slide</text><text x="853.0" y="26.875" font-size="19" text-anchor="middle" dominant-baseline="middle" fill="#ffffff">Đầu ra điển hình</text><text x="155.5" y="96.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Kỹ sư dữ liệu (Data</text><text x="155.5" y="116.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Engineer)</text><text x="523.0" y="96.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">&quot;Người xây dựng đường ống và kho chứa</text><text x="523.0" y="116.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">dữ liệu&quot;</text><text x="853.0" y="96.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Pipeline, kho dữ</text><text x="853.0" y="116.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">liệu</text><text x="155.5" y="178.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Nhà phân tích dữ liệu (Data</text><text x="155.5" y="198.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Analyst)</text><text x="523.0" y="178.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">&quot;Người kể chuyện bằng dữ liệu để hỗ</text><text x="523.0" y="198.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">trợ quyết định&quot;</text><text x="853.0" y="188.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Báo cáo, dashboard</text><text x="155.5" y="260.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Nhà khoa học dữ liệu (Data</text><text x="155.5" y="280.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Scientist)</text><text x="523.0" y="260.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">&quot;Người tạo ra mô hình dự đoán và ra</text><text x="523.0" y="280.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">quyết định thông minh&quot;</text><text x="853.0" y="270.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Mô hình dự đoán</text><text x="155.5" y="352.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Kỹ sư học máy (ML Engineer)</text><text x="523.0" y="342.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">&quot;Người biến mô hình thành sản phẩm</text><text x="523.0" y="362.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">thực tế&quot;</text><text x="853.0" y="342.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Dịch vụ chấm điểm</text><text x="853.0" y="362.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">chạy thật</text></svg>