 height="50.0" rx="14" fill="#f1f3f5" stroke="#495057" stroke-width="2"/><rect x="182" y="379.75" width="355" height="50.0" rx="14" fill="#d0ebff" stroke="#1971c2" stroke-width="2"/><rect x="549" y="379.75" width="400" height="50.0" rx="14" fill="#d3f9d8" stroke="#2f9e44" stroke-width="2"/><rect x="0" y="441.75" width="170" height="50.0" rx="14" fill="#f1f3f5" stroke="#495057" stroke-width="2"/><rect x="182" y="441.75" width="355" height="50.0" rx="14" fill="#d0ebff" stroke="#1971c2" stroke-width="2"/><rect x="549" y="441.75" width="400" height="50.0" rx="14" fill="#d3f9d8" stroke="#2f9e44" stroke-width="2"/><rect x="0" y="503.75" width="170" height="50.0" rx="14" fill="#f1f3f5" stroke="#495057" stroke-width="2"/><rect x="182" y="503.75" width="355" height="50.0" rx="14" fill="#d0ebff" stroke="#1971c2" stroke-width="2"/><rect x="549" y="503.75" width="400" height="50.0" rx="14" fill="#d3f9d8" stroke="#2f9e44" stroke-width="2"/><rect x="0" y="565.75" width="170" height="70.0" rx="14" fill="#f1f3f5" stroke="#495057" stroke-width="2"/><rect x="182" y="565.75" width="355" height="70.0" rx="14" fill="#d0ebff" stroke="#1971c2" stroke-width="2"/><rect x="549" y="565.75" width="400" height="70.0" rx="14" fill="#d3f9d8" stroke="#2f9e44" stroke-width="2"/><text x="85.0" y="26.875" font-size="19" text-anchor="middle" dominant-baseline="middle" fill="#ffffff">Tiêu chí</text><text x="359.5" y="26.875" font-size="19" text-anchor="middle" dominant-baseline="middle" fill="#ffffff">Phân tích dữ liệu</text><text x="749.0" y="26.875" font-size="19" text-anchor="middle" dominant-baseline="middle" fill="#ffffff">Khoa học dữ liệu</text><text x="85.0" y="96.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Mục tiêu</text><text x="359.5" y="96.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Điều gì đã xảy ra? Tại sao?</text><text x="749.0" y="96.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Điều gì sẽ xảy ra? Nên làm gì?</text><text x="85.0" y="168.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Phạm vi</text><text x="359.5" y="168.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Mô tả &amp; chẩn đoán</text><text x="749.0" y="158.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Toàn chu trình: dữ liệu → mô hình →</text><text x="749.0" y="178.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">ứng dụng</text><text x="85.0" y="250.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Công cụ</text><text x="359.5" y="250.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Excel, SQL, Tableau, Power BI</text><text x="749.0" y="240.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Python, R, Scikit-learn, Spark, AI</text><text x="749.0" y="260.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">tools</text><text x="85.0" y="332.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Kỹ thuật</text><text x="359.5" y="322.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Thống kê mô tả, trực quan hóa,</text><text x="359.5" y="342.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">so sánh</text><text x="749.0" y="332.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Học máy, dữ liệu lớn, tự động hóa</text><text x="85.0" y="404.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Đầu ra</text><text x="359.5" y="404.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Báo cáo, dashboard, chỉ số</text><text x="749.0" y="404.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Mô hình dự đoán, giải pháp thông minh</text><text x="85.0" y="466.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Độ phức tạp</text><text x="359.5" y="466.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Thấp → trung bình</text><text x="749.0" y="466.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Trung bình → cao</text><text x="85.0" y="528.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Nguồn lực</text><text x="359.5" y="528.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Linh hoạt, dễ triển khai</text><text x="749.0" y="528.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Đội ngũ đa kỹ năng + hạ tầng mạnh</text><text x="85.0" y="600.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Ứng dụng</text><text x="359.5" y="590.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">KPI, báo cáo thị trường, theo</text><text x="359.5" y="610.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">dõi tài chính</text><text x="749.0" y="590.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Dự đoán churn, cá nhân hóa, tối ưu</text><text x="749.0" y="610.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">chuỗi cung ứng</text></svg>