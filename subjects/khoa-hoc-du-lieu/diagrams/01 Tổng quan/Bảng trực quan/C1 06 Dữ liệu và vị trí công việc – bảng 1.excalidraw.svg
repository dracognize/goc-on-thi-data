<svg xmlns="http://www.w3.org/2000/svg" viewBox="-24 -24 1131 354" font-family="Excalifont, 'Segoe Print', 'Comic Sans MS', 'Comic Neue', cursive"><rect x="-24" y="-24" width="100%" height="100%" fill="#fff"/><defs><marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#495057"/></marker></defs><rect x="0" y="0" width="259" height="53.75" rx="14" fill="#495057" stroke="#495057" stroke-width="2"/><rect x="271" y="0" width="400" height="53.75" rx="14" fill="#1971c2" stroke="#1971c2" stroke-width="2"/><rect x="683" y="0" width="400" height="53.75" rx="14" fill="#2f9e44" stroke="#2f9e44" stroke-width="2"/><rect x="0" y="71.75" width="259" height="70.0" rx="14" fill="#f1f3f5" stroke="#495057" stroke-width="2"/><rect x="271" y="71.75" width="400" height="70.0" rx="14" fill="#d0ebff" stroke="#1971c2" stroke-width="2"/><rect x="683" y="71.75" width="400" height="70.0" rx="14" fill="#d3f9d8" stroke="#2f9e44" stroke-width="2"/><rect x="0" y="153.75" width="259" height="70.0" rx="14" fill="#f1f3f5" stroke="#495057" stroke-width="2"/><rect x="271" y="153.75" width="400" height="70.0" rx="14" fill="#d0ebff" stroke="#1971c2" stroke-width="2"/><rect x="683" y="153.75" width="400" height="70.0" rx="14" fill="#d3f9d8" stroke="#2f9e44" stroke-width="2"/><rect x="0" y="235.75" width="259" height="70.0" rx="14" fill="#f1f3f5" stroke="#495057" stroke-width="2"/><rect x="271" y="235.75" width="400" height="70.0" rx="14" fill="#d0ebff" stroke="#1971c2" stroke-width="2"/><rect x="683" y="235.75" width="400" height="70.0" rx="14" fill="#d3f9d8" stroke="#2f9e44" stroke-width="2"/><text x="129.5" y="26.875" font-size="19" text-anchor="middle" dominant-baseline="middle" fill="#ffffff">Loại</text><text x="471.0" y="26.875" font-size="19" text-anchor="middle" dominant-baseline="middle" fill="#ffffff">Đặc điểm</text><text x="883.0" y="26.875" font-size="19" text-anchor="middle" dominant-baseline="middle" fill="#ffffff">Ví dụ</text><text x="129.5" y="96.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Có cấu trúc</text><text x="129.5" y="116.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">(Structured)</text><text x="471.0" y="96.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Tổ chức rõ theo hàng – cột; dễ lưu,</text><text x="471.0" y="116.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">truy vấn bằng SQL, Excel</text><text x="883.0" y="96.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Bảng đơn hàng, danh sách khách hàng,</text><text x="883.0" y="116.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">báo cáo tài chính</text><text x="129.5" y="178.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Bán cấu trúc</text><text x="129.5" y="198.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">(Semi-structured)</text><text x="471.0" y="178.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Có cấu trúc nhưng linh hoạt, không cố</text><text x="471.0" y="198.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">định như bảng</text><text x="883.0" y="178.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Email, tệp JSON (JavaScript Object</text><text x="883.0" y="198.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Notation), XML</text><text x="129.5" y="260.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Phi cấu trúc</text><text x="129.5" y="280.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">(Unstructured)</text><text x="471.0" y="260.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Không có cấu trúc rõ, khó xử lý trực</text><text x="471.0" y="280.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">tiếp</text><text x="883.0" y="260.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Bài đăng Facebook, ảnh quảng cáo,</text><text x="883.0" y="280.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">video YouTube</text></svg>