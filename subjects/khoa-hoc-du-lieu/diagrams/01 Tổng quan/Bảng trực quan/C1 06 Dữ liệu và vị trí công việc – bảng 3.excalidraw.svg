" height="90.0" rx="14" fill="#f1f3f5" stroke="#495057" stroke-width="2"/><rect x="248" y="399.75" width="400" height="90.0" rx="14" fill="#d0ebff" stroke="#1971c2" stroke-width="2"/><rect x="660" y="399.75" width="370" height="90.0" rx="14" fill="#d3f9d8" stroke="#2f9e44" stroke-width="2"/><text x="118.0" y="26.875" font-size="19" text-anchor="middle" dominant-baseline="middle" fill="#ffffff">Nguồn</text><text x="448.0" y="26.875" font-size="19" text-anchor="middle" dominant-baseline="middle" fill="#ffffff">Mô tả</text><text x="845.0" y="26.875" font-size="19" text-anchor="middle" dominant-baseline="middle" fill="#ffffff">Ví dụ</text><text x="118.0" y="96.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Cơ sở dữ liệu (SQL,</text><text x="118.0" y="116.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Oracle)</text><text x="448.0" y="106.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Lưu dữ liệu có cấu trúc</text><text x="845.0" y="96.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Hệ thống bán hàng, quản lý khách</text><text x="845.0" y="116.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">hàng</text><text x="118.0" y="178.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Tệp văn bản, bảng</text><text x="118.0" y="198.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">tính, XML</text><text x="448.0" y="178.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Đầu vào từ khảo sát, sao kê, hành</text><text x="448.0" y="198.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">chính</text><text x="845.0" y="188.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">File khảo sát mức độ hài lòng</text><text x="118.0" y="270.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">API &amp; Web Services</text><text x="448.0" y="260.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Kết nối lấy dữ liệu từ hệ thống bên</text><text x="448.0" y="280.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">ngoài</text><text x="845.0" y="270.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Thời tiết, chứng khoán, tỷ giá</text><text x="118.0" y="352.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Web Scraping</text><text x="448.0" y="342.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Tự động thu thập từ website không có</text><text x="448.0" y="362.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">API</text><text x="845.0" y="352.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Giá sản phẩm trên sàn TMĐT</text><text x="118.0" y="434.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Streaming (thời gian</text><text x="118.0" y="454.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">thực)</text><text x="448.0" y="424.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Dữ liệu liên tục từ cảm biến, GPS,</text><text x="448.0" y="444.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">mạng xã hội; xử lý bằng Kafka, Spark,</text><text x="448.0" y="464.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Storm</text><text x="845.0" y="434.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Dòng tweet về thương hiệu theo</text><text x="845.0" y="454.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">thời gian thực</text></svg>