<svg xmlns="http://www.w3.org/2000/svg" viewBox="-24 -24 1072 436" font-family="Excalifont, 'Segoe Print', 'Comic Sans MS', 'Comic Neue', cursive"><rect x="-24" y="-24" width="100%" height="100%" fill="#fff"/><defs><marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#495057"/></marker></defs><rect x="0" y="0" width="400" height="53.75" rx="14" fill="#495057" stroke="#495057" stroke-width="2"/><rect x="412" y="0" width="341" height="53.75" rx="14" fill="#1971c2" stroke="#1971c2" stroke-width="2"/><rect x="765" y="0" width="259" height="53.75" rx="14" fill="#2f9e44" stroke="#2f9e44" stroke-width="2"/><rect x="0" y="71.75" width="400" height="70.0" rx="14" fill="#f1f3f5" stroke="#495057" stroke-width="2"/><rect x="412" y="71.75" width="341" height="70.0" rx="14" fill="#d0ebff" stroke="#1971c2" stroke-width="2"/><rect x="765" y="71.75" width="259" height="70.0" rx="14" fill="#d3f9d8" stroke="#2f9e44" stroke-width="2"/><rect x="0" y="153.75" width="400" height="70.0" rx="14" fill="#f1f3f5" stroke="#495057" stroke-width="2"/><rect x="412" y="153.75" width="341" height="70.0" rx="14" fill="#d0ebff" stroke="#1971c2" stroke-width="2"/><rect x="765" y="153.75" width="259" height="70.0" rx="14" fill="#d3f9d8" stroke="#2f9e44" stroke-width="2"/><rect x="0" y="235.75" width="400" height="70.0" rx="14" fill="#f1f3f5" stroke="#495057" stroke-width="2"/><rect x="412" y="235.75" width="341" height="70.0" rx="14" fill="#d0ebff" stroke="#1971c2" stroke-width="2"/><rect x="765" y="235.75" width="259" height="70.0" rx="14" fill="#d3f9d8" stroke="#2f9e44" stroke-width="2"/><rect x="0" y="317.75" width="400" height="70.0" rx="14" fill="#f1f3f5" stroke="#495057" stroke-width="2"/><rect x="412" y="317.75" width="341" height="70.0" rx="14" fill="#d0ebff" stroke="#1971c2" stroke-width="2"/><rect x="765" y="317.75" width="259" height="70.0" rx="14" fill="#d3f9d8" stroke="#2f9e44" stroke-width="2"/><text x="200.0" y="26.875" font-size="19" text-anchor="middle" dominant-baseline="middle" fill="#ffffff">Mô hình</text><text x="582.5" y="26.875" font-size="19" text-anchor="middle" dominant-baseline="middle" fill="#ffffff">Ưu điểm</text><text x="894.5" y="26.875" font-size="19" text-anchor="middle" dominant-baseline="middle" fill="#ffffff">Hạn chế</text><text x="200.0" y="106.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Hồi quy tuyến tính</text><text x="582.5" y="96.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Dễ hiểu, dễ triển khai, giải</text><text x="582.5" y="116.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">thích rõ</text><text x="894.5" y="96.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Giả định quan hệ tuyến</text><text x="894.5" y="116.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">tính</text><text x="200.0" y="188.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Cây quyết định hồi quy</text><text x="582.5" y="178.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Mô tả phi tuyến, trực quan, dễ</text><text x="582.5" y="198.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">giải thích</text><text x="894.5" y="178.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Dễ overfit nếu không</text><text x="894.5" y="198.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">kiểm soát</text><text x="200.0" y="270.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Rừng ngẫu nhiên (RF)</text><text x="582.5" y="260.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Chính xác, giảm overfit so với</text><text x="582.5" y="280.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">cây đơn</text><text x="894.5" y="260.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Khó giải thích từng đặc</text><text x="894.5" y="280.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">trưng</text><text x="200.0" y="342.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Gradient boosting (GB; slide gọi &quot;học</text><text x="200.0" y="362.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">tăng cường&quot;)</text><text x="582.5" y="342.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Rất chính xác, tốt cho dữ liệu</text><text x="582.5" y="362.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">phức tạp</text><text x="894.5" y="342.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Khó triển khai &amp; giải</text><text x="894.5" y="362.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">thích</text></svg>