<svg xmlns="http://www.w3.org/2000/svg" viewBox="-24 -24 1056 722" font-family="Excalifont, 'Segoe Print', 'Comic Sans MS', 'Comic Neue', cursive"><rect x="-24" y="-24" width="100%" height="100%" fill="#fff"/><defs><marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#495057"/></marker></defs><rect x="0" y="0" width="184" height="53.75" rx="14" fill="#495057" stroke="#495057" stroke-width="2"/><rect x="196" y="0" width="400" height="53.75" rx="14" fill="#1971c2" stroke="#1971c2" stroke-width="2"/><rect x="608" y="0" width="400" height="53.75" rx="14" fill="#2f9e44" stroke="#2f9e44" stroke-width="2"/><rect x="0" y="71.75" width="184" height="70.0" rx="14" fill="#f1f3f5" stroke="#495057" stroke-width="2"/><rect x="196" y="71.75" width="400" height="70.0" rx="14" fill="#d0ebff" stroke="#1971c2" stroke-width="2"/><rect x="608" y="71.75" width="400" height="70.0" rx="14" fill="#d3f9d8" stroke="#2f9e44" stroke-width="2"/><rect x="0" y="153.75" width="184" height="90.0" rx="14" fill="#f1f3f5" stroke="#495057" stroke-width="2"/><rect x="196" y="153.75" width="400" height="90.0" rx="14" fill="#d0ebff" stroke="#1971c2" stroke-width="2"/><rect x="608" y="153.75" width="400" height="90.0" rx="14" fill="#d3f9d8" stroke="#2f9e44" stroke-width="2"/><rect x="0" y="255.75" width="184" height="70.0" rx="14" fill="#f1f3f5" stroke="#495057" stroke-width="2"/><rect x="196" y="255.75" width="400" height="70.0" rx="14" fill="#d0ebff" stroke="#1971c2" stroke-width="2"/><rect x="608" y="255.75" width="400" height="70.0" rx="14" fill="#d3f9d8" stroke="#2f9e44" stroke-width="2"/><rect x="0" y="337.75" width="184" height="70.0" rx="14" fill="#f1f3f5" stroke="#495057" stroke-width="2"/><rect x="196" y="337.75" width="400" height="70.0" rx="14" fill="#d0ebff" stroke="#1971c2" stroke-width="2"/><rect x="608" y="337.75" width="400" height="70.0" rx="14" fill="#d3f9d8" stroke="#2f9e44" stroke-width="2"/><rect x="0" y="419.75" width="184" height="70.0" rx="14" fill="#f1f3f5" stroke="#495057" stroke-width="2"/><rect x="196" y="419.75" width="400" height="70.0" rx="14" fill="#d0ebff" stroke="#1971c2" stroke-width="2"/><rect x="608" y="419.75" width="400" height="70.0" rx="14" fill="#d3f9d8" stroke="#2f9e44" stroke-width="2"/><rect x="0" y="501.75" width="184" height="90.0" rx="14" fill="#f1f3f5" stroke="#495057" stroke-width="2"/><rect x="196" y="501.75" width="400" height="90.0" rx="14" fill="#d0ebff" stroke="#1971c2" stroke-width="2"/><rect x="608" y="501.75" width="400" height="90.0" rx="14" fill="#d3f9d8" stroke="#2f9e44" stroke-width="2"/><rect x="0" y="603.75" width="184" height="70.0" rx="14" fill="#f1f3f5" stroke="#495057" stroke-width="2"/><rect x="196" y="603.75" width="400" height="70.0" rx="14" fill="#d0ebff" stroke="#1971c2" stroke-width="2"/><rect x="608" y="603.75" width="400" height="70.0" rx="14" fill="#d3f9d8" stroke="#2f9e44" stroke-width="2"/><text x="92.0" y="26.875" font-size="19" text-anchor="middle" dominant-baseline="middle" fill="#ffffff">Bước</text><text x="396.0" y="26.875" font-size="19" text-anchor="middle" dominant-baseline="middle" fill="#ffffff">KHDL thông thường</text><text x="808.0" y="26.875" font-size="19" text-anchor="middle" dominant-baseline="middle" fill="#ffffff">KHDL trong Kinh tế &amp; Kinh doanh</text><text x="92.0" y="96.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">1. Xác định bài</text><text x="92.0" y="116.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">toán</text><text x="396.0" y="96.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Kỹ thuật: nhận diện hình ảnh, tín</text><text x="396.0" y="116.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">hiệu, tối ưu hệ thống</text><text x="808.0" y="96.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Tăng doanh thu, tối ưu chi phí, dự</text><text x="808.0" y="116.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">báo nhu cầu, quyết định chiến lược</text><text x="92.0" y="198.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">2. Thu thập</text><text x="396.0" y="188.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Cảm biến, hình ảnh, âm thanh, tín</text><text x="396.0" y="208.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">hiệu số</text><text x="808.0" y="178.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Dữ liệu dạng bảng: đơn hàng, tài</text><text x="808.0" y="198.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">chính, khách hàng, nhân sự; cần hiểu</text><text x="808.0" y="218.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">ngữ cảnh &amp; đơn vị đo</text><text x="92.0" y="280.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">3. Khai phá</text><text x="92.0" y="300.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">(EDA)</text><text x="396.0" y="290.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Thuật toán, phát hiện cấu trúc ẩn</text><text x="808.0" y="280.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Thống kê mô tả, biểu đồ để hiểu hành</text><text x="808.0" y="300.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">vi và xu hướng kinh doanh</text><text x="92.0" y="372.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">4. Xử lý</text><text x="396.0" y="372.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Làm sạch tín hiệu, chuẩn hóa đầu vào</text><text x="808.0" y="362.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Sửa lỗi nhập liệu, xử lý thiếu, phân</text><text x="808.0" y="382.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">nhóm khách hàng/sản phẩm</text><text x="92.0" y="454.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">5. Xây mô hình</text><text x="396.0" y="444.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Ưu tiên chính xác, mô hình phức tạp</text><text x="396.0" y="464.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">(deep learning, boosting)</text><text x="808.0" y="444.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Ưu tiên dễ hiểu: hồi quy, cây quyết</text><text x="808.0" y="464.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">định → hợp báo cáo quản trị</text><text x="92.0" y="546.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">6. Đánh giá</text><text x="396.0" y="546.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Chỉ số kỹ thuật: accuracy, F1, AUC</text><text x="808.0" y="526.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Hiệu quả kinh doanh: tiết kiệm bao</text><text x="808.0" y="546.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">nhiêu chi phí, tăng bao nhiêu doanh</text><text x="808.0" y="566.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">thu</text><text x="92.0" y="638.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">7. Triển khai</text><text x="396.0" y="628.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Nhúng vào hệ thống, thiết bị thông</text><text x="396.0" y="648.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">minh</text><text x="808.0" y="628.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Dashboard quản trị, báo cáo</text><text x="808.0" y="648.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">tuần/tháng, cập nhật theo thị trường</text></svg>