<svg xmlns="http://www.w3.org/2000/svg" viewBox="-24 -24 674 922" font-family="Excalifont, 'Segoe Print', 'Comic Sans MS', 'Comic Neue', cursive"><rect x="-24" y="-24" width="100%" height="100%" fill="#fff"/><defs><marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#495057"/></marker></defs><rect x="0" y="0" width="214" height="53.75" rx="14" fill="#495057" stroke="#495057" stroke-width="2"/><rect x="226" y="0" width="400" height="53.75" rx="14" fill="#1971c2" stroke="#1971c2" stroke-width="2"/><rect x="0" y="71.75" width="214" height="90.0" rx="14" fill="#f1f3f5" stroke="#495057" stroke-width="2"/><rect x="226" y="71.75" width="400" height="90.0" rx="14" fill="#d0ebff" stroke="#1971c2" stroke-width="2"/><rect x="0" y="173.75" width="214" height="110.0" rx="14" fill="#f1f3f5" stroke="#495057" stroke-width="2"/><rect x="226" y="173.75" width="400" height="110.0" rx="14" fill="#d0ebff" stroke="#1971c2" stroke-width="2"/><rect x="0" y="295.75" width="214" height="110.0" rx="14" fill="#f1f3f5" stroke="#495057" stroke-width="2"/><rect x="226" y="295.75" width="400" height="110.0" rx="14" fill="#d0ebff" stroke="#1971c2" stroke-width="2"/><rect x="0" y="417.75" width="214" height="110.0" rx="14" fill="#f1f3f5" stroke="#495057" stroke-width="2"/><rect x="226" y="417.75" width="400" height="110.0" rx="14" fill="#d0ebff" stroke="#1971c2" stroke-width="2"/><rect x="0" y="539.75" width="214" height="110.0" rx="14" fill="#f1f3f5" stroke="#495057" stroke-width="2"/><rect x="226" y="539.75" width="400" height="110.0" rx="14" fill="#d0ebff" stroke="#1971c2" stroke-width="2"/><rect x="0" y="661.75" width="214" height="90.0" rx="14" fill="#f1f3f5" stroke="#495057" stroke-width="2"/><rect x="226" y="661.75" width="400" height="90.0" rx="14" fill="#d0ebff" stroke="#1971c2" stroke-width="2"/><rect x="0" y="763.75" width="214" height="110.0" rx="14" fill="#f1f3f5" stroke="#495057" stroke-width="2"/><rect x="226" y="763.75" width="400" height="110.0" rx="14" fill="#d0ebff" stroke="#1971c2" stroke-width="2"/><text x="107.0" y="26.875" font-size="19" text-anchor="middle" dominant-baseline="middle" fill="#ffffff">Bước</text><text x="426.0" y="26.875" font-size="19" text-anchor="middle" dominant-baseline="middle" fill="#ffffff">Việc chính theo slide</text><text x="107.0" y="106.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">1. Xác định bài</text><text x="107.0" y="126.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">toán</text><text x="426.0" y="96.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Làm rõ mục tiêu kinh doanh/câu hỏi</text><text x="426.0" y="116.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">nghiên cứu. Xác định chỉ số đánh giá</text><text x="426.0" y="136.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">thành công và yêu cầu dữ liệu.</text><text x="107.0" y="218.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">2. Thu thập dữ</text><text x="107.0" y="238.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">liệu</text><text x="426.0" y="198.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Từ CSDL nội bộ, hệ thống giao dịch,</text><text x="426.0" y="218.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">API, dữ liệu mở, web scraping. Tuân</text><text x="426.0" y="238.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">thủ pháp lý và đạo đức. Lưu trữ có hệ</text><text x="426.0" y="258.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">thống, an toàn.</text><text x="107.0" y="340.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">3. Khai phá dữ</text><text x="107.0" y="360.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">liệu</text><text x="426.0" y="320.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Thống kê mô tả + trực quan hóa để</text><text x="426.0" y="340.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">thấy cấu trúc, phân phối, xu hướng,</text><text x="426.0" y="360.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">quan hệ giữa biến. Phát hiện bất</text><text x="426.0" y="380.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">thường, hình thành giả thuyết.</text><text x="107.0" y="472.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">4. Xử lý dữ liệu</text><text x="426.0" y="442.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Làm sạch: giá trị thiếu, nhiễu, lỗi</text><text x="426.0" y="462.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">nhập, chuẩn hóa định dạng. Biến đổi</text><text x="426.0" y="482.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">và tích hợp: mã hóa biến phân loại,</text><text x="426.0" y="502.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">tạo đặc trưng mới.</text><text x="107.0" y="584.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">5. Xây dựng mô</text><text x="107.0" y="604.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">hình</text><text x="426.0" y="564.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Chọn thuật toán (giám sát/không giám</text><text x="426.0" y="584.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">sát), huấn luyện trên tập đào tạo.</text><text x="426.0" y="604.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Chia tập huấn luyện, kiểm tra, kiểm</text><text x="426.0" y="624.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">định chéo; tối ưu tham số.</text><text x="107.0" y="696.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">6. Đánh giá mô</text><text x="107.0" y="716.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">hình</text><text x="426.0" y="686.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Chỉ số accuracy, precision, recall,</text><text x="426.0" y="706.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">F1, AUC… So sánh mô hình; xét tính</text><text x="426.0" y="726.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">khả giải, ổn định, ý nghĩa thực tiễn.</text><text x="107.0" y="808.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">7. Triển khai &amp;</text><text x="107.0" y="828.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">giám sát</text><text x="426.0" y="788.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Đưa vào web, ứng dụng, dashboard, báo</text><text x="426.0" y="808.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">cáo động. Theo dõi hiệu suất, cập</text><text x="426.0" y="828.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">nhật khi có dữ liệu mới hoặc hiệu</text><text x="426.0" y="848.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">suất giảm.</text></svg>