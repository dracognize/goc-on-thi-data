<svg xmlns="http://www.w3.org/2000/svg" viewBox="-24 -24 886 518" font-family="Excalifont, 'Segoe Print', 'Comic Sans MS', 'Comic Neue', cursive"><rect x="-24" y="-24" width="100%" height="100%" fill="#fff"/><defs><marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#495057"/></marker></defs><rect x="0" y="0" width="207" height="53.75" rx="14" fill="#495057" stroke="#495057" stroke-width="2"/><rect x="219" y="0" width="311" height="53.75" rx="14" fill="#1971c2" stroke="#1971c2" stroke-width="2"/><rect x="542" y="0" width="296" height="53.75" rx="14" fill="#2f9e44" stroke="#2f9e44" stroke-width="2"/><rect x="0" y="71.75" width="207" height="70.0" rx="14" fill="#f1f3f5" stroke="#495057" stroke-width="2"/><rect x="219" y="71.75" width="311" height="70.0" rx="14" fill="#d0ebff" stroke="#1971c2" stroke-width="2"/><rect x="542" y="71.75" width="296" height="70.0" rx="14" fill="#d3f9d8" stroke="#2f9e44" stroke-width="2"/><rect x="0" y="153.75" width="207" height="70.0" rx="14" fill="#f1f3f5" stroke="#495057" stroke-width="2"/><rect x="219" y="153.75" width="311" height="70.0" rx="14" fill="#d0ebff" stroke="#1971c2" stroke-width="2"/><rect x="542" y="153.75" width="296" height="70.0" rx="14" fill="#d3f9d8" stroke="#2f9e44" stroke-width="2"/><rect x="0" y="235.75" width="207" height="70.0" rx="14" fill="#f1f3f5" stroke="#495057" stroke-width="2"/><rect x="219" y="235.75" width="311" height="70.0" rx="14" fill="#d0ebff" stroke="#1971c2" stroke-width="2"/><rect x="542" y="235.75" width="296" height="70.0" rx="14" fill="#d3f9d8" stroke="#2f9e44" stroke-width="2"/><rect x="0" y="317.75" width="207" height="70.0" rx="14" fill="#f1f3f5" stroke="#495057" stroke-width="2"/><rect x="219" y="317.75" width="311" height="70.0" rx="14" fill="#d0ebff" stroke="#1971c2" stroke-width="2"/><rect x="542" y="317.75" width="296" height="70.0" rx="14" fill="#d3f9d8" stroke="#2f9e44" stroke-width="2"/><rect x="0" y="399.75" width="207" height="70.0" rx="14" fill="#f1f3f5" stroke="#495057" stroke-width="2"/><rect x="219" y="399.75" width="311" height="70.0" rx="14" fill="#d0ebff" stroke="#1971c2" stroke-width="2"/><rect x="542" y="399.75" width="296" height="70.0" rx="14" fill="#d3f9d8" stroke="#2f9e44" stroke-width="2"/><text x="103.5" y="26.875" font-size="19" text-anchor="middle" dominant-baseline="middle" fill="#ffffff">Tiêu chí</text><text x="374.5" y="26.875" font-size="19" text-anchor="middle" dominant-baseline="middle" fill="#ffffff">Ý nghĩa</text><text x="690.0" y="26.875" font-size="19" text-anchor="middle" dominant-baseline="middle" fill="#ffffff">Ví dụ lỗi</text><text x="103.5" y="96.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Đầy đủ</text><text x="103.5" y="116.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">(completeness)</text><text x="374.5" y="106.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Không bị thiếu</text><text x="690.0" y="106.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Thiếu tổng tiền</text><text x="103.5" y="178.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Chính xác</text><text x="103.5" y="198.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">(accuracy)</text><text x="374.5" y="188.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Đúng logic, không sai lệch</text><text x="690.0" y="178.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">80.000 nhập thành 800.000;</text><text x="690.0" y="198.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">tuổi 200</text><text x="103.5" y="260.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Nhất quán</text><text x="103.5" y="280.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">(consistency)</text><text x="374.5" y="260.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Định dạng, logic đồng nhất</text><text x="374.5" y="280.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">giữa nguồn</text><text x="690.0" y="270.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Hai nguồn hai kiểu ngày</text><text x="103.5" y="342.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Duy nhất</text><text x="103.5" y="362.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">(uniqueness)</text><text x="374.5" y="352.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Không trùng không cần thiết</text><text x="690.0" y="352.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Một hóa đơn nhập hai lần</text><text x="103.5" y="424.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Kịp thời</text><text x="103.5" y="444.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">(timeliness)</text><text x="374.5" y="434.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Cập nhật mới, đúng thời gian</text><text x="690.0" y="424.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Báo cáo thiếu giao dịch</text><text x="690.0" y="444.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">chiều nay</text></svg>