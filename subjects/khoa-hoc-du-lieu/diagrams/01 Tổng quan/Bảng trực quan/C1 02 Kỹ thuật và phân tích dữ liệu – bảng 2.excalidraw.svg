<svg xmlns="http://www.w3.org/2000/svg" viewBox="-24 -24 908 562" font-family="Excalifont, 'Segoe Print', 'Comic Sans MS', 'Comic Neue', cursive"><rect x="-24" y="-24" width="100%" height="100%" fill="#fff"/><defs><marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#495057"/></marker></defs><rect x="0" y="0" width="259" height="77.5" rx="14" fill="#495057" stroke="#495057" stroke-width="2"/><rect x="271" y="0" width="177" height="77.5" rx="14" fill="#1971c2" stroke="#1971c2" stroke-width="2"/><rect x="460" y="0" width="400" height="77.5" rx="14" fill="#2f9e44" stroke="#2f9e44" stroke-width="2"/><rect x="0" y="95.5" width="259" height="90.0" rx="14" fill="#f1f3f5" stroke="#495057" stroke-width="2"/><rect x="271" y="95.5" width="177" height="90.0" rx="14" fill="#d0ebff" stroke="#1971c2" stroke-width="2"/><rect x="460" y="95.5" width="400" height="90.0" rx="14" fill="#d3f9d8" stroke="#2f9e44" stroke-width="2"/><rect x="0" y="197.5" width="259" height="70.0" rx="14" fill="#f1f3f5" stroke="#495057" stroke-width="2"/><rect x="271" y="197.5" width="177" height="70.0" rx="14" fill="#d0ebff" stroke="#1971c2" stroke-width="2"/><rect x="460" y="197.5" width="400" height="70.0" rx="14" fill="#d3f9d8" stroke="#2f9e44" stroke-width="2"/><rect x="0" y="279.5" width="259" height="70.0" rx="14" fill="#f1f3f5" stroke="#495057" stroke-width="2"/><rect x="271" y="279.5" width="177" height="70.0" rx="14" fill="#d0ebff" stroke="#1971c2" stroke-width="2"/><rect x="460" y="279.5" width="400" height="70.0" rx="14" fill="#d3f9d8" stroke="#2f9e44" stroke-width="2"/><rect x="0" y="361.5" width="259" height="70.0" rx="14" fill="#f1f3f5" stroke="#495057" stroke-width="2"/><rect x="271" y="361.5" width="177" height="70.0" rx="14" fill="#d0ebff" stroke="#1971c2" stroke-width="2"/><rect x="460" y="361.5" width="400" height="70.0" rx="14" fill="#d3f9d8" stroke="#2f9e44" stroke-width="2"/><rect x="0" y="443.5" width="259" height="70.0" rx="14" fill="#f1f3f5" stroke="#495057" stroke-width="2"/><rect x="271" y="443.5" width="177" height="70.0" rx="14" fill="#d0ebff" stroke="#1971c2" stroke-width="2"/><rect x="460" y="443.5" width="400" height="70.0" rx="14" fill="#d3f9d8" stroke="#2f9e44" stroke-width="2"/><text x="129.5" y="38.75" font-size="19" text-anchor="middle" dominant-baseline="middle" fill="#ffffff">Giai đoạn</text><text x="359.5" y="26.875" font-size="19" text-anchor="middle" dominant-baseline="middle" fill="#ffffff">Tên tiếng</text><text x="359.5" y="50.625" font-size="19" text-anchor="middle" dominant-baseline="middle" fill="#ffffff">Anh</text><text x="660.0" y="38.75" font-size="19" text-anchor="middle" dominant-baseline="middle" fill="#ffffff">Mô tả</text><text x="129.5" y="130.5" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">1. Xác định nguồn sinh</text><text x="129.5" y="150.5" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">dữ liệu</text><text x="359.5" y="140.5" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Source Systems</text><text x="660.0" y="120.5" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Hệ thống gốc tạo dữ liệu: phần mềm</text><text x="660.0" y="140.5" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">nghiệp vụ, cảm biến, giao dịch thương</text><text x="660.0" y="160.5" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">mại</text><text x="129.5" y="232.5" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">2. Tổ chức lưu trữ</text><text x="359.5" y="232.5" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Storage</text><text x="660.0" y="222.5" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Lưu có tổ chức: cơ sở dữ liệu, kho dữ</text><text x="660.0" y="242.5" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">liệu, hồ dữ liệu</text><text x="129.5" y="314.5" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">3. Thu nạp</text><text x="359.5" y="314.5" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Data Ingestion</text><text x="660.0" y="304.5" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Trích xuất từ nguồn, chuyển vào lưu</text><text x="660.0" y="324.5" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">trữ trung tâm; batch hoặc streaming</text><text x="129.5" y="396.5" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">4. Biến đổi</text><text x="359.5" y="386.5" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Data</text><text x="359.5" y="406.5" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Transformation</text><text x="660.0" y="386.5" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Xử lý, làm sạch, chuẩn hóa để sẵn</text><text x="660.0" y="406.5" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">sàng phân tích</text><text x="129.5" y="478.5" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">5. Phục vụ</text><text x="359.5" y="478.5" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Data Serving</text><text x="660.0" y="468.5" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Cung cấp dữ liệu đã xử lý cho người</text><text x="660.0" y="488.5" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">dùng cuối, ứng dụng, học máy</text></svg>