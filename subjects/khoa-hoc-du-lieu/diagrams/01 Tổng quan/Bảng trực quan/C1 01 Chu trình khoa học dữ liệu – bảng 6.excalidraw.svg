<svg xmlns="http://www.w3.org/2000/svg" viewBox="-24 -24 1168 394" font-family="Excalifont, 'Segoe Print', 'Comic Sans MS', 'Comic Neue', cursive"><rect x="-24" y="-24" width="100%" height="100%" fill="#fff"/><defs><marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#495057"/></marker></defs><rect x="0" y="0" width="296" height="53.75" rx="14" fill="#495057" stroke="#495057" stroke-width="2"/><rect x="308" y="0" width="400" height="53.75" rx="14" fill="#1971c2" stroke="#1971c2" stroke-width="2"/><rect x="720" y="0" width="400" height="53.75" rx="14" fill="#2f9e44" stroke="#2f9e44" stroke-width="2"/><rect x="0" y="71.75" width="296" height="90.0" rx="14" fill="#f1f3f5" stroke="#495057" stroke-width="2"/><rect x="308" y="71.75" width="400" height="90.0" rx="14" fill="#d0ebff" stroke="#1971c2" stroke-width="2"/><rect x="720" y="71.75" width="400" height="90.0" rx="14" fill="#d3f9d8" stroke="#2f9e44" stroke-width="2"/><rect x="0" y="173.75" width="296" height="90.0" rx="14" fill="#f1f3f5" stroke="#495057" stroke-width="2"/><rect x="308" y="173.75" width="400" height="90.0" rx="14" fill="#d0ebff" stroke="#1971c2" stroke-width="2"/><rect x="720" y="173.75" width="400" height="90.0" rx="14" fill="#d3f9d8" stroke="#2f9e44" stroke-width="2"/><rect x="0" y="275.75" width="296" height="70.0" rx="14" fill="#f1f3f5" stroke="#495057" stroke-width="2"/><rect x="308" y="275.75" width="400" height="70.0" rx="14" fill="#d0ebff" stroke="#1971c2" stroke-width="2"/><rect x="720" y="275.75" width="400" height="70.0" rx="14" fill="#d3f9d8" stroke="#2f9e44" stroke-width="2"/><text x="148.0" y="26.875" font-size="19" text-anchor="middle" dominant-baseline="middle" fill="#ffffff">Lĩnh vực</text><text x="508.0" y="26.875" font-size="19" text-anchor="middle" dominant-baseline="middle" fill="#ffffff">Vai trò chính</text><text x="920.0" y="26.875" font-size="19" text-anchor="middle" dominant-baseline="middle" fill="#ffffff">Bước của chu trình</text><text x="148.0" y="106.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Kỹ thuật dữ liệu (Data</text><text x="148.0" y="126.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Engineering)</text><text x="508.0" y="106.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Xây hạ tầng, thu thập dữ liệu đúng</text><text x="508.0" y="126.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">cách</text><text x="920.0" y="96.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Bước 1 (xác định yêu cầu và nguồn dữ</text><text x="920.0" y="116.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">liệu khả dụng), Bước 2 (pipeline,</text><text x="920.0" y="136.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">tích hợp, lưu trữ)</text><text x="148.0" y="208.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Phân tích dữ liệu (Data</text><text x="148.0" y="228.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Analytics)</text><text x="508.0" y="208.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Hiểu dữ liệu, khám phá xu hướng,</text><text x="508.0" y="228.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">chuẩn bị đầu vào cho mô hình</text><text x="920.0" y="198.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Bước 3 (phân phối, xu hướng, bất</text><text x="920.0" y="218.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">thường), Bước 4 (làm sạch, biến đổi,</text><text x="920.0" y="238.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">tạo đặc trưng)</text><text x="148.0" y="310.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Học máy (Machine Learning)</text><text x="508.0" y="300.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Tạo mô hình dự đoán, hỗ trợ quyết</text><text x="508.0" y="320.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">định tự động</text><text x="920.0" y="300.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Bước 5, 6 (hiệu suất, tính khả giải),</text><text x="920.0" y="320.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">7 (đưa vào hệ thống, theo dõi)</text></svg>