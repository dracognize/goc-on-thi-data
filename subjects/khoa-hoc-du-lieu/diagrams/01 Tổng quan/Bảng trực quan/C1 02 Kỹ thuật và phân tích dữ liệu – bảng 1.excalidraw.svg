/text><text x="382.0" y="96.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Máy bán hàng ghi mã 001 và số tiền</text><text x="382.0" y="116.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">80.000 đồng</text><text x="85.0" y="188.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Lưu trữ</text><text x="382.0" y="178.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Kho dữ liệu giữ bảng hóa đơn của mọi</text><text x="382.0" y="198.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">cửa hàng</text><text x="85.0" y="280.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Thu nạp</text><text x="382.0" y="260.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Cuối buổi sao chép cả tệp (batch)</text><text x="382.0" y="280.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">hoặc gửi từng hóa đơn khi phát sinh</text><text x="382.0" y="300.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">(streaming)</text><text x="85.0" y="372.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Biến đổi</text><text x="382.0" y="362.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Đổi &quot;80,000&quot; dạng chuỗi thành số; đổi</text><text x="382.0" y="382.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">ngày sang kiểu datetime</text><text x="85.0" y="454.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Phục vụ</text><text x="382.0" y="444.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Dashboard tổng doanh thu theo cửa</text><text x="382.0" y="464.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">hàng</text></svg>