<svg xmlns="http://www.w3.org/2000/svg" viewBox="-24 -24 1049 476" font-family="Excalifont, 'Segoe Print', 'Comic Sans MS', 'Comic Neue', cursive"><rect x="-24" y="-24" width="100%" height="100%" fill="#fff"/><defs><marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#495057"/></marker></defs><rect x="0" y="0" width="177" height="53.75" rx="14" fill="#495057" stroke="#495057" stroke-width="2"/><rect x="189" y="0" width="400" height="53.75" rx="14" fill="#1971c2" stroke="#1971c2" stroke-width="2"/><rect x="601" y="0" width="400" height="53.75" rx="14" fill="#2f9e44" stroke="#2f9e44" stroke-width="2"/><rect x="0" y="71.75" width="177" height="90.0" rx="14" fill="#f1f3f5" stroke="#495057" stroke-width="2"/><rect x="189" y="71.75" width="400" height="90.0" rx="14" fill="#d0ebff" stroke="#1971c2" stroke-width="2"/><rect x="601" y="71.75" width="400" height="90.0" rx="14" fill="#d3f9d8" stroke="#2f9e44" stroke-width="2"/><rect x="0" y="173.75" width="177" height="90.0" rx="14" fill="#f1f3f5" stroke="#495057" stroke-width="2"/><rect x="189" y="173.75" width="400" height="90.0" rx="14" fill="#d0ebff" stroke="#1971c2" stroke-width="2"/><rect x="601" y="173.75" width="400" height="90.0" rx="14" fill="#d3f9d8" stroke="#2f9e44" stroke-width="2"/><rect x="0" y="275.75" width="177" height="70.0" rx="14" fill="#f1f3f5" stroke="#495057" stroke-width="2"/><rect x="189" y="275.75" width="400" height="70.0" rx="14" fill="#d0ebff" stroke="#1971c2" stroke-width="2"/><rect x="601" y="275.75" width="400" height="70.0" rx="14" fill="#d3f9d8" stroke="#2f9e44" stroke-width="2"/><rect x="0" y="357.75" width="177" height="70.0" rx="14" fill="#f1f3f5" stroke="#495057" stroke-width="2"/><rect x="189" y="357.75" width="400" height="70.0" rx="14" fill="#d0ebff" stroke="#1971c2" stroke-width="2"/><rect x="601" y="357.75" width="400" height="70.0" rx="14" fill="#d3f9d8" stroke="#2f9e44" stroke-width="2"/><text x="88.5" y="26.875" font-size="19" text-anchor="middle" dominant-baseline="middle" fill="#ffffff">Bước</text><text x="389.0" y="26.875" font-size="19" text-anchor="middle" dominant-baseline="middle" fill="#ffffff">Mô tả</text><text x="801.0" y="26.875" font-size="19" text-anchor="middle" dominant-baseline="middle" fill="#ffffff">Ví dụ TMĐT/nhà hàng</text><text x="88.5" y="106.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">1. Xác định dữ</text><text x="88.5" y="126.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">liệu</text><text x="389.0" y="96.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Rõ câu hỏi; chọn loại dữ liệu; đánh</text><text x="389.0" y="116.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">giá tính sẵn có, nguồn gốc, độ tin</text><text x="389.0" y="136.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">cậy</text><text x="801.0" y="96.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">&quot;Khách nào mua nhiều nhất tháng 7?&quot; →</text><text x="801.0" y="116.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">dữ liệu đơn hàng, khách hàng, sản</text><text x="801.0" y="136.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">phẩm</text><text x="88.5" y="208.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">2. Chuẩn bị &amp;</text><text x="88.5" y="228.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">xử lý</text><text x="389.0" y="208.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Bỏ trùng, xử lý thiếu, chuẩn hóa đơn</text><text x="389.0" y="228.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">vị, mã hóa biến phân loại</text><text x="801.0" y="198.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Khách không ghi địa chỉ → bổ</text><text x="801.0" y="218.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">sung/loại; ngày không đồng nhất →</text><text x="801.0" y="238.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">chuẩn hóa</text><text x="88.5" y="310.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">3. Phân tích</text><text x="389.0" y="300.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Thống kê mô tả, biểu đồ</text><text x="389.0" y="320.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">cột/đường/tròn, phân nhóm, lọc top</text><text x="801.0" y="310.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Tổng doanh thu theo tuần; top 5 khách</text><text x="88.5" y="392.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">4. Truyền đạt</text><text x="389.0" y="382.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Biểu đồ, bảng, dashboard, slide; rút</text><text x="389.0" y="402.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">ý nghĩa, đề xuất</text><text x="801.0" y="382.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Đề xuất khuyến mãi cho nhóm khách</text><text x="801.0" y="402.75" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">trung thành</text></svg>