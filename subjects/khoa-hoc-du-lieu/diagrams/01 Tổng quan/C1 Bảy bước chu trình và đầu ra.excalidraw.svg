t x="140.0" y="42.5" font-size="20" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">1. Xác định bài toán</text><text x="140.0" y="67.5" font-size="20" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">→ mục tiêu, KPI</text><text x="470.0" y="42.5" font-size="20" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">2. Thu thập</text><text x="470.0" y="67.5" font-size="20" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">→ dữ liệu từ nguồn</text><text x="800.0" y="42.5" font-size="20" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">3. Khai phá</text><text x="800.0" y="67.5" font-size="20" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">→ biểu đồ, giả thuyết</text><text x="1147.5" y="42.5" font-size="20" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">4. Xử lý</text><text x="1147.5" y="67.5" font-size="20" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">→ dữ liệu sạch, đặc trưng</text><text x="1136.5" y="242.5" font-size="20" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">5. Xây mô hình</text><text x="1136.5" y="267.5" font-size="20" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">→ mô hình đã huấn luyện</text><text x="817.5" y="242.5" font-size="20" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">6. Đánh giá</text><text x="817.5" y="267.5" font-size="20" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">→ accuracy, F1, lợi nhuận</text><text x="482.0" y="242.5" font-size="20" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">7. Triển khai &amp; giám sát</text><text x="482.0" y="267.5" font-size="20" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">→ chấm điểm, cập nhật</text><text x="140.0" y="232.5" font-size="20" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">KT dữ liệu: 1–2</text><text x="140.0" y="257.5" font-size="20" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Phân tích: 3–4</text><text x="140.0" y="282.5" font-size="20" text-anchor="middle" dominant-baseline="middle" fill="#1e1e1e">Học máy: 5–7</text><text x="311.0" y="138.6" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#495057">dữ liệu mới</text><text x="0" y="-63.2" font-size="28" text-anchor="start" dominant-baseline="middle" fill="#1e1e1e">Bước nào cho ra đầu ra nào? (Lec1 tr. 10)</text></svg>